/* ---------------- lógica pura ---------------- */

function norm(s) {
  return (s || "").toString().trim().toLowerCase()
    .replace(/[áàä]/g, "a").replace(/[éèë]/g, "e").replace(/[íìï]/g, "i")
    .replace(/[óòö]/g, "o").replace(/[úùü]/g, "u").replace(/ñ/g, "n");
}
function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }

// Los anuncios llegan en inglés tanto como en español. El texto se guarda
// como lo pegaste; esta tabla sólo se usa para emparejar contra el
// directorio, los precios y las partidas arancelarias.
const SINONIMOS = {
  "dominican republic": "republica dominicana", "dominicana": "republica dominicana",
  "costa rican": "costa rica", "brazil": "brasil", "spain": "espana",
  "germany": "alemania", "united states": "estados unidos", "usa": "estados unidos",
  "netherlands": "paises bajos", "holland": "paises bajos", "holanda": "paises bajos",
  "united kingdom": "reino unido",
  "cocoa": "cacao", "cacao beans": "cacao", "coffee": "cafe", "sugar": "azucar",
  "banana": "banano", "bananas": "banano", "avocado": "aguacate", "avocados": "aguacate",
  "tobacco": "tabaco", "rice": "arroz", "corn": "maiz", "maize": "maiz",
  "soybean": "soya", "soybeans": "soya", "copper": "cobre", "shrimp": "camaron",
  "gold": "oro", "flowers": "flores", "grapes": "uva", "pineapple": "pina",
  "sesame": "ajonjoli", "fruit": "fruta",
};

function clave(texto) {
  let s = norm(texto);
  for (const ingles in SINONIMOS) {
    const destino = SINONIMOS[ingles];
    // Si ya está en su forma final no se vuelve a tocar: sin esto
    // "dominican republic" pasaba por dos reglas y quedaba duplicado.
    if (s.includes(destino)) continue;
    s = s.replace(new RegExp("\\b" + ingles + "\\b", "g"), destino);
  }
  return s;
}

function usd(n) { return "USD " + Math.round(n).toLocaleString("es-DO"); }

function toneladas(d) {
  const f = A_TONELADA[norm(d.unidad)];
  return f && num(d.cantidad) ? num(d.cantidad) * f : null;
}

function valorCarga(d) {
  if (num(d.precio) && num(d.cantidad)) return { valor: num(d.cantidad) * num(d.precio), estimado: false };
  const t = toneladas(d);
  if (t === null) return { valor: null, estimado: false };
  const p = clave(d.producto);
  for (const clave in PRECIOS_REF) if (p.includes(clave)) return { valor: t * PRECIOS_REF[clave], estimado: true };
  return { valor: null, estimado: false };
}

function capacidadPais(d) {
  const pais = clave(d.paisOrigen), prod = clave(d.producto);
  for (const [p, k, t] of CAPACIDAD) if (pais.includes(p) && prod.includes(k)) return t;
  return null;
}

const PESOS = { stop: 40, alta: 20, media: 10, info: 0 };

function evaluar(d) {
  const b = [];
  const push = function (sev, texto) { b.push({ sev: sev, texto: texto }); };

  // Comisión contra el valor real de la carga.
  if (!num(d.fee)) {
    push("alta", "No hay comisión definida por escrito. Definila en número y en porcentaje antes de mover nada.");
  } else {
    const { valor, estimado } = valorCarga(d);
    if (valor === null) {
      push("info", "No se puede calcular el valor de la carga. Cargá el precio por unidad para revisar si la comisión es realista.");
    } else {
      const r = num(d.fee) / valor;
      const det = "comisión " + usd(num(d.fee)) + " sobre una carga de ~" + usd(valor) +
        " (" + (r * 100).toFixed(2) + "%, " + (estimado ? "estimado grueso" : "precio que cargaste") + ")";
      if (r > 0.05) push("stop", "La comisión se come más del 5% de la carga: " + det + ". En commodities los márgenes no dan para eso; casi siempre significa que el volumen o el precio del anuncio es inventado.");
      else if (r > 0.02) push("alta", "Comisión por encima del 2% de la carga: " + det + ". Pedí que te expliquen de dónde sale ese dinero.");
      else if (r < 0.0005) push("media", "Comisión muy chica para el trabajo que implica: " + det + ".");
    }
  }

  // Volumen contra lo que el país realmente exporta.
  const t = toneladas(d), cap = capacidadPais(d);
  if (t !== null && cap) {
    const prop = t / cap;
    if (prop >= 0.5) push("stop", Math.round(t).toLocaleString("es-DO") + " t es ~" + Math.round(prop * 100) + "% de lo que " + d.paisOrigen + " exporta al año de " + d.producto + ". Ese volumen no existe disponible en spot.");
    else if (prop >= 0.03) push("media", Math.round(t).toLocaleString("es-DO") + " t es ~" + Math.round(prop * 100) + "% de la exportación anual de " + d.paisOrigen + ". Ningún exportador individual lo cubre solo: apuntá a cooperativas o a entregas parciales durante la cosecha.");
  }

  // Contraparte.
  if (!(d.comprador || "").trim()) push("alta", "No hay comprador final identificado. Sin razón social verificable no hay trato, sólo un anuncio.");
  const fuente = norm(d.fuente);
  if (["instagram", "facebook", "tiktok", "whatsapp", "telegram", "grupo"].some(function (p) { return fuente.includes(p); }))
    push("media", "La oportunidad viene de un anuncio público: asumí que hay una cadena de intermediarios delante tuyo. Pedí que te muestren el mandato o la LOI firmada del comprador final.");

  // Términos de pago.
  const pago = norm(d.pago);
  const jerga = JERGA_FRAUDE.filter(function (j) { return pago.includes(j); });
  if (jerga.length) push("stop", "Los términos de pago usan jerga de cadena de fraude (" + jerga.join(", ").trim() + "). En comercio real se paga con carta de crédito irrevocable a la vista o contra documentos. Salite.");
  const todo = norm(d.pago + " " + (d.requisitos || []).join(" "));
  if (SENALES_ADELANTO.some(function (s) { return todo.includes(s); }))
    push("stop", "Te están pidiendo pagar algo por adelantado. Un intermediario cobra al cierre, nunca paga por entrar.");
  if (!(d.pago || "").trim()) push("media", "Faltan los términos de pago. Preguntalos antes de buscar proveedor: definen si el exportador puede siquiera participar.");
  if (!(d.incoterm || "").trim()) push("media", "Falta el Incoterm (FOB, CIF, EXW…). Sin eso el precio no significa nada y no podés comparar ofertas.");

  // Proceso.
  if (ORDEN_ETAPA.indexOf(d.etapa) >= ORDEN_ETAPA.indexOf("presentada") && !d.acuerdoFirmado)
    push("stop", "Vas a presentar (o ya presentaste) sin acuerdo NCND firmado. Así es como te sacan del trato. Generalo en Documentos y firmá primero.");
  if (d.fechaLimite) {
    const dias = Math.round((new Date(d.fechaLimite + "T12:00:00") - new Date()) / 86400000);
    if (dias < 0) push("media", "El plazo venció hace " + Math.abs(dias) + " días.");
    else if (dias <= 7) push("media", "Quedan " + dias + " días. La urgencia extrema es una táctica clásica para que no verifiques: no apures la revisión.");
  }

  const orden = { stop: 0, alta: 1, media: 2, info: 3 };
  b.sort(function (x, y) { return orden[x.sev] - orden[y.sev]; });
  const score = Math.max(0, 100 - b.reduce(function (s, x) { return s + PESOS[x.sev]; }, 0));
  const nivel = b.some(function (x) { return x.sev === "stop"; }) ? "rojo" : score >= 70 ? "verde" : score >= 40 ? "amarillo" : "rojo";
  return { score: score, nivel: nivel, banderas: b };
}

function exigencias(d) {
  const base = [
    "LOI o ICPO del comprador final, firmada, con razón social y número fiscal.",
    "Especificaciones completas por escrito: calidad, empaque, entrega.",
    "Prueba de capacidad de pago: carta de crédito preavisada o referencia bancaria.",
    "Acuerdo NCND firmado por ambas partes ANTES de dar nombres o poner a nadie en contacto.",
    "Un solo hilo de correo con vos siempre en copia. Nada por teléfono sin resumen escrito.",
  ];
  if ((d.requisitos || []).length) base.push("Documentación técnica que pidió el comprador: " + d.requisitos.join("; ") + ".");
  return base;
}

function fuentesDe(d) {
  const out = [], vistos = new Set();
  const add = function (f) { if (f && !vistos.has(f[0])) { vistos.add(f[0]); out.push(f); } };
  const pais = clave(d.paisOrigen), prod = clave(d.producto);
  const destino = clave(d.paisDestino);
  for (const [p, k, lista] of GREMIOS) if (pais.includes(p) && prod.includes(k)) lista.forEach(add);
  for (const c in AGENCIAS) if (pais.includes(c)) add(AGENCIAS[c]);
  for (const c in VERIFICACION) if (pais.includes(c)) VERIFICACION[c].forEach(add);
  for (const c in AGENCIAS) if (destino && destino.includes(c)) add(AGENCIAS[c]);
  GLOBALES.forEach(add);
  return out;
}

function consultasDe(d) {
  const prod = d.producto || "producto", pais = d.paisOrigen || "";
  const lugar = ((d.ciudadOrigen || "") + " " + pais).trim();
  const q = [
    '"exportador de ' + prod + '" ' + lugar,
    '"' + prod + '" exportador ' + pais + ' "FOB" contacto correo',
    prod + " exporter " + pais + ' wholesale "metric tons"',
    prod + ' "cooperativa" OR "asociación de productores" ' + pais,
    prod + " exporter " + pais + " site:linkedin.com/in",
    '"' + prod + '" ' + pais + ' "gerente de exportaciones" OR "export manager"',
  ];
  const paisClave = clave(pais);
  for (const c in AGENCIAS) if (paisClave.includes(c)) q.push(prod + " exportadores site:" + AGENCIAS[c][1]);
  if ((d.requisitos || []).length) q.push(prod + " " + pais + " " + d.requisitos.slice(0, 2).join(" "));
  return q.map(function (s) { return s.replace(/\s+/g, " ").trim(); });
}

/* ---------------- el libro: compradores y proveedores ----------------
   El activo del negocio no es el deal suelto: es la gente fichada que
   queda cuando el deal termina, cierre o no. Un comprador con mandato
   firmado es lo escaso; proveedores hay miles. Los dos lados viven en
   la misma tabla porque comparten casi todos los campos, y se
   distinguen por `lado`. */

const LADOS = { comprador: "Comprador", proveedor: "Proveedor" };

const ESTADOS_CONTACTO = [
  ["nuevo", "Sin contactar"],
  ["contactado", "Contactado"],
  ["respondio", "Respondió"],
  ["verificado", "Verificado"],
  ["activo", "Activo"],
  ["descartado", "Descartado"],
];
const NOMBRE_ESTADO = Object.fromEntries(ESTADOS_CONTACTO);

// Los checks de verificación pesan distinto: el fiscal y el mercantil
// son los que separan una empresa real de una cuenta de correo.
const CHECKS_VERIFICACION = [
  ["fiscal", "Número fiscal verificado en el registro del país", 30],
  ["mercantil", "Registro mercantil vigente y fecha de constitución", 25],
  ["exportador", "Registrado como exportador ante la aduana", 20],
  ["embarques", "Historial de embarques confirmado por fuente independiente", 15],
  ["referencias", "Dos referencias comerciales contactadas por mí", 10],
];

function lista(texto) {
  if (Array.isArray(texto)) return texto.slice();
  return (texto || "").split(/[\n,;]+/).map(function (s) { return s.trim(); }).filter(Boolean);
}

function contactoNuevo(lado) {
  return {
    lado: lado, nombre: "", pais: "", ciudad: "", persona: "", cargo: "",
    email: "", telefono: "", web: "", fiscal: "", productos: [], volumen: 0,
    unidad: "t", certificaciones: [], incoterms: [], pagos: [], mercados: [],
    mandato: "", mandatoVence: "", verif: {}, estado: "nuevo", notas: [],
  };
}

function puntosVerificacion(contacto) {
  const v = contacto.verif || {};
  return CHECKS_VERIFICACION.reduce(function (s, c) { return s + (v[c[0]] ? c[2] : 0); }, 0);
}

/* ---------------- recontactar ----------------
   El plan manda hacer seguimiento a los siete días. Sin una fecha
   guardada, a los veinte contactos ya no te acordás de a quién le toca. */

function diasPara(fecha) {
  if (!fecha) return null;
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  const destino = new Date(fecha + "T00:00:00");
  if (isNaN(destino)) return null;
  return Math.round((destino - hoy) / 86400000);
}

function avisoRecontacto(obj) {
  const dias = diasPara((obj || {}).recontactar);
  if (dias === null) return null;
  if (dias < 0) return { texto: "vencido hace " + Math.abs(dias) + (Math.abs(dias) === 1 ? " día" : " días"), nivel: "rojo" };
  if (dias === 0) return { texto: "contactar hoy", nivel: "hoy" };
  if (dias <= 3) return { texto: "en " + dias + (dias === 1 ? " día" : " días"), nivel: "amarillo" };
  return { texto: "en " + dias + " días", nivel: "" };
}

function pendientesDe(lista) {
  return (lista || []).filter(function (x) {
    const d = diasPara(x.recontactar);
    return d !== null && d <= 0;
  }).length;
}

function enFecha(dias) {
  const d = new Date();
  d.setDate(d.getDate() + dias);
  return d.toISOString().slice(0, 10);
}

/* ---------------- búsqueda ----------------
   Con cuarenta fichas la lista deja de servir si no se puede filtrar. */

function coincideBusqueda(texto) {
  const q = norm(ui.busqueda || "");
  if (!q) return true;
  return norm(texto).includes(q);
}

function filtrarContactos(lado) {
  return contactosDe(lado).filter(function (c) {
    return coincideBusqueda([c.nombre, c.pais, c.ciudad, c.persona, c.cargo, c.email,
      (c.productos || []).join(" "), (c.certificaciones || []).join(" "),
      (c.mercados || []).join(" "), NOMBRE_ESTADO[c.estado] || ""].join(" "));
  });
}

function filtrarDeals() {
  return (estado.deals || []).filter(function (d) {
    return coincideBusqueda([d.producto, d.paisOrigen, d.ciudadOrigen, d.paisDestino,
      d.ciudadDestino, d.comprador, d.fuente, d.incoterm,
      (d.requisitos || []).join(" "), NOMBRE_ETAPA[d.etapa] || ""].join(" "));
  });
}

/* ---------------- alta en lote ----------------
   "Fichá veinte importadores" a mano son veinte modales. Pegás la lista
   y salen todas, saltando las que ya tenías. */

function parsearLote(texto, lado) {
  const vistos = new Set(contactosDe(lado).map(function (c) { return norm(c.nombre); }));
  const nuevos = [], repetidos = [];
  (texto || "").split(/\r?\n/).forEach(function (linea) {
    const partes = linea.split(/\t|[,;]/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (!partes.length) return;
    const nombre = partes[0];
    if (norm(nombre).length < 2) return;
    if (vistos.has(norm(nombre))) { repetidos.push(nombre); return; }
    vistos.add(norm(nombre));
    nuevos.push({
      nombre: nombre,
      pais: partes[1] || "",
      productos: partes[2] ? lista(partes[2].replace(/\//g, ",")) : [],
    });
  });
  return { nuevos: nuevos, repetidos: repetidos };
}

function contactosDe(lado) {
  return (estado.contactos || []).filter(function (c) { return c.lado === lado; });
}

function contactoPorId(id) {
  return (estado.contactos || []).find(function (c) { return c.id === id; }) || null;
}

// "Premium cocoa beans" y "cacao en grano" son el mismo negocio. Se
// compara por la mercancía de fondo, no por como la escribió cada uno.
const VOCABULARIO_PRODUCTO = Array.from(new Set(
  Object.keys(PRECIOS_REF).concat(Object.keys(PARTIDAS_HS)).concat([
    "camaron", "atun", "tilapia", "carne", "pollo", "leche", "queso", "miel",
    "coco", "jengibre", "curcuma", "vainilla", "pimienta", "cardamomo",
    "algodon", "madera", "carbon", "chatarra", "aluminio", "litio", "niquel",
    "urea", "fertilizante", "cemento", "acero",
  ])
));

const RELLENO_PRODUCTO = ["premium", "beans", "bean", "grano", "granos", "seco",
  "seca", "secos", "crudo", "raw", "bulk", "granel", "calidad", "quality",
  "alta", "grade", "natural", "fresco", "frescos", "fresh", "organic",
  "del", "los", "las", "the", "and", "for"];

function nucleoProducto(texto) {
  // Por palabra entera, no por subcadena: "camarón" contiene "ron" y
  // "espinaca" contiene "piña", y por ahí cruzaban productos distintos.
  const palabras = clave(texto).split(/[^a-z0-9]+/).filter(Boolean);
  for (const termino of VOCABULARIO_PRODUCTO) {
    for (const palabra of palabras) {
      if (palabra === termino || palabra === termino + "s" || palabra === termino + "es") {
        return termino;
      }
    }
  }
  return null;
}

function tokensProducto(texto) {
  return clave(texto).split(/[^a-z0-9]+/).filter(function (w) {
    return w.length > 2 && RELLENO_PRODUCTO.indexOf(w) < 0;
  });
}

function coincideProducto(unos, otros) {
  for (const x of (unos || [])) {
    for (const y of (otros || [])) {
      if (!x || !y) continue;
      const nx = nucleoProducto(x), ny = nucleoProducto(y);
      if (nx && ny) {
        if (nx === ny) return true;
        continue;   // dos mercancías conocidas y distintas: no es el mismo negocio
      }
      const tx = tokensProducto(x), ty = tokensProducto(y);
      if (tx.some(function (w) { return ty.indexOf(w) >= 0; })) return true;
    }
  }
  return false;
}

function interseccion(unos, otros) {
  const b = (otros || []).map(norm);
  return (unos || []).filter(function (x) { return b.includes(norm(x)); });
}

function faltantes(pedidos, tenidos) {
  const b = (tenidos || []).map(norm);
  return (pedidos || []).filter(function (x) { return !b.includes(norm(x)); });
}

/* Cruce entre un comprador y un proveedor. Devuelve null si ni siquiera
   coinciden en producto: eso no es un mal match, es otro negocio. */
function cruzar(comprador, proveedor) {
  if (!coincideProducto(comprador.productos, proveedor.productos)) return null;

  const razones = [], huecos = [];
  let puntos = 25;   // coincidir en producto ya vale

  const pedido = num(comprador.volumen), ofrece = num(proveedor.volumen);
  if (pedido && ofrece) {
    const cubre = ofrece / pedido;
    if (cubre >= 1) { puntos += 20; razones.push("cubre el volumen completo"); }
    else if (cubre >= 0.3) { puntos += 10; razones.push("cubre ~" + Math.round(cubre * 100) + "% del volumen: habría que consolidar con otro"); }
    else huecos.push("sólo cubre ~" + Math.round(cubre * 100) + "% del volumen que pide");
  }

  const faltanCerts = faltantes(comprador.certificaciones, proveedor.certificaciones);
  if ((comprador.certificaciones || []).length) {
    if (!faltanCerts.length) { puntos += 15; razones.push("tiene todas las certificaciones que pide"); }
    else huecos.push("le faltan: " + faltanCerts.join(", "));
  }

  if (comprador.pais && (proveedor.mercados || []).some(function (m) { return clave(m).includes(clave(comprador.pais)); })) {
    puntos += 15; razones.push("ya exportó a " + comprador.pais);
  }

  const inc = interseccion(comprador.incoterms, proveedor.incoterms);
  if (inc.length) { puntos += 5; razones.push("coinciden en " + inc.join("/")); }
  const pag = interseccion(comprador.pagos, proveedor.pagos);
  if (pag.length) { puntos += 5; razones.push("aceptan el mismo pago"); }

  const verif = Math.round(puntosVerificacion(proveedor) * 0.15);
  puntos += verif;
  if (verif < 8) huecos.push("proveedor sin verificar del todo");

  puntos = Math.max(0, Math.min(100, puntos));
  return {
    puntos: puntos,
    nivel: puntos >= 70 ? "verde" : puntos >= 45 ? "amarillo" : "rojo",
    razones: razones,
    huecos: huecos,
  };
}

/* Contrapartes ordenadas por qué tan bien cruzan con este contacto. */
function contrapartes(contacto) {
  const otroLado = contacto.lado === "comprador" ? "proveedor" : "comprador";
  return contactosDe(otroLado).map(function (otro) {
    const par = contacto.lado === "comprador" ? cruzar(contacto, otro) : cruzar(otro, contacto);
    return par ? { contacto: otro, cruce: par } : null;
  }).filter(Boolean).sort(function (a, b) { return b.cruce.puntos - a.cruce.puntos; });
}

/* Proveedores del libro que sirven para un deal concreto. */
function proveedoresPara(deal) {
  const comoComprador = {
    productos: [deal.producto], volumen: num(deal.cantidad), unidad: deal.unidad,
    certificaciones: deal.requisitos || [], pais: deal.paisDestino,
    incoterms: deal.incoterm ? [deal.incoterm] : [], pagos: deal.pago ? [deal.pago] : [],
  };
  return contactosDe("proveedor").map(function (prov) {
    const par = cruzar(comoComprador, prov);
    return par ? { contacto: prov, cruce: par } : null;
  }).filter(Boolean).sort(function (a, b) { return b.cruce.puntos - a.cruce.puntos; });
}

/* ---------------- lector de anuncios ----------------
   Estos posts casi siempre vienen con la misma estructura de etiquetas,
   en inglés o en español. Leerlas evita teclear el anuncio entero, que
   es donde se pierde la mitad de las ganas de trabajarlo. */

const ETIQUETAS = [
  ["producto", ["producto", "product", "commodity", "mercancia", "mercancía", "goods"]],
  ["cantidad", ["cantidad", "quantity", "volumen", "volume", "qty"]],
  ["paisOrigen", ["proveedor", "supplier", "origen", "origin", "pais de origen", "país de origen", "source", "seller"]],
  ["paisDestino", ["comprador", "buyer", "destino", "destination", "pais destino", "país destino", "delivery"]],
  ["ciudad", ["ciudad", "city", "puerto", "port"]],
  ["requisitos", ["requisitos", "requirements", "specs", "especificaciones", "documentacion", "documentación"]],
  ["incoterm", ["incoterm", "incoterms", "terminos de entrega", "términos de entrega"]],
  ["pago", ["pago", "payment", "terminos de pago", "términos de pago", "payment terms"]],
  ["fee", ["comision", "comisión", "commission", "fee", "finder", "finders fee", "finder's fee"]],
  ["fechaLimite", ["fecha limite", "fecha límite", "deadline", "plazo", "cierre"]],
  ["_purpose", ["proposito", "propósito", "purpose", "uso", "objetivo"]],
];

const UNIDADES_TEXTO = [
  [/\b(toneladas?|tonnes?|tons?|metric tons?|mt|tm)\b/i, "t"],
  [/\b(kilos?|kilogramos?|kg)\b/i, "kg"],
  [/\b(libras?|lbs?|pounds?)\b/i, "lb"],
  [/\b(quintales?|qq)\b/i, "qq"],
  [/\b(contenedores?|containers?|fcl)\b/i, "contenedores"],
];

function limpiarLinea(linea) {
  // Fuera emojis, viñetas y adornos del principio de la línea.
  return linea
    .replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{2BFF}\u{FE0F}\u{20E3}]/gu, " ")
    .replace(/^[\s*\-–—•·>»#]+/, "")
    .replace(/\s+/g, " ")
    .trim();
}

function numeroDe(texto) {
  // "5,000" y "5.000" son ambos cinco mil; "5.5" es cinco y medio.
  const m = (texto || "").match(/[\d][\d.,]*/);
  if (!m) return null;
  let s = m[0].replace(/[.,](?=\d{3}\b)/g, "");
  s = s.replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

// Para los anuncios sin etiquetas ("busco 200 toneladas de cacao de República
// Dominicana para Holanda FOB"). Se busca sobre norm(), que cambia letra por
// letra, así que el valor que se guarda es el del texto tal como vino.
const INCOTERMS = /\b(EXW|FCA|FAS|FOB|CFR|CIF|CPT|CIP|DAP|DPU|DDP)\b/i;
const PRODUCTOS_CORRIDO = ["cacao", "cocoa", "cafe", "coffee", "azucar", "sugar", "banano", "bananas",
  "banana", "aguacates", "aguacate", "avocados", "avocado", "tabaco", "tobacco", "arroz", "rice", "maiz",
  "corn", "soya", "soybeans", "cobre", "copper", "camarones", "camaron", "shrimp", "flores", "flowers",
  "pina", "pineapple", "ajonjoli", "sesame", "uvas", "uva", "grapes", "oro", "gold"];
const PAISES_CORRIDO = ["republica dominicana", "dominican republic", "puerto rico", "estados unidos",
  "united states", "eeuu", "paises bajos", "netherlands", "holanda", "holland", "reino unido",
  "united kingdom", "costa rica", "el salvador", "colombia", "ecuador", "peru", "mexico", "guatemala",
  "honduras", "nicaragua", "panama", "chile", "argentina", "brasil", "brazil", "uruguay", "paraguay",
  "bolivia", "venezuela", "cuba", "haiti", "jamaica", "espana", "spain", "alemania", "germany", "francia",
  "france", "italia", "italy", "belgica", "belgium", "portugal", "suiza", "switzerland", "canada",
  "china", "japon", "japan", "india", "turquia", "turkey", "emiratos arabes unidos", "dubai"];
// Un gentilicio también dice de dónde sale la carga: "café colombiano".
const GENTILICIOS = [["dominican[oa]s?", "República Dominicana"], ["colombian[oa]s?", "Colombia"],
  ["peruan[oa]s?", "Perú"], ["ecuatorian[oa]s?", "Ecuador"], ["mexican[oa]s?", "México"],
  ["guatemaltec[oa]s?", "Guatemala"], ["hondureñ[oa]s?|hondurenn?[oa]s?", "Honduras"],
  ["costarricenses?", "Costa Rica"], ["brasileñ[oa]s?|brasilen[oa]s?", "Brasil"], ["chilen[oa]s?", "Chile"]];
const ANTES_ORIGEN = /(?:\bde|\bdesde|\bfrom|\borigen|\borigin|\bof)\s+(?:la\s+|el\s+|the\s+)?$/;
const ANTES_DESTINO = /(?:\bpara|\bhacia|\bto|\bdestino|\bdestination|\ba|\binto)\s+(?:la\s+|el\s+|los\s+|the\s+)?$/;

function buscarPalabra(plano, palabra) {
  const m = new RegExp("(^|[^a-z])(" + palabra + ")(?=[^a-z]|$)").exec(plano);
  return m ? { i: m.index + m[1].length, largo: m[2].length } : null;
}

function leerTextoCorrido(texto, salida) {
  const plano = norm(texto).padEnd(texto.trim().length);
  const original = texto.trim();
  const pedazo = (h) => original.slice(h.i, h.i + h.largo);

  if (!salida.incoterm) {
    const m = original.match(INCOTERMS);
    if (m) salida.incoterm = m[1].toUpperCase();
  }

  if (!salida.producto) {
    let primero = null;
    for (const p of PRODUCTOS_CORRIDO) {
      const h = buscarPalabra(plano, p);
      if (h && (!primero || h.i < primero.i)) primero = h;
    }
    if (primero) salida.producto = pedazo(primero);
  }

  if (!salida.paisOrigen || !salida.paisDestino) {
    const hallados = [];
    for (const p of PAISES_CORRIDO) {
      const h = buscarPalabra(plano, p.replace(/ /g, "\\s+"));
      // Un país que es parte de otro ya hallado ("dominicana" en "república dominicana") no cuenta.
      if (h && !hallados.some((x) => h.i >= x.i && h.i < x.i + x.largo)) hallados.push(h);
    }
    hallados.sort((a, b) => a.i - b.i);
    const sueltos = [];
    for (const h of hallados) {
      const antes = plano.slice(Math.max(0, h.i - 24), h.i);
      if (ANTES_DESTINO.test(antes) && !salida.paisDestino) salida.paisDestino = pedazo(h);
      else if (ANTES_ORIGEN.test(antes) && !salida.paisOrigen) salida.paisOrigen = pedazo(h);
      else sueltos.push(h);
    }
    if (!salida.paisOrigen) {
      for (const [patron, pais] of GENTILICIOS) {
        if (new RegExp("(^|[^a-zñ])(" + patron + ")(?=[^a-zñ]|$)").test(plano)) { salida.paisOrigen = pais; break; }
      }
    }
    for (const h of sueltos) {
      const valor = pedazo(h);
      if (valor === salida.paisOrigen || valor === salida.paisDestino) continue;
      if (!salida.paisOrigen) salida.paisOrigen = valor;
      else if (!salida.paisDestino) salida.paisDestino = valor;
    }
  }
}

function parsearAnuncio(texto) {
  const salida = { requisitos: [] };
  const ciudades = [];
  let ultimoLado = null;   // hacia qué lado apunta la próxima "City:"

  limpiarLinea(texto);
  const lineas = (texto || "").split(/\n+/).map(limpiarLinea).filter(Boolean);

  for (const linea of lineas) {
    const corte = linea.match(/^([^:]{2,40}):\s*(.+)$/);
    if (corte) {
      const rotulo = norm(corte[1]).replace(/[^a-z\s']/g, "").trim();
      const valor = corte[2].trim();
      const par = ETIQUETAS.find(function (e) {
        return e[1].some(function (alias) { return rotulo === alias || rotulo.endsWith(" " + alias) || rotulo.startsWith(alias + " "); });
      });
      if (par) {
        const campo = par[0];
        if (campo === "ciudad") { ciudades.push({ lado: ultimoLado, valor: valor }); continue; }
        if (campo === "_purpose") continue;
        if (campo === "paisOrigen") ultimoLado = "origen";
        if (campo === "paisDestino") ultimoLado = "destino";
        if (campo === "requisitos") {
          salida.requisitos = valor.split(/[,;]|\sy\s|\sand\s/).map(function (s) {
            return s.replace(/\.$/, "").trim();
          }).filter(function (s) { return s.length > 2; });
          continue;
        }
        if (campo === "cantidad") {
          const n = numeroDe(valor);
          if (n !== null) salida.cantidad = n;
          for (const [re, u] of UNIDADES_TEXTO) if (re.test(valor)) { salida.unidad = u; break; }
          continue;
        }
        if (campo === "fee") { const n = numeroDe(valor); if (n !== null) salida.fee = n; continue; }
        if (!salida[campo]) salida[campo] = valor;
        continue;
      }
    }

    // Sin etiqueta: la línea del gancho suele traer la comisión.
    if (!salida.fee) {
      const m = linea.match(/(?:earn|gana[rs]?|pago|paga|comisi[oó]n|fee)[^\d$]{0,24}(?:us\$|usd|\$)?\s*([\d][\d.,]*)/i)
        || linea.match(/(?:us\$|usd|\$)\s*([\d][\d.,]*)/i);
      if (m) { const n = numeroDe(m[1]); if (n !== null && n >= 100) salida.fee = n; }
    }
    if (!salida.cantidad) {
      const m = linea.match(/([\d][\d.,]*)\s*(toneladas?|tonnes?|tons?|metric tons?|mt|kg|contenedores?|containers?)/i);
      if (m) {
        const n = numeroDe(m[1]);
        if (n !== null) {
          salida.cantidad = n;
          for (const [re, u] of UNIDADES_TEXTO) if (re.test(m[2])) { salida.unidad = u; break; }
        }
      }
    }
  }

  // Repartir las ciudades: la que sigue al proveedor es origen, la que
  // sigue al comprador es destino. Si vinieron sueltas, en orden.
  const origen = ciudades.filter(function (c) { return c.lado === "origen"; });
  const destino = ciudades.filter(function (c) { return c.lado === "destino"; });
  const sueltas = ciudades.filter(function (c) { return !c.lado; });
  if (origen.length) salida.ciudadOrigen = origen[0].valor;
  if (destino.length) salida.ciudadDestino = destino[0].valor;
  if (!salida.ciudadOrigen && sueltas.length) salida.ciudadOrigen = sueltas.shift().valor;
  if (!salida.ciudadDestino && sueltas.length) salida.ciudadDestino = sueltas.shift().valor;

  // Lo que las etiquetas no trajeron se busca en el texto corrido.
  leerTextoCorrido(texto || "", salida);

  if (!salida.unidad && salida.cantidad) salida.unidad = "t";
  return salida;
}

function contarLeidos(campos) {
  return Object.keys(campos).filter(function (k) {
    const v = campos[k];
    return Array.isArray(v) ? v.length > 0 : v !== undefined && v !== "" && v !== null;
  }).length;
}

function partidaHS(producto) {
  const p = clave(producto);
  for (const clave in PARTIDAS_HS) if (p.includes(clave)) return PARTIDAS_HS[clave];
  return null;
}

// Papelería. Un NCND en .txt se lee como un favor entre conocidos; el
// mismo texto en papel con membrete se lee como una empresa. El archivo
// sale en HTML porque se abre en cualquier teléfono y se imprime a PDF
// desde el propio navegador, sin instalar nada.

function escHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Negrita e itálica sólo con asteriscos: los guiones bajos son las
// rayas para firmar y tienen que salir intactos.
function enLinea(texto) {
  let h = escHtml(texto);
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  h = h.replace(/_{6,}/g, '<span class="raya"></span>');
  return h;
}

function mdAHtml(md) {
  const lineas = String(md || "").replace(/\r/g, "").split("\n");
  const salida = [];
  let lista = null;      // "ul" | "ol" | null
  let parrafo = [];
  let item = null;

  const cerrarParrafo = function () {
    if (!parrafo.length) return;
    const crudo = parrafo.join("\n");
    // Las líneas con rayas para firmar llevan su espaciado a mano:
    // si el navegador lo colapsa, las columnas se desarman.
    const clase = /_{6,}/.test(crudo) ? ' class="campos"' : "";
    salida.push("<p" + clase + ">" + enLinea(crudo).replace(/\n/g, clase ? "\n" : "<br>") + "</p>");
    parrafo = [];
  };
  const cerrarItem = function () {
    if (item === null) return;
    salida.push("<li>" + enLinea(item) + "</li>");
    item = null;
  };
  const cerrarLista = function () {
    cerrarItem();
    if (lista) { salida.push("</" + lista + ">"); lista = null; }
  };
  const abrirLista = function (tipo) {
    if (lista === tipo) return;
    cerrarLista();
    lista = tipo;
    salida.push("<" + tipo + ">");
  };

  for (let i = 0; i < lineas.length; i++) {
    const linea = lineas[i];
    const limpia = linea.trim();

    if (!limpia) { cerrarParrafo(); cerrarLista(); continue; }

    if (/^(-{3,}|_{3,}\s*$|\*{3,})$/.test(limpia) && !/_{6,}/.test(limpia)) {
      cerrarParrafo(); cerrarLista(); salida.push("<hr>"); continue;
    }

    const enc = limpia.match(/^(#{1,4})\s+(.*)$/);
    if (enc) {
      cerrarParrafo(); cerrarLista();
      const n = enc[1].length;
      salida.push("<h" + n + ">" + enLinea(enc[2]) + "</h" + n + ">");
      continue;
    }

    const vinieta = limpia.match(/^[-*+]\s+(.*)$/);
    if (vinieta) {
      cerrarParrafo();
      abrirLista("ul");
      cerrarItem();
      item = vinieta[1].replace(/^\[ \]\s*/, "☐ ").replace(/^\[[xX]\]\s*/, "☑ ");
      continue;
    }

    const numerada = limpia.match(/^\d+[.)]\s+(.*)$/);
    if (numerada) {
      cerrarParrafo();
      abrirLista("ol");
      cerrarItem();
      item = numerada[1];
      continue;
    }

    // Línea sangrada que sigue a una viñeta: es parte del mismo punto.
    if (item !== null && /^\s{2,}/.test(linea)) { item += " " + limpia; continue; }

    if (lista) cerrarLista();
    parrafo.push(limpia);
  }
  cerrarParrafo(); cerrarLista();
  return salida.join("\n");
}

function inicialesDe(texto) {
  const partes = String(texto || "").trim().split(/\s+/).filter(Boolean);
  if (!partes.length) return "·";
  // "JRN Sourcing" se sella JRN, no JS: si una palabra ya es una sigla,
  // ésa es la marca.
  const sigla = partes.filter(function (x) {
    return /^[A-ZÁÉÍÓÚÑ]{2,4}$/.test(x);
  })[0];
  if (sigla) return sigla;
  return partes.slice(0, 3).map(function (x) { return x[0].toUpperCase(); }).join("");
}

  const fuentes = Array.prototype.map.call(document.querySelectorAll("script[data-src]"), function (s) {
    return '<script id="' + s.id + '" data-src>' + s.textContent + "<\/script>";
  }).join("\n");
  const json = JSON.stringify(estado).replace(/</g, "\\u003c");
  return [
    "<!doctype html>",
    '<html lang="es"><head><meta charset="utf-8">',
    '<meta name="viewport" content="width=device-width, initial-scale=1">',
    "<title>Mesa de Intermediación</title>",
    '<link rel="preconnect" href="https://fonts.googleapis.com">',
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Faustina:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">',
    '<style id="css">' + css + "</style></head><body>",
    '<div id="raiz"></div>',
    '<script type="application/json" id="estado">' + json + "<\/script>",
    fuentes,
    "</body></html>",
  ].join("\n");
}

async function guardar() {
  if (!publicar) { brindis("Guardado sólo en este dispositivo: la nube no está disponible acá."); return; }
  const boton = document.getElementById("btn-guardar");
  if (boton) { boton.disabled = true; boton.textContent = "Guardando…"; }
  try {
    await publicar.publish(documentoCompleto());
    // La vista se recarga sola a la versión nueva. Si por lo que sea no
    // lo hace, que al menos no quede diciendo "Guardando…" para siempre.
    ui.sucio = false;
    render();
  } catch (error) {
    const codigo = (error && error.code) || "upstream_error";
    if (codigo === "conflict") return;           // ya viene la recarga con la versión ganadora
    if (codigo === "not_writer" || codigo === "not_granted" || codigo === "not_declared") {
      ui.soloLocal = true;
      brindis("Esta vista es de sólo lectura. Tus cambios quedan en este dispositivo.");
    } else if (codigo === "too_large") {
      brindis("El expediente ya no cabe en una versión. Archivá deals cerrados.");
    } else if (codigo === "rate_limited") {
      brindis("Demasiados guardados seguidos. Esperá unos segundos y volvé a intentar.");
    } else {
      brindis("No se pudo guardar en la nube. Tus cambios siguen en este dispositivo.");
    }
    render();
  }
}

/* ---------------- respaldo ----------------
   El libro es el activo del negocio. Un archivo propio, fuera de acá,
   es lo que lo vuelve tuyo de verdad. */

function respaldoJSON() {
  return JSON.stringify({
    formato: "mesa-intermediacion-1",
    exportado: new Date().toISOString(),
    perfil: estado.perfil || {},
    deals: estado.deals || [],
    contactos: estado.contactos || [],
  }, null, 2);
}

function aplicarRespaldo(crudo) {
  let datos;
  try { datos = JSON.parse(crudo); }
  catch (e) { return { ok: false, porque: "Ese archivo no es un respaldo válido." }; }
  if (!datos || typeof datos !== "object" || !Array.isArray(datos.deals) || !Array.isArray(datos.contactos)) {
    return { ok: false, porque: "Ese archivo no tiene la forma de un respaldo de la Mesa." };
  }
  estado.perfil = datos.perfil && typeof datos.perfil === "object" ? datos.perfil : {};
  estado.deals = datos.deals;
  estado.contactos = datos.contactos;
  return { ok: true, deals: datos.deals.length, contactos: datos.contactos.length };
}

let temporizadorBrindis = null;
function brindis(texto) {
  let n = document.getElementById("brindis");
  if (!n) {
    n = document.createElement("div");
    n.id = "brindis";
    n.className = "brindis";
    n.setAttribute("role", "status");
    document.body.appendChild(n);
  }
  n.textContent = texto;
  clearTimeout(temporizadorBrindis);
  temporizadorBrindis = setTimeout(function () { n.remove(); }, 3200);
}

async function copiar(texto) {
  try {
    await navigator.clipboard.writeText(texto);
    brindis("Copiado");
  } catch (e) {
    const a = document.createElement("textarea");
    a.value = texto;
    a.style.position = "fixed";
    a.style.opacity = "0";
    document.body.appendChild(a);
    a.select();
    try { document.execCommand("copy"); brindis("Copiado"); }
    catch (e2) { brindis("No se pudo copiar. Seleccioná el texto a mano."); }
    a.remove();
  }
}

async function descargar(nombre, texto) {
  if (!bajar) { copiar(texto); return; }
  try { await bajar.save({ filename: nombre, data: texto }); }
  catch (error) {
    const c = (error && error.code) || "unavailable";
    if (c === "declined") return;
    brindis("No se pudo descargar. Copiá el texto y pegalo en un documento.");
  }
}
</script>

/* La comisión que se publica NO es la tuya: es la tajada que le pagás a

function escalaFinder(valor) {
  if (valor < 250000) return 0.03;
  if (valor < 1000000) return 0.025;
  if (valor < 5000000) return 0.015;
  if (valor < 20000000) return 0.005;
  return 0.0025;

function redondear(monto) {
  const paso = monto >= 50000 ? 5000 : monto >= 10000 ? 1000 : 500;
  return Math.max(paso, Math.round(monto / paso) * paso);

  const pct = escalaFinder(n.valor);

    base: (pct * 100).toFixed(2).replace(/\.?0+$/, "") + "% de una carga de ~" + usd(n.valor) +

/* ---------------- seguimiento por anuncio ----------------
   Cada post que publicás queda anotado en el deal (o en la ficha del
   comprador), y cada persona que te escribe por él suma una respuesta.
   Con eso ves qué formato y qué idioma traen gente de verdad. */

function publicacionesDe(duenio) {
  return (duenio && duenio.publicaciones) || [];
}

function respuestasDe(duenio) {
  return publicacionesDe(duenio).reduce(function (s, p) { return s + num(p.respuestas); }, 0);
}

function registrarPublicacion(duenio, formato, idioma, fecha) {
  duenio.publicaciones = publicacionesDe(duenio);
  duenio.publicaciones.push({ formato: formato, idioma: idioma === "en" ? "en" : "es", fecha: fecha, respuestas: 0 });
}

function sumarRespuesta(duenio, i, cuanto) {
  const p = publicacionesDe(duenio)[i];
  if (p) p.respuestas = Math.max(0, num(p.respuestas) + cuanto);
}

function plural(n, uno, varios) {
  return n + " " + (n === 1 ? uno : varios);
}

function resumenSeguimiento(duenio) {
  const pubs = publicacionesDe(duenio).length;
  if (!pubs) return "";
  return plural(pubs, "post", "posts") + " · " + plural(respuestasDe(duenio), "respuesta", "respuestas");
}

<script id="mensajes" data-src>
"use strict";

/* ---------------- escribirle a una ficha ----------------
   Los documentos largos sirven para adjuntar. Para abrir la puerta, lo
   que funciona es un mensaje corto por el canal que esa persona usa:
   WhatsApp con un exportador dominicano, correo con el departamento de
   compras de un distribuidor. Esto arma el mensaje con los campos de la
   ficha y lo abre en la aplicación que corresponda. */

function telefonoWhatsApp(tel) {
  const digitos = (tel || "").replace(/\D/g, "");
  if (!digitos) return "";
  // República Dominicana y Puerto Rico son ambos +1.
  if (digitos.length === 10) return "1" + digitos;
  return digitos;
}

function enlaceWhatsApp(contacto, texto) {
  const numero = telefonoWhatsApp(contacto.telefono);
  if (!numero) return "";
  return "https://wa.me/" + numero + "?text=" + encodeURIComponent(texto);
}

function enlaceCorreo(contacto, asunto, cuerpo) {
  const dir = (contacto.email || "").trim();
  if (!dir) return "";
  return "mailto:" + dir + "?subject=" + encodeURIComponent(asunto) +
    "&body=" + encodeURIComponent(cuerpo);
}

function saludo(contacto) {
  const quien = (contacto.persona || "").trim().split(/\s+/)[0];
  return quien ? "Buenos días " + quien : "Buenos días";
}

function yo() {
  const p = estado.perfil || {};
  const nombre = (p.nombre || "").trim();
  const empresa = (p.empresa || "").trim();
  if (nombre && empresa) return nombre + ", de " + empresa;
  return nombre || empresa || "[tu nombre]";
}

function prod0(contacto) {
  return (contacto.productos || [])[0] || "[producto]";
}

function volumenDe(contacto) {
  return num(contacto.volumen)
    ? num(contacto.volumen).toLocaleString("es-DO") + " " + (contacto.unidad || "t")
    : "";
}

/* Cuatro mensajes: dos lados por dos canales. El de WhatsApp es corto a
   propósito — un muro de texto en WhatsApp no se lee. */

function mensajeProveedorCorto(c) {
  const destino = (c.mercados || [])[0] || "Puerto Rico y Estados Unidos";
  return [
    saludo(c) + ". Soy " + yo() + ", intermediario comercial en Puerto Rico.",
    "",
    "Trabajo con compradores de " + destino + " y estoy buscando proveedor de " +
      prod0(c) + ". Quería saber si les encaja antes de hacerles perder tiempo.",
    "",
    "Tres preguntas:",
    "1. ¿Qué volumen pueden cubrir y en qué plazo?",
    "2. ¿Precio indicativo FOB y hasta cuándo vale?",
    "3. ¿Qué certificaciones tienen vigentes?",
    "",
    "Mi comisión la asume la parte compradora, así que no afecta su precio de venta.",
    "",
    "Gracias.",
  ].join("\n");
}

function mensajeProveedorCorreo(c) {
  const destino = (c.mercados || [])[0] || "Puerto Rico y Estados Unidos";
  return [
    saludo(c) + ",",
    "",
    "Soy " + yo() + ". Trabajo como intermediario comercial desde Puerto Rico, " +
      "conectando exportadores de la región con compradores en Puerto Rico y Estados Unidos continental.",
    "",
    "Estoy buscando proveedor de " + prod0(c) + " para " + destino +
      " y me gustaría saber si pueden participar.",
    "",
    "Lo que necesito confirmar para avanzar:",
    "",

/* ---------------- la secuencia de seguimiento ----------------
   Un recordatorio a los siete días y después nada es como se pierde

   mensaje distinto en cada paso: el mismo texto repetido molesta, uno

const SECUENCIA = [
  { dias: 0, rotulo: "Primer contacto", nota: "El que abre la puerta." },
  { dias: 3, rotulo: "Rebote, día 3", nota: "Cortísimo. Sube el hilo y da salida fácil." },

  { dias: 14, rotulo: "Otra puerta, día 14", nota: "Asume que no es la persona correcta y pide a quién sí." },
  { dias: 30, rotulo: "Cierre, día 30", nota: "Cerrás vos. Es lo que más respuestas destraba." },
];

function pasoDe(c) {
  const n = Math.max(0, Math.min(SECUENCIA.length - 1, parseInt((c || {}).paso, 10) || 0));

}
function hayPasoSiguiente(c) { return pasoDe(c) < SECUENCIA.length - 1; }

function seguimientoDe(c, paso) {
  const prod = prod0(c);

        ((c.certificaciones || []).length ? c.certificaciones.join(" y ") : "trazabilidad y certificación vigente") +

        ": al ser carga de origen extranjero no aplica la Jones Act, así que el flete no carga " +

      "",

      "",
      esProv

        : "¿Vale la pena que les mande la ficha técnica?",

  }
  if (paso === 3) {
    return [
      saludo(c) + ". Capaz no sos vos quien ve esto, y te estoy haciendo perder tiempo.",
      "",
      esProv
        ? "¿Quién lleva las exportaciones ahí? Le escribo directo y te saco del medio."
        : "¿Quién lleva las compras de " + prod + " ahí? Le escribo directo y te saco del medio.",
      "",
      "Gracias igual.",
    ].join("\n");
  }
  return [
    saludo(c) + ". Cierro el tema por ahora, no te escribo más.",
    "",
    esProv
      ? "Si en algún momento les queda volumen libre de " + prod + " y quieren colocarlo en " +
        "Puerto Rico o Estados Unidos, escribime y lo movemos."
      : "Si en algún momento necesitan " + prod + " de origen caribeño, escribime y te consigo proveedor verificado.",
    "",
    "Quedo por acá. Éxitos.",
  ].join("\n");
}

function mensajePaso(c, canal, paso) {
  return paso === 0 ? mensajeDe(c, canal) : seguimientoDe(c, paso);
}

function asuntoDe(c) {
  return c.lado === "proveedor"
    ? "Consulta de compra: " + prod0(c) + " para Puerto Rico"
    : prod0(c) + " de " + ((c.mercados || [])[0] || "origen caribeño") +

function mensajeDe(c, canal) {
  if (c.lado === "proveedor") {
    return canal === "correo" ? mensajeProveedorCorreo(c) : mensajeProveedorCorto(c);
  }
  return canal === "correo" ? mensajeCompradorCorreo(c) : mensajeCompradorCorto(c);
}

/* Cuál conviene. No es lo mismo una cooperativa dominicana que el
   departamento de compras de un distribuidor. */
function canalSugerido(c) {
  return c.lado === "proveedor" ? "whatsapp" : "correo";
}

function porqueEseCanal(c) {

    ? "Con exportadores y cooperativas de la región, WhatsApp es el canal de trabajo real: el correo se queda sin leer. Mandá el corto y dejá el formal para cuando contesten."
    : "Con un departamento de compras, el correo gana: les deja rastro, se reenvía internamente y se le puede adjuntar la ficha. WhatsApp sirve después, cuando ya tenés con quién hablar.";
}

function puertaPresentacion(comprador, proveedor) {

  if (!comprador.ncndFirmado) faltan.push("el NCND con " + (comprador.nombre || "el comprador"));

/* ---------------- el embudo ----------------
   El manual dice que de cuarenta correos salen tres a cinco

// Qué cuenta como "respondió". Una sola lista: si acá y en el embudo
// dijeran cosas distintas, el panel se contradiría solo.
const RESPONDIO = ["respondio", "verificado", "activo"];

const ETAPAS_EMBUDO = [
  ["fichados", "Fichados", function () { return true; }],
  ["contactados", "Contactados", function (c) {
    return !!(c.ultimoContacto || (c.estado && c.estado !== "nuevo")); }],
  ["respondieron", "Respondieron", function (c) {
    return RESPONDIO.indexOf(c.estado) >= 0 || !!c.respondioEl; }],
  ["activos", "Activos", function (c) { return c.estado === "activo"; }],
];

function embudoContactos(lado) {
  const gente = lado ? contactosDe(lado) : (estado.contactos || []);
  const vivos = gente.filter(function (c) { return c.estado !== "descartado"; });
  let previo = 0;
  return ETAPAS_EMBUDO.map(function (e, i) {
    const cuantos = vivos.filter(e[2]).length;
    const fila = {
      clave: e[0], rotulo: e[1], cuantos: cuantos,
      porcentaje: vivos.length ? Math.round((cuantos / vivos.length) * 100) : 0,
      conversion: i === 0 || !previo ? null : Math.round((cuantos / previo) * 100),
    };
    previo = cuantos;
    return fila;

}

/* Qué paso de la secuencia destrabó la respuesta. Si la mayoría
   contesta en el tercero, empezá por ese y ahorrate dos semanas. */
function respuestaPorPaso() {
  const cuenta = SECUENCIA.map(function (s, i) {
    return { paso: i, rotulo: s.rotulo, mandados: 0, respuestas: 0 };
  });
  (estado.contactos || []).forEach(function (c) {
    const llegoA = pasoDe(c);
    for (let i = 0; i <= llegoA; i++) if (c.ultimoContacto || c.paso) cuenta[i].mandados++;
    const en = c.pasoAlResponder;
    if (en !== undefined && en !== null && cuenta[en]) cuenta[en].respuestas++;
  });
  return cuenta.map(function (x) {
    x.tasa = x.mandados ? Math.round((x.respuestas / x.mandados) * 100) : null;
    return x;
  });
}

/* Qué canal te está rindiendo: no es lo mismo veinte fichas de un

function rendimientoPorOrigen() {

  (estado.contactos || []).forEach(function (c) {

    const m = mapa[k] || (mapa[k] = { clave: k, rotulo: NOMBRE_ORIGEN[k] || k || "sin anotar",

    m.fichados++;

    if (RESPONDIO.indexOf(c.estado) >= 0 || c.respondioEl) m.respondieron++;

  if (!a || !b) return null;

  return Math.round((y - x) / 86400000);

  return { cuantos: dias.length, mediana: mediana,

}

/* ---------------- el libro de comisiones ----------------

const COBROS = [
  ["", "Sin facturar"],

const NOMBRE_COBRO = Object.fromEntries(COBROS);

function dineroDelLibro() {

  const suma = function (filtro, campo) {

function enFechaDesde(iso, dias) {

/* ---------------- revisar el correo ----------------
   La app no puede leer tu correo sola: lo hace el conector de Gmail
   del que la está mirando, con sus credenciales, y sólo cuando tocás
   el botón. Una sola consulta para todas las fichas: Gmail acepta OR,
   así que se arma una query con los dominios del libro y se empareja
   el remitente contra cada ficha.

   La forma de la respuesta se observó en una llamada real:
   { resultCountEstimate, threads: [ { id, messageCount, viewUrl,
     messages: [ { id, sender, date, subject, snippet, viewUrl } ] } ] }
   El remitente es un correo en texto plano. */

function dominioDe(correo) {
  const m = (correo || "").trim().toLowerCase().match(/@([^@\s>]+)$/);
  return m ? m[1] : "";
}

function dominiosDelLibro() {
  const vistos = new Set();
  (estado.contactos || []).forEach(function (c) {
    const d = dominioDe(c.email);
    if (!d) return;
    if (["gmail.com", "hotmail.com", "yahoo.com", "outlook.com", "icloud.com"].indexOf(d) >= 0) return;
    vistos.add(d);
  });
  return Array.from(vistos).slice(0, 25);
}

function consultaCorreo() {
  const doms = dominiosDelLibro();
  if (!doms.length) return "";
  return "from:(" + doms.join(" OR ") + ") newer_than:90d";
}

/* Cada código de error tiene un arreglo distinto. Un solo cartel

function explicarFalloCorreo(codigo) {
  switch (codigo) {
    case "server_not_connected":
      return "No tenés Gmail conectado en Claude. Se agrega en Configuración → Conectores.";
    case "needs_reauth":

      return "No se pudo consultar Gmail.";

function reintentable(codigo) {
  return codigo === "server_unavailable" || codigo === "upstream_error";
}

/* Empareja cada hilo con la ficha cuyo dominio coincide. */
function cruzarCorreo(respuesta) {
  const hilos = (respuesta && respuesta.threads) || [];
  const porDominio = {};
  (estado.contactos || []).forEach(function (c) {
    const d = dominioDe(c.email);
    if (d) (porDominio[d] = porDominio[d] || []).push(c);
  });

  const hallazgos = {};
  hilos.forEach(function (h) {
    const mensajes = h.messages || [];
    mensajes.forEach(function (m) {
      const d = dominioDe(m.sender);
      const fichas = porDominio[d] || [];
      fichas.forEach(function (c) {
        const previo = hallazgos[c.id];
        const cuando = m.date || h.date || "";
        if (!previo || String(cuando) > String(previo.cuando)) {
          hallazgos[c.id] = {
            cuando: cuando,
            asunto: m.subject || "",
            enlace: m.viewUrl || h.viewUrl || "",
            de: m.sender || "",
          };
        }
      });
    });
  });
  return hallazgos;
}

async function revisarCorreo() {
  const consulta = consultaCorreo();
  if (!consulta) {
    ui.bandeja = { error: "Ninguna ficha tiene correo cargado todavía." };
    render();
    return;
  }
  const mcp = window.claude && window.claude.use ? await window.claude.use("mcp") : null;
  if (!mcp) {
    ui.bandeja = { error: explicarFalloCorreo("capability_disabled") };
    render();
    return;
  }

  ui.revisando = true; ui.bandeja = null; render();
  try {
    const r = await mcp.callTool("Gmail", "search_threads", {
      query: consulta, pageSize: 50, view: "THREAD_VIEW_SUMMARY",
    });
    const hallazgos = cruzarCorreo(r && r.payload);
    ui.bandeja = {
      hallazgos: hallazgos,
      cuantos: Object.keys(hallazgos).length,
      revisadas: dominiosDelLibro().length,
      cuando: r && r.cache && r.cache.storedAt ? new Date(r.cache.storedAt).toISOString() : null,
    };
  } catch (error) {
    const codigo = (error && error.code) || "upstream_error";
    ui.bandeja = { error: explicarFalloCorreo(codigo), codigo: codigo, reintentable: reintentable(codigo) };
  }
  ui.revisando = false;
  render();
}

/* ---------------- lector de personas ----------------
   La misma idea que el lector de anuncios, aplicada a gente: pegás una
   firma de correo, una tarjeta o un perfil y sale la ficha. */

const CARGOS = /(gerente|director|jefe|encargad|coordinador|supervisor|presidente|vicepresident|socio|due[ñn]|propietari|manager|officer|ceo|coo|cfo|head of|chief|owner|partner|buyer|sourcing|procurement|ventas|compras|comercial|export|import|sales)/i;
const EMPRESAS = /(\bs\.?\s?a\.?\s?s?\b|\bs\.?\s?r\.?\s?l\b|\bc\.?\s?x\.?\s?a\b|\binc\b|\bllc\b|\bltd\b|\bcorp\b|\bco\b|\bgroup\b|\bgrupo\b|\bcompany\b|\bfoods\b|\btrading\b|\bexport|\bimport|\bcacao\b|\bcompa[ñn][ií]a\b|&)/i;

function parsearPersona(texto) {
  const salida = {};
  let resto = (texto || "").replace(/\r/g, "");

  const correo = resto.match(/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i);
  if (correo) { salida.email = correo[0]; resto = resto.replace(correo[0], " "); }

  const tel = resto.match(/(\+?\(?\d[\d\s().\-]{6,}\d)/);
  if (tel) {
    const digitos = tel[1].replace(/\D/g, "");
    if (digitos.length >= 7 && digitos.length <= 15) {
      salida.telefono = tel[1].trim();
      resto = resto.replace(tel[1], " ");
    }
  }

  const web = resto.match(/\b(?:https?:\/\/)?(?:www\.)?([a-z0-9][a-z0-9-]*\.(?:com|net|org|do|pr|us|co|io|cr|mx|ec|pe|cl|es|ch|nl|de)(?:\.[a-z]{2})?)\b/i);
  if (web) { salida.web = web[1]; resto = resto.replace(web[0], " "); }

  const lineas = resto.split(/\n|\||·|;|\s[—–]\s|\s-\s/).map(function (l) {
    return l.replace(/^[\s*\-–—•>,:]+|[\s*\-–—•>,:]+$/g, "").trim();
  }).filter(function (l) { return l.length > 1 && l.length < 90 && /[a-záéíóúñ]/i.test(l); });

  const cargoEn = lineas.findIndex(function (l) { return CARGOS.test(l); });
  if (cargoEn >= 0) salida.cargo = lineas[cargoEn];

  const empresaEn = lineas.findIndex(function (l, i) { return i !== cargoEn && EMPRESAS.test(l); });
  if (empresaEn >= 0) salida.nombre = lineas[empresaEn];

  const personaEn = lineas.findIndex(function (l, i) {
    return i !== cargoEn && i !== empresaEn && l.split(/\s+/).length <= 5;
  });
  if (personaEn >= 0) salida.persona = lineas[personaEn];

  // Sin nombre de empresa, se deduce del dominio del correo.
  if (!salida.nombre && salida.email) {
    const dominio = salida.email.split("@")[1].split(".")[0];
    const genericos = ["gmail", "hotmail", "yahoo", "outlook", "icloud", "live", "aol"];
    if (genericos.indexOf(dominio.toLowerCase()) < 0) {
      salida.nombre = dominio.charAt(0).toUpperCase() + dominio.slice(1);
    }
  }
  if (!salida.nombre && salida.persona) { salida.nombre = salida.persona; delete salida.persona; }

  return salida;
}

function contarLeidosPersona(campos) {
  return Object.keys(campos).filter(function (k) { return campos[k]; }).length;
}

   Saber qué canal te está rindiendo es lo que te dice dónde insistir. */

function porOrigen() {

}

// Una correduría sin registro de cobros no es un negocio: es una lista
// de gente a la que le hiciste el favor.
function tarjetaCobro(d) {
  const sel = COBROS.map(function (c) {
    return '<option value="' + c[0] + '"' + ((d.cobro || "") === c[0] ? " selected" : "") + ">" + c[1] + "</option>";
  }).join("");
  const estadoCobro = d.cobro || "";
  const fecha = function (rot, accion, valor) {
    return '<label class="campo"><span class="etiqueta">' + rot + "</span>" +
      '<input type="date" data-accion="' + accion + '" value="' + esc(valor || "") + '"></label>';
  };

  let detalle = "";
  if (estadoCobro === "facturada") {
    const limite = d.fechaFactura ? enFechaDesde(d.fechaFactura, 30) : "";
    const dd = diasPara(limite);
    detalle = fecha("fecha de la factura", "fecha-factura", d.fechaFactura) +
      (dd === null ? "<p>Poné la fecha de la factura y te aviso si se pasa de 30 días.</p>"
        : dd < 0 ? '<p style="color:var(--rojo)"><strong>Lleva ' + (30 + Math.abs(dd)) +
            " días sin cobrar, " + Math.abs(dd) + " más del plazo.</strong> " +
            "A los 30 días de una factura impaga se llama, no se espera.</p>"
        : "<p>Vence el " + esc(limite) + ", en " + dd + " días.</p>");
  } else if (estadoCobro === "cobrada") {
    detalle = fecha("fecha del cobro", "fecha-cobro", d.fechaCobro) +
      '<label class="campo"><span class="etiqueta">cuánto entró de verdad (USD)</span>' +
      '<input type="number" step="any" min="0" data-accion="monto-cobrado" placeholder="' +
      (num(d.fee) ? num(d.fee) : "0") + '" value="' + esc(d.montoCobrado || "") + '"></label>' +
      "<p>Si entró menos que la comisión pactada, poné lo que entró. El panel suma esto, no lo pactado.</p>";
  } else if (estadoCobro === "perdida") {
    detalle = "<p>Anotá en la bitácora por qué se perdió. Es lo único que te hace cobrar la próxima.</p>";
  } else {
    detalle = num(d.fee)
      ? "<p>Comisión pactada: " + usd(num(d.fee)) + ". Marcala facturada el día que mandés la factura.</p>"
      : "<p>Todavía no hay comisión pactada. Ponela en Editar antes de presentar a nadie.</p>";
  }

  return '<label class="campo"><span class="etiqueta">en qué va el cobro</span>' +
    '<select data-accion="cobro">' + sel + "</select></label>" + detalle;
}

function panelFichaContacto(c) {
  const esComprador = c.lado === "comprador";
  const dato = function (rot, v, falta) {
    return '<div class="dato"><span class="etiqueta">' + rot + "</span>" +
      '<span class="v' + (v ? "" : " falta") + '">' + esc(v || falta) + "</span></div>";
  };
  const volumen = num(c.volumen) ? num(c.volumen).toLocaleString("es-DO") + " " + (c.unidad || "t") : "";

  // Teléfono, correo y sitio como enlaces: en el teléfono, tocar el
  // número tiene que llamar, no obligarte a copiarlo a mano.
  const enlazado = function (rot, valor, falta, href) {
    if (!valor) return '<div class="dato"><span class="etiqueta">' + rot +
      '</span><span class="v falta">' + esc(falta) + "</span></div>";
    return '<div class="dato"><span class="etiqueta">' + rot + "</span>" +
      '<span class="v"><a href="' + esc(href) + '">' + esc(valor) + "</a></span></div>";
  };
  const sitio = (c.web || "").trim();
  const contacto = '<div class="datos">' +
    dato("persona", c.persona, "sin nombre") +
    dato("cargo", c.cargo, "sin cargo") +
    enlazado("correo", c.email, "sin correo", "mailto:" + (c.email || "").trim()) +
    enlazado("teléfono", c.telefono, "sin teléfono", "tel:" + (c.telefono || "").replace(/[^\d+]/g, "")) +
    enlazado("sitio web", sitio, "sin sitio", /^https?:/.test(sitio) ? sitio : "https://" + sitio) +
    dato("número fiscal", c.fiscal, "no lo dieron") +
    "</div>";

  const comercial = '<div class="datos">' +
    dato("productos", (c.productos || []).join(", "), "sin cargar") +
    dato(esComprador ? "volumen que necesita" : "capacidad anual", volumen, "sin cargar") +
    dato("certificaciones" + (esComprador ? " que exige" : ""), (c.certificaciones || []).join(", "), "ninguna") +
    dato("incoterms", (c.incoterms || []).join(", "), "sin definir") +
    dato("formas de pago", (c.pagos || []).join(", "), "sin definir") +
    dato(esComprador ? "orígenes que le interesan" : "destinos a los que ya exportó", (c.mercados || []).join(", "), "sin cargar") +
    "</div>";

  const respuesta = ui.bandeja && ui.bandeja.hallazgos && ui.bandeja.hallazgos[c.id];
  const correoHallado = respuesta
    ? tarjeta("te contestaron",
        "<p>Hay correo de <strong>" + esc(respuesta.de) + "</strong>" +
        (respuesta.asunto ? ": " + esc(respuesta.asunto) : "") + ".</p>" +
        (respuesta.enlace
          ? '<p><a href="' + esc(respuesta.enlace) + '" target="_blank" rel="noopener noreferrer">Abrirlo en Gmail</a></p>'
          : "") +
        '<div><button class="btn primario" data-accion="marcar-respondio">Marcar que respondió</button></div>')
    : "";

  const hechas = presentacionesDe(c.id);
  const red = tarjeta("de dónde salió y a quién lo presentaste",
    '<label class="campo" style="max-width:280px"><span class="etiqueta">cómo llegaste a este contacto</span>' +
    '<select data-accion="origen">' + ORIGENES.map(function (o) {
      return '<option value="' + o[0] + '"' + ((c.origen || "") === o[0] ? " selected" : "") +
        ">" + o[1] + "</option>";
    }).join("") + "</select></label>" +
    (hechas.length
      ? "<p>" + hechas.map(function (x) {
          const otro = contactoPorId(x.compradorId === c.id ? x.proveedorId : x.compradorId);
          return "Presentado a <strong>" + esc(otro ? otro.nombre : "una ficha borrada") +
            "</strong> el " + esc(x.fecha);
        }).join("<br>") + "</p>"
      : "<p style=\"color:var(--tinta-suave)\">Todavía no lo presentaste con nadie.</p>"));

  const mandato = esComprador
    ? tarjeta("mandato",
        (c.mandato || "").trim()
          ? "<p>" + esc(c.mandato) + "</p>" + (c.mandatoVence ? '<p class="etiqueta">vence ' + esc(c.mandatoVence) + "</p>" : "")
          : "<p>Sin mandato. Esto es lo único que separa un comprador real de alguien preguntando precios: pedile la LOI o el ICPO firmado antes de moverte por él.</p>")
    : "";

  return '<div class="panel">' +
    tarjeta("contacto", contacto, '<span class="crece"></span><button class="btn chico" data-accion="editar-contacto">Editar</button>') +
    tarjeta("qué mueve", comercial) +
    correoHallado + mandato + red +
    "</div>";
}
