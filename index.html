function panelEscribir(c) {
  const canal = ui.canal || canalSugerido(c);
  const paso = ui.paso !== null && ui.paso !== undefined ? ui.paso : pasoDe(c);
  const texto = mensajePaso(c, canal, paso);
  const asunto = asuntoDe(c);
  const sugerido = canalSugerido(c);
  const wa = enlaceWhatsApp(c, texto);
  const correo = enlaceCorreo(c, asunto, texto);
  const falta = canal === "whatsapp" ? !wa : !correo;

  const boton = function (clave, rotulo) {
    return '<button class="btn chico' + (canal === clave ? " primario" : "") +
      '" data-accion="canal:' + clave + '">' + rotulo +
      (clave === sugerido ? " ·" : "") + "</button>";
  };

  const enlace = canal === "whatsapp"
    ? (wa ? '<a class="btn enviar" href="' + esc(wa) + '" target="_blank" rel="noopener noreferrer">Abrir WhatsApp</a>'
          : '<span class="btn enviar" aria-disabled="true">Abrir WhatsApp</span>')
    : (correo ? '<a class="btn enviar" href="' + esc(correo) + '">Abrir el correo</a>'
              : '<span class="btn enviar" aria-disabled="true">Abrir el correo</span>');

  const aviso = falta
    ? '<p style="color:var(--ambar)">Falta ' + (canal === "whatsapp" ? "el teléfono" : "el correo") +
      ' en la ficha. Cargalo en la pestaña Ficha y el botón se enciende.</p>'
    : "";

  const limite = canal === "whatsapp"
    ? '<p class="largo' + (texto.length > 700 ? " pasado" : "") + '">' + texto.length +
      " caracteres" + (texto.length > 700 ? " — largo para WhatsApp, se lee a medias" : "") + "</p>"
    : "";

  const pasos = SECUENCIA.map(function (s, i) {
    const hecho = i < pasoDe(c);
    return '<button class="btn chico' + (i === paso ? " primario" : "") + '" data-accion="paso:' + i + '">' +
      (hecho ? "✓ " : "") + esc(s.rotulo) + "</button>";
  }).join("");

  const dondeVas = tarjeta("en qué paso vas",
    '<div class="canales">' + pasos + "</div>" +
    "<p>" + esc(SECUENCIA[paso].nota) + "</p>" +
    (paso !== pasoDe(c)
      ? '<p style="color:var(--ambar)">Estás mirando un paso que no es el que te toca. El que sigue es <strong>' +
        esc(SECUENCIA[pasoDe(c)].rotulo) + "</strong>.</p>"
      : "") +
    '<p class="etiqueta">la cadencia completa es día 0, 3, 7, 14 y 30</p>');

  return '<div class="panel">' + dondeVas +
    tarjeta("por dónde", '<div class="canales">' + boton("whatsapp", "WhatsApp") + boton("correo", "Correo") + "</div>" +
      "<p>" + esc(porqueEseCanal(c)) + "</p>" +
      '<p class="etiqueta">el punto marca el canal que conviene para este lado</p>') +
    tarjeta("el mensaje",
      (canal === "correo" ? '<p><strong>Asunto:</strong> ' + esc(asunto) + "</p>" : "") +
      limite + aviso +
      '<div class="canales">' + enlace +
      '<button class="btn" data-accion="copiar-mensaje">Copiar</button></div>') +
    '<section class="tarjeta"><header><span class="etiqueta">así queda</span></header>' +
    '<pre class="doc">' + esc(texto) + "</pre></section>" +
    tarjeta("cuando lo mandes",
      (hayPasoSiguiente(c)
        ? "<p>Lo anoto, avanzo la secuencia y te lo recuerdo en <strong>" +
          (SECUENCIA[pasoDe(c) + 1].dias - SECUENCIA[pasoDe(c)].dias) + " días</strong>, que es cuando toca <em>" +
          esc(SECUENCIA[pasoDe(c) + 1].rotulo) + "</em>.</p>"
        : "<p>Es el último paso de la secuencia. Después de esto no insistas más: si contestan, contestan.</p>") +
      '<div><button class="btn primario" data-accion="ya-escribi:' + canal + '">Ya lo mandé</button></div>') +
    "</div>";
}

function panelPresentar(c, otroId) {
  const otro = contactoPorId(otroId);
  if (!otro) return '<div class="panel">' + tarjeta("presentar", "<p>Esa ficha ya no está.</p>") + "</div>";
  const comprador = c.lado === "comprador" ? c : otro;
  const proveedor = c.lado === "comprador" ? otro : c;
  const puerta = puertaPresentacion(comprador, proveedor);
  const hecha = yaPresentados(comprador.id, proveedor.id);
  const texto = docPresentacion(comprador, proveedor);
  const correos = [comprador.email, proveedor.email].filter(Boolean);
  const asunto = texto.split("\n")[0].replace(/^Asunto:\s*/, "");
  const cuerpo = texto.split("\n").slice(2).join("\n").split("---")[0].trim();

  const firmas = '<div style="display:grid;gap:9px">' +
    [comprador, proveedor].map(function (x) {
      return '<label class="check"><input type="checkbox" data-accion="ncnd:' + esc(x.id) + '"' +
        (x.ncndFirmado ? " checked" : "") + "> Firmó el NCND: <strong>" +
        esc(x.nombre || x.id) + "</strong></label>";
    }).join("") + "</div>";

  const estadoPuerta = puerta.listo
    ? '<div class="puerta abierta"><b>podés presentar</b>' +
      "<p>Las dos partes firmaron. Mandá el correo con los dos en el campo Para y vos también.</p></div>"
    : '<div class="puerta cerrada"><b>todavía no</b>' +
      "<p>Falta " + esc(puerta.faltan.join(" y ")) + ". Presentar sin eso firmado es la forma " +
      "número uno en que te sacan del trato: una vez que tienen el nombre, no te necesitan. " +
      "Generá el acuerdo en la pestaña Documentos de una oportunidad y fírmenlo primero.</p></div>";

  const mailto = correos.length
    ? "mailto:" + correos.join(",") + "?subject=" + encodeURIComponent(asunto) +
      "&body=" + encodeURIComponent(cuerpo)
    : "";

  return '<div class="panel">' +
    tarjeta("presentar a " + esc(comprador.nombre || "el comprador") + " con " +
      esc(proveedor.nombre || "el proveedor"), estadoPuerta + firmas) +
    (hecha ? tarjeta("ya los presentaste",
      "<p>El " + esc(hecha.fecha) + ". Si volvés a mandarlo, que sea en el mismo hilo.</p>") : "") +
    '<section class="tarjeta"><header><span class="etiqueta">el correo de presentación</span>' +
    '<span class="crece"></span>' +
    '<button class="btn chico" data-accion="copiar-presentacion:' + esc(otro.id) + '">Copiar</button>' +
    (mailto && puerta.listo
      ? '<a class="btn chico primario" href="' + esc(mailto) + '">Abrir el correo</a>'
      : '<span class="btn chico" aria-disabled="true" style="opacity:.4">Abrir el correo</span>') +
    '</header><pre class="doc">' + esc(texto) + "</pre></section>" +
    tarjeta("cuando lo mandes",
      "<p>Queda anotado en la bitácora de los dos, con la fecha. Esa bitácora es tu prueba de que " +
      "vos originaste el contacto.</p>" +
      '<div><button class="btn primario" data-accion="ya-presente:' + esc(otro.id) + '"' +
      (puerta.listo ? "" : " disabled") + ">Ya los presenté</button></div>") +
    '<div><button class="btn fantasma" data-accion="tab-contacto:cruce">← Volver al cruce</button></div>' +
    "</div>";
}

function panelBitacoraContacto(c) {
  const opciones = ESTADOS_CONTACTO.map(function (e) {
    return '<option value="' + e[0] + '"' + (c.estado === e[0] ? " selected" : "") + ">" + e[1] + "</option>";
  }).join("");
  const notas = (c.notas || []).length
    ? c.notas.slice().reverse().map(function (n) {
        return '<div class="nota"><span class="f">' + esc(n.fecha) + "</span><p>" + esc(n.texto) + "</p></div>";
      }).join("")
    : "<p>Sin anotaciones. Anotá qué te dijo y cuándo: dentro de seis meses no te vas a acordar de cuál de veinte exportadores era éste.</p>";

  return '<div class="panel">' +
    tarjeta("estado",
      '<label class="campo"><span class="etiqueta">en qué va</span><select data-accion="estado-contacto">' + opciones + "</select></label>" +
      '<label class="campo"><span class="etiqueta">volver a contactar el</span>' +
      '<input type="date" data-accion="recontactar" value="' + esc(c.recontactar || "") + '"></label>' +
      '<div class="atajos">' +
      '<button class="btn chico" data-accion="recontactar-en:3">en 3 días</button>' +
      '<button class="btn chico" data-accion="recontactar-en:7">en 7 días</button>' +
      '<button class="btn chico" data-accion="recontactar-en:14">en 14 días</button>' +
      (c.recontactar ? '<button class="btn fantasma chico" data-accion="recontactar-en:">quitar</button>' : "") +
      "</div>" +
      '<div><button class="btn fantasma chico" data-accion="borrar-contacto">Borrar del libro</button></div>') +
    tarjeta("anotar",
      '<form data-accion="nota-contacto"><label class="campo"><span class="etiqueta">qué pasó</span>' +
      '<textarea name="texto" placeholder="Llamé. Piden la LOI antes de cotizar. Mandan ficha técnica el lunes." required></textarea></label>' +
      '<div style="margin-top:10px"><button class="btn" type="submit">Guardar anotación</button></div></form>') +
    tarjeta("bitácora", notas) +
    "</div>";
}

function pistaComision(c) {
  if (c.base) return "Vacío publica <strong>" + usd(c.monto) + "</strong>: " + esc(c.base) + ".";
  if (c.monto) return "Se publica <strong>" + usd(c.monto) + "</strong>.";
  return "Cargá la cantidad y el precio en la ficha para que pueda sugerirte un número.";
}

/* Redibujar toda la app mientras escribís en un campo te arranca el
   foco y se come el clic siguiente. Cuando cambia la comisión sólo se
   actualiza lo que depende de ella. */
function necesidadDe(duenio) {
  return ui.seccion === "deals" ? necesidadDeDeal(duenio) : necesidadDeComprador(duenio);
}

function refrescarPublicar(duenio) {
  if (!duenio) return;
  const nec = necesidadDe(duenio);
  const c = comisionSugerida(nec, duenio);
  const pista = document.getElementById("pista-comision");
  if (pista) pista.innerHTML = pistaComision(c);
  if (ui.postAbierto) {
    const formato = FORMATOS.find(function (f) { return f[0] === ui.postAbierto; });
    const pre = document.querySelector("pre.doc");
    if (formato && pre) pre.textContent = formato[3](nec, ui.idiomaPost || "es", duenio);
  }
}

function tarjetaSeguimiento(duenio) {
  const pubs = publicacionesDe(duenio);
  if (!pubs.length) {
    return tarjeta("seguimiento",
      "<p>Cuando publiques uno de estos posts, tocá <strong>Lo publiqué</strong>. Después sumá una respuesta por cada persona que te escriba por ese post: así ves qué formato y qué idioma te traen gente de verdad.</p>");
  }
  const filas = pubs.map(function (p, i) {
    const formato = FORMATOS.find(function (f) { return f[0] === p.formato; });
    const r = num(p.respuestas);
    return '<div class="publicacion">' +
      '<span class="n">' + esc(formato ? formato[1].split(" · ")[0] : p.formato) + "</span>" +
      '<span class="etiqueta">' + (p.idioma === "en" ? "inglés" : "español") + " · " + esc(p.fecha) + "</span>" +
      '<span class="contador">' +
      '<button class="btn chico" data-accion="resp-menos:' + i + '" aria-label="Restar una respuesta"' + (r ? "" : " disabled") + ">−</button>" +
      '<span class="mono cuenta-resp" aria-label="respuestas">' + r + "</span>" +
      '<button class="btn chico" data-accion="resp-mas:' + i + '" aria-label="Sumar una respuesta">+1</button>' +
      '<button class="btn fantasma chico" data-accion="quitar-pub:' + i + '">Quitar</button>' +
      "</span></div>";
  }).join("");
  return tarjeta("seguimiento",
    '<p id="total-seguimiento"><strong>' + esc(resumenSeguimiento(duenio)) + "</strong></p>" + filas);
}

function panelPublicar(necesidad, origenTexto, duenio) {
  const idioma = ui.idiomaPost || "es";
  const c = comisionSugerida(necesidad, duenio);
  const selector = '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
    '<span class="etiqueta">idioma</span>' +
    '<button class="btn chico' + (idioma === "es" ? " primario" : "") + '" data-accion="idioma:es">Español</button>' +
    '<button class="btn chico' + (idioma === "en" ? " primario" : "") + '" data-accion="idioma:en">Inglés</button></div>';

  const aviso = tarjeta("la comisión que va en el anuncio",
    '<label class="campo" style="max-width:260px"><span class="etiqueta">lo que ofrecés a quien te traiga el exportador</span>' +
    '<input type="number" step="any" min="0" data-accion="fee-anuncio" value="' +
    (num((duenio || {}).feeAnuncio) || "") + '" placeholder="' + (c.monto || 0) + '"></label>' +
    '<p id="pista-comision">' + pistaComision(c) + "</p>" +
    '<p style="color:var(--ambar)">Esto no es tu comisión: es la tajada que pagás vos si alguien te trae al exportador que cierra. ' +
    "No publiques un número que no puedas honrar — en este mercado todos se conocen y se quema rápido.</p>");

  const cuerpo = FORMATOS.map(function (f) {
    const clave = f[0], abierto = ui.postAbierto === clave;
    const texto = f[3](necesidad, idioma, duenio);
    return '<section class="tarjeta"><header><span class="etiqueta">' + f[1] + "</span>" +
      '<span class="crece"></span>' +
      '<button class="btn chico" data-accion="post:' + clave + '">' + (abierto ? "Ocultar" : "Ver") + "</button>" +
      '<button class="btn chico" data-accion="copiar-post:' + clave + '">Copiar</button>' +
      '<button class="btn chico" data-accion="publicado:' + clave + '">Lo publiqué</button>' +
      '</header><div class="contenido"><p style="color:var(--tinta-suave);font-size:13.5px">' + esc(f[2]) + "</p></div>" +
      (abierto ? '<pre class="doc">' + esc(texto) + "</pre>" : "") + "</section>";
  }).join("");

  return '<div class="panel">' +
    tarjeta("para qué sirve publicarlo",
      "<p>" + esc(origenTexto) + "</p>" +
      "<p>El anuncio no es sólo para encontrar este exportador. Es una red: te van a escribir exportadores que se identifican solos y gente que quiere la comisión. " +
      "<strong>Fichá a todos en el libro</strong>, cierre o no cierre este trato. Eso es lo que se acumula.</p>" +
      "<p>Contá con que la mitad de los que respondan sean otros intermediarios sin carga real. Pediles el número fiscal del exportador en el primer mensaje: los filtra solos.</p>") +
    aviso +
    tarjetaSeguimiento(duenio) +
    tarjeta("formato", selector) +
    cuerpo + "</div>";
}

function vistaHojaContacto(clase) {
  const c = contactoActual();
  const abre = '<main class="hoja' + (clase || "") + '">';
  if (!c) return abre + '<div class="vacio"><p>Elegí una ficha de la lista para verla.</p></div></main>';
  const panel = ui.tabContacto === "presentar" ? panelPresentar(c, ui.presentarA)
    : ui.tabContacto === "escribir" ? panelEscribir(c)
    : ui.tabContacto === "verif" ? panelVerifContacto(c)
    : ui.tabContacto === "cruce" ? panelCruceContacto(c)
    : ui.tabContacto === "publicar" && c.lado === "comprador"
      ? panelPublicar(necesidadDeComprador(c),
          "Publicás lo que necesita " + (c.nombre || "este comprador") + " sin decir quién es, para que aparezcan proveedores nuevos.", c)
    : ui.tabContacto === "bitacora" ? panelBitacoraContacto(c)
    : panelFichaContacto(c);
  return abre + vistaCabezaContacto(c) + vistaPestanasContacto() + panel + "</main>";
}

function vistaHoja(clase) {
  const d = dealActual();
  const abre = '<main class="hoja' + (clase || "") + '">';
  if (!d) return abre + vistaVacioHoja() + "</main>";
  const panel = ui.tab === "proveedor" ? panelProveedor(d)
    : ui.tab === "publicar" ? panelPublicar(necesidadDeDeal(d),
        "Publicás la necesidad de este deal para que aparezca el exportador que la cubre.", d)
    : ui.tab === "docs" ? panelDocs(d)
    : ui.tab === "bitacora" ? panelBitacora(d)
    : panelRiesgo(d);
  return abre + vistaCabeza(d) + vistaPestanas() + panel + "</main>";
}

function vistaAviso() {
  if (ui.soloLocal) {
    return '<div class="aviso">Esta vista no puede publicar cambios. Lo que cargues queda guardado en este navegador.</div>';
  }
  if (ui.sucio && publicar) {
    return '<div class="aviso">Tenés cambios que sólo están en este dispositivo.' +
      '<button class="btn chico" data-accion="guardar">Guardar ahora</button></div>';
  }
  return "";
}

function render() {
  const movil = window.matchMedia("(max-width: 900px)").matches;
  if (ui.seccion === "panel") {
    document.getElementById("raiz").innerHTML =
      '<div class="marco">' + vistaBarra() + vistaSecciones() + vistaAviso() +
      '<div class="cuerpo solo" style="grid-template-columns:1fr">' + vistaPanel() + "</div></div>" +
      (ui.modal ? vistaModal() : "");
    return;
  }
  const enDeals = ui.seccion === "deals";
  const abierto = enDeals ? ui.sel : ui.selContacto;
  const ocultaRail = movil && abierto ? " oculta" : "";
  const ocultaHoja = movil && !abierto ? " oculta" : "";
  const rail = enDeals
    ? vistaResumen() + vistaLista()
    : vistaResumenLibro(ui.seccion) + vistaBandeja() + vistaListaLibro(ui.seccion);
  const hoja = enDeals ? vistaHoja(ocultaHoja) : vistaHojaContacto(ocultaHoja);
  document.getElementById("raiz").innerHTML =
    '<div class="marco">' + vistaBarra() + vistaSecciones() + vistaAviso() +
    '<div class="cuerpo"><aside class="rail' + ocultaRail + '">' + rail + "</aside>" +
    hoja + "</div></div>" +
    (ui.modal ? vistaModal() : "");
}
</script>
<script id="eventos" data-src>
"use strict";

/* ---------------- modales ---------------- */

function campo(rot, nombre, valor, tipo, ancho, extra) {
  return '<label class="campo' + (ancho ? " ancho" : "") + '"><span class="etiqueta">' + rot + "</span>" +
    '<input type="' + (tipo || "text") + '" name="' + nombre + '" value="' + esc(valor || "") + '" ' + (extra || "") + "></label>";
}

function vistaModal() {
  if (ui.modal === "perfil") {
    const p = estado.perfil || {};
    return '<div class="velo" data-accion="velo"><div class="modal" role="dialog" aria-modal="true">' +
      "<header><h2>Mis datos</h2><span class=\"crece\"></span>" +
      '<button class="btn fantasma chico" data-accion="cerrar">Cerrar</button></header>' +
      '<form data-accion="guardar-perfil"><p style="color:var(--tinta-suave);font-size:13.5px">' +
      "Van en el acuerdo NCND cada vez que lo generes. Se cargan una sola vez.</p>" +
      '<div class="rejilla">' +
      campo("nombre completo", "nombre", p.nombre) +
      campo("empresa", "empresa", p.empresa) +
      campo("documento / RNC", "documento", p.documento) +
      campo("teléfono", "telefono", p.telefono) +
      campo("correo", "email", p.email) +
      campo("domicilio", "domicilio", p.domicilio, "text", true) +
      "</div>" +
      '<div style="border-top:1px solid var(--linea);padding-top:14px;display:grid;gap:9px">' +
      '<span class="etiqueta">respaldo</span>' +
      '<p style="color:var(--tinta-suave);font-size:13.5px">Tu libro en un archivo, fuera de acá. Guardalo donde guardes lo que te importa.</p>' +
      '<div class="atajos">' +
      '<button class="btn chico" type="button" data-accion="exportar">Exportar respaldo</button>' +
      '<button class="btn chico" type="button" data-accion="importar">Importar respaldo</button>' +
      '<input type="file" id="archivo-respaldo" accept="application/json,.json" style="display:none">' +
      "</div></div>" +
      "<footer>" +
      '<button class="btn fantasma" type="button" data-accion="cerrar">Cancelar</button>' +
      '<button class="btn primario" type="submit">Guardar datos</button></footer></form></div></div>';
  }

  if (ui.modal === "contacto") {
    const editandoC = !!ui.selContactoEditando;
    const c = editandoC ? contactoActual() : (ui.borrador || contactoNuevo(ui.modalLado));
    if (!c) return "";
    const esComprador = c.lado === "comprador";
    return '<div class="velo" data-accion="velo"><div class="modal" role="dialog" aria-modal="true">' +
      "<header><h2>" + (editandoC ? "Editar ficha" : "Fichar " + (esComprador ? "comprador" : "proveedor")) + "</h2>" +
      '<span class="crece"></span><button class="btn fantasma chico" data-accion="cerrar">Cerrar</button></header>' +
      '<form data-accion="guardar-contacto">' +
      (editandoC ? "" :
        '<div class="pegar"><label class="campo"><span class="etiqueta">pegá una firma de correo, una tarjeta o un perfil</span>' +
        '<textarea name="pegado" rows="3" placeholder="María Reyes&#10;Gerente de Exportaciones&#10;CONACADO Agroindustrial, S.A.&#10;m.reyes@conacado.com.do · 809-957-6203">' +
        esc(c.pegado || "") + "</textarea></label>" +
        '<div><button class="btn" type="button" data-accion="leer-persona">Leer</button></div></div>') +
      '<div class="rejilla">' +
      campo("razón social", "nombre", c.nombre, "text", true, "required") +
      campo("país", "pais", c.pais) +
      campo("ciudad", "ciudad", c.ciudad) +
      campo("número fiscal (RNC / RUC / NIT)", "fiscal", c.fiscal) +
      campo("persona de contacto", "persona", c.persona) +
      campo("cargo", "cargo", c.cargo) +
      campo("correo", "email", c.email) +
      campo("teléfono", "telefono", c.telefono) +
      campo("sitio web", "web", c.web) +
      '<label class="campo ancho"><span class="etiqueta">productos (separados por coma)</span>' +
      '<input type="text" name="productos" value="' + esc((c.productos || []).join(", ")) + '" placeholder="cacao en grano, manteca de cacao"></label>' +
      campo(esComprador ? "volumen que necesita" : "capacidad anual", "volumen", c.volumen, "number", false, 'step="any" min="0"') +
      '<label class="campo"><span class="etiqueta">unidad</span><select name="unidad">' +
      ["t", "kg", "lb", "qq", "unidades", "contenedores"].map(function (u) {
        return '<option value="' + u + '"' + ((c.unidad || "t") === u ? " selected" : "") + ">" + u + "</option>";
      }).join("") + "</select></label>" +
      '<label class="campo ancho"><span class="etiqueta">certificaciones' + (esComprador ? " que exige" : " que tiene") + ' (separadas por coma)</span>' +
      '<input type="text" name="certificaciones" value="' + esc((c.certificaciones || []).join(", ")) + '" placeholder="orgánico, Fairtrade, Rainforest"></label>' +
      '<label class="campo"><span class="etiqueta">incoterms (coma)</span>' +
      '<input type="text" name="incoterms" value="' + esc((c.incoterms || []).join(", ")) + '" placeholder="FOB, CIF"></label>' +
      '<label class="campo"><span class="etiqueta">formas de pago (coma)</span>' +
      '<input type="text" name="pagos" value="' + esc((c.pagos || []).join(", ")) + '" placeholder="carta de crédito a la vista"></label>' +
      '<label class="campo ancho"><span class="etiqueta">' +
      (esComprador ? "orígenes que le interesan" : "destinos a los que ya exportó") + ' (coma)</span>' +
      '<input type="text" name="mercados" value="' + esc((c.mercados || []).join(", ")) + '" placeholder="' +
      (esComprador ? "República Dominicana, Ecuador" : "Canadá, Alemania") + '"></label>' +
      (esComprador
        ? '<label class="campo ancho"><span class="etiqueta">mandato: qué firmó y por cuánto</span>' +
          '<textarea name="mandato" placeholder="LOI firmada 12/03 por 5.000 t de cacao, con prueba de fondos del banco.">' +

  if (ui.modal === "lote") {
    const lado = ui.modalLado;
    return '<div class="velo" data-accion="velo"><div class="modal" role="dialog" aria-modal="true">' +

      '<label class="campo"><textarea name="lote" rows="9" required placeholder="CONACADO, República Dominicana, cacao&#10;Rizek Cacao, República Dominicana, cacao/manteca de cacao&#10;Öko Caribe, República Dominicana&#10;Yacao"></textarea></label>' +
      "<footer>" +
      '<button class="btn fantasma" type="button" data-accion="cerrar">Cancelar</button>' +
      '<button class="btn primario" type="submit">Fichar todas</button></footer></form></div></div>';

  const editando = ui.modal === "editar";
  const d = editando ? dealActual() : (ui.borrador || { unidad: "t", etapa: "captada", requisitos: [] });
  if (!d) return "";
  const pegar = editando ? "" :
    '<div class="pegar"><label class="campo"><span class="etiqueta">pegá el anuncio y lo leo por vos</span>' +
    '<textarea name="anuncio" rows="4" placeholder="EARN $55,000 IF YOU CAN CONNECT US TO…&#10;Product: Premium cocoa beans&#10;Quantity: 5,000 tonnes">' +
    esc(d.anuncio || "") + "</textarea></label>" +
    '<div><button class="btn" type="button" data-accion="leer-anuncio">Leer anuncio</button></div></div>';
  return '<div class="velo" data-accion="velo"><div class="modal" role="dialog" aria-modal="true">' +
    "<header><h2>" + (editando ? "Editar oportunidad" : "Nueva oportunidad") + "</h2>" +
    '<span class="crece"></span><button class="btn fantasma chico" data-accion="cerrar">Cerrar</button></header>' +
    '<form data-accion="guardar-deal">' + pegar + '<div class="rejilla">' +
    campo("producto", "producto", d.producto, "text", true, "required placeholder=\"cacao en grano\"") +
    campo("cantidad", "cantidad", d.cantidad, "number", false, 'step="any" min="0"') +
    '<label class="campo"><span class="etiqueta">unidad</span><select name="unidad">' +
      ["t", "kg", "lb", "qq", "unidades", "contenedores"].map(function (u) {
        return '<option value="' + u + '"' + ((d.unidad || "t") === u ? " selected" : "") + ">" + u + "</option>";
      }).join("") + "</select></label>" +
    campo("precio por unidad (USD)", "precio", d.precio, "number", false, 'step="any" min="0" placeholder="opcional"') +
    campo("comisión para vos (USD)", "fee", d.fee, "number", false, 'step="any" min="0"') +
    campo("país de origen", "paisOrigen", d.paisOrigen, "text", false, 'placeholder="República Dominicana"') +
    campo("ciudad de origen", "ciudadOrigen", d.ciudadOrigen) +
    campo("país de destino", "paisDestino", d.paisDestino) +
    campo("ciudad de destino", "ciudadDestino", d.ciudadDestino) +
    campo("comprador final", "comprador", d.comprador, "text", true, 'placeholder="razón social, si te la dieron"') +
    campo("incoterm", "incoterm", d.incoterm, "text", false, 'placeholder="FOB, CIF, EXW…"') +
    campo("términos de pago", "pago", d.pago, "text", false, 'placeholder="carta de crédito a la vista"') +
    campo("fecha límite", "fechaLimite", d.fechaLimite, "date") +
    campo("dónde lo viste", "fuente", d.fuente, "text", false, 'placeholder="Instagram @cuenta"') +
    '<label class="campo ancho"><span class="etiqueta">requisitos del comprador (uno por línea)</span>' +
    '<textarea name="requisitos" placeholder="Trazabilidad&#10;Especificaciones de fermentación">' +
    esc((d.requisitos || []).join("\n")) + "</textarea></label>" +
    "</div><footer>" +
    '<button class="btn fantasma" type="button" data-accion="cerrar">Cancelar</button>' +
    '<button class="btn primario" type="submit">' + (editando ? "Guardar cambios" : "Crear oportunidad") + "</button>" +
    "</footer></form></div></div>";
}

/* ---------------- eventos ---------------- */

function accionDe(nodo) {
  const el = nodo.closest("[data-accion]");
  return el ? { el: el, valor: el.getAttribute("data-accion") } : null;
}

document.addEventListener("click", function (evento) {
  const a = accionDe(evento.target);
  if (!a) return;
  const [verbo, arg] = a.valor.split(":");

  if (verbo === "velo" && evento.target !== a.el) return; // clic dentro del modal

  switch (verbo) {
    case "nuevo": ui.modal = "nuevo"; ui.borrador = null; render(); break;
    case "seccion": ui.seccion = arg; ui.busqueda = ""; render(); break;
    case "ir": ui.seccion = arg; ui.selContacto = null; ui.busqueda = ""; render(); break;
    case "lote": ui.modal = "lote"; ui.modalLado = arg; render(); break;
    case "recontactar-en": {
      const duenio = ui.seccion === "deals" ? dealActual() : contactoActual();
      if (duenio) { duenio.recontactar = arg ? enFecha(parseInt(arg, 10)) : ""; tocar(); render(); }
      break;
    }
    case "exportar": {
      const nombre = "mesa-respaldo-" + new Date().toISOString().slice(0, 10) + ".json";
      descargar(nombre, respaldoJSON());
      break;
    }
    case "importar": {
      const campo = document.getElementById("archivo-respaldo");
      if (campo) campo.click();
      break;
    }
    case "ver-contacto": ui.seccion = contactoPorId(arg).lado; ui.selContacto = arg; ui.tabContacto = "ficha"; ui.canal = null; render(); break;
    case "sel-contacto": {
      const c = contactoPorId(arg);
      if (c) { ui.seccion = c.lado; ui.selContacto = arg; ui.tabContacto = "ficha"; ui.canal = null; ui.paso = null; render(); }
      break;
    }
    case "tab-contacto": ui.tabContacto = arg; render(); break;
    case "presentar": ui.presentarA = arg; ui.tabContacto = "presentar"; render(); break;
    case "copiar-presentacion": {
      const c = contactoActual(), otro = contactoPorId(arg);
      if (!c || !otro) break;
      const comp = c.lado === "comprador" ? c : otro;
      const prov = c.lado === "comprador" ? otro : c;
      copiar(docPresentacion(comp, prov));
      break;
    }
    case "ya-presente": {
      const c = contactoActual(), otro = contactoPorId(arg);
      if (!c || !otro) break;
      const comp = c.lado === "comprador" ? c : otro;
      const prov = c.lado === "comprador" ? otro : c;
      if (!puertaPresentacion(comp, prov).listo) {
        brindis("Falta que firmen el NCND. No presentes sin eso.");
        break;
      }
      if (yaPresentados(comp.id, prov.id)) { brindis("Ya los habías presentado."); break; }
      const fecha = new Date().toISOString().slice(0, 10);
      presentaciones().push({ fecha: fecha, compradorId: comp.id, proveedorId: prov.id });
      [comp, prov].forEach(function (x) {
        const otroNombre = (x === comp ? prov : comp).nombre || "la otra parte";
        x.notas = x.notas || [];
        x.notas.push({ fecha: fecha, texto: "Lo presenté con " + otroNombre + "." });
        if (!x.estado || x.estado === "nuevo" || x.estado === "contactado") x.estado = "activo";
        x.recontactar = enFecha(3);
      });
      ui.tabContacto = "bitacora";
      tocar(); render();
      brindis("Anotado en las dos fichas. Te lo recuerdo en 3 días.");
      break;
    }
    case "canal": ui.canal = arg; render(); break;
    case "copiar-mensaje": {
      const c = contactoActual();
      if (c) copiar(mensajePaso(c, ui.canal || canalSugerido(c), ui.paso != null ? ui.paso : pasoDe(c)));
      break;
    }
    case "ya-escribi": {
      const c = contactoActual();
      if (!c) break;
      const por = arg === "correo" ? "correo" : "WhatsApp";
      const hoy = new Date().toISOString().slice(0, 10);
      const actual = pasoDe(c);
      c.notas = c.notas || [];
      c.notas.push({ fecha: hoy, texto: SECUENCIA[actual].rotulo + ", por " + por + "." });
      if (c.estado === "nuevo") c.estado = "contactado";
      c.ultimoContacto = hoy;
      anotarPrimerContacto(c, hoy);
      if (hayPasoSiguiente(c)) {
        c.paso = actual + 1;
        const espera = SECUENCIA[c.paso].dias - SECUENCIA[actual].dias;
        c.recontactar = enFecha(espera);
        brindis("Anotado. " + SECUENCIA[c.paso].rotulo + " en " + espera + " días.");
      } else {
        c.recontactar = "";
        brindis("Secuencia terminada. Ya no te lo recuerdo.");
      }
      ui.paso = null;
      ui.tabContacto = "bitacora";
      tocar(); render();
      break;
    }
    case "paso": ui.paso = parseInt(arg, 10) || 0; render(); break;
    case "revisar-correo": revisarCorreo(); break;
    case "cerrar-bandeja": ui.bandeja = null; render(); break;
    case "marcar-respondio": {
      const c = contactoActual();
      if (!c) break;
      const hoy = new Date().toISOString().slice(0, 10);
      anotarRespuesta(c, hoy);
      c.estado = "respondio";
      c.recontactar = "";
      c.notas = c.notas || [];
      c.notas.push({ fecha: hoy, texto: "Respondió por correo." });
      tocar(); render();
      brindis("Marcada. La saqué de la secuencia: ahora la conversación la llevás vos.");
      break;
    }
    case "nuevo-contacto":
      ui.modal = "contacto"; ui.modalLado = arg; ui.borrador = null;
      ui.selContactoEditando = null; render();
      break;
    case "editar-contacto":
      ui.modal = "contacto"; ui.modalLado = contactoActual().lado;
      ui.selContactoEditando = ui.selContacto; ui.borrador = null; render();
      break;
    case "borrar-contacto": {
      const c = contactoActual();
      if (c && confirm("¿Borrar la ficha de “" + (c.nombre || c.id) + "”?")) {
        estado.contactos = estado.contactos.filter(function (x) { return x.id !== c.id; });
        // Un deal que la tenía como contraparte sacaría el NCND en blanco
        // sin avisar. Se suelta la referencia al borrar.
        estado.deals.forEach(function (d) {
          if (d.contraparteId === c.id) d.contraparteId = "";
        });
        ui.selContacto = null;
        tocar(); render();
      }
      break;
    }
    case "editar": ui.modal = "editar"; render(); break;
    case "perfil": ui.modal = "perfil"; render(); break;
    case "cerrar": case "velo": ui.modal = null; ui.borrador = null; ui.selContactoEditando = null; render(); break;
    case "leer-persona": {
      const form = a.el.closest("form");
      const actuales = Object.fromEntries(new FormData(form).entries());
      const leido = parsearPersona(actuales.pegado || "");
      const cuantos = contarLeidosPersona(leido);
      if (!cuantos) { brindis("No pude sacar datos de ese texto."); break; }
      const base = Object.assign({}, actuales, leido);
      ["productos", "certificaciones", "incoterms", "pagos", "mercados"].forEach(function (k) {
        base[k] = lista(actuales[k]);
      });
      ui.borrador = Object.assign(contactoNuevo(ui.modalLado), base);
      render();
      brindis(cuantos + (cuantos === 1 ? " campo leído" : " campos leídos") + ". Revisá antes de fichar.");
      break;
    }
    case "leer-anuncio": {
      const form = a.el.closest("form");
      const actuales = Object.fromEntries(new FormData(form).entries());
      const leido = parsearAnuncio(actuales.anuncio || "");
      const cuantos = contarLeidos(leido);
      if (!cuantos) { brindis("No pude sacar campos de ese texto. Cargalos a mano."); break; }
      const base = Object.assign({}, actuales);
      base.requisitos = (actuales.requisitos || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
      for (const campo in leido) {
        const valor = leido[campo];
        const tiene = Array.isArray(valor) ? valor.length > 0 : valor !== "" && valor !== undefined && valor !== null;
        if (tiene) base[campo] = valor;
      }
      ui.borrador = base;
      render();
      brindis(cuantos + (cuantos === 1 ? " campo leído" : " campos leídos") + ". Revisá antes de crear.");
      break;
    }
    case "copiar-expediente": copiar(expediente(dealActual(), estado.perfil)); break;
    case "bajar-expediente": descargar("expediente-" + dealActual().id + ".md", expediente(dealActual(), estado.perfil)); break;
    case "imprimir-expediente": {
      const d = dealActual();
      if (!d) break;
      const partes = DOCUMENTOS.map(function (doc) { return doc[3](d, estado.perfil); });
      descargar(nombreArchivo("expediente " + (d.producto || ""), d),
        hojaImprimible("Expediente", partes, estado.perfil));
      brindis("Descargado. Abrilo y usá Imprimir para guardarlo como PDF.");
      break;
    }
    case "imprimir-doc": {
      const d = dealActual();
      const doc = DOCUMENTOS.filter(function (x) { return x[0] === arg; })[0];
      if (!d || !doc) break;
      descargar(nombreArchivo(doc[1], d), hojaImprimible(doc[1], doc[3](d, estado.perfil), estado.perfil));
      brindis("Descargado. Abrilo y usá Imprimir para guardarlo como PDF.");
      break;
    }
    case "guardar": guardar(); break;
    case "volver": if (ui.seccion === "deals") ui.sel = null; else ui.selContacto = null; render(); break;
    case "sel": ui.sel = arg; ui.tab = "riesgo"; ui.docAbierto = null; render(); break;
    case "tab": ui.tab = arg; render(); break;
    case "doc": ui.docAbierto = ui.docAbierto === arg ? null : arg; render(); break;
    case "post": ui.postAbierto = ui.postAbierto === arg ? null : arg; render(); break;
    case "idioma": ui.idiomaPost = arg; render(); break;
    case "copiar-post": {
      const formato = FORMATOS.find(function (x) { return x[0] === arg; });
      if (!formato) break;
      const duenio = duenioActual();
      const nec = ui.seccion === "deals" ? necesidadDeDeal(duenio) : necesidadDeComprador(duenio);
      copiar(formato[3](nec, ui.idiomaPost || "es", duenio));
      break;
    }
    case "publicado": {
      const duenio = duenioActual();
      if (!duenio || !FORMATOS.some(function (x) { return x[0] === arg; })) break;
      registrarPublicacion(duenio, arg, ui.idiomaPost || "es", new Date().toISOString().slice(0, 10));
      tocar(); render();
      brindis("Anotado. Sumá una respuesta por cada persona que te escriba por este post.");
      break;
    }
    case "resp-mas": case "resp-menos": {
      const duenio = duenioActual();
      if (!duenio) break;
      sumarRespuesta(duenio, Number(arg), verbo === "resp-mas" ? 1 : -1);
      tocar(); render();
      break;
    }
    case "quitar-pub": {
      const duenio = duenioActual();
      const i = Number(arg);
      if (duenio && publicacionesDe(duenio)[i] && confirm("¿Quitar esta publicación y sus respuestas del seguimiento?")) {
        duenio.publicaciones.splice(i, 1);
        tocar(); render();
      }
      break;
    }
    case "copiar-texto": copiar(a.el.getAttribute("data-texto")); break;
    case "copiar-doc": {
      const doc = DOCUMENTOS.find(function (x) { return x[0] === arg; });
      if (doc) copiar(doc[3](dealActual(), estado.perfil));
      break;
    }
    case "bajar-doc": {
      const doc = DOCUMENTOS.find(function (x) { return x[0] === arg; });
      if (doc) descargar(arg + "-" + dealActual().id + ".md", doc[3](dealActual(), estado.perfil));
      break;
    }
    case "borrar": {
      const d = dealActual();
      if (d && confirm("¿Borrar “" + (d.producto || d.id) + "” y toda su bitácora?")) {
        estado.deals = estado.deals.filter(function (x) { return x.id !== d.id; });
        ui.sel = null;
        tocar(); render();
      }
      break;
    }
  }
});

document.addEventListener("submit", function (evento) {
  const a = accionDe(evento.target);
  if (!a) return;
  evento.preventDefault();
  const datos = Object.fromEntries(new FormData(evento.target).entries());

  if (a.valor === "guardar-perfil") {
    estado.perfil = datos;
    ui.modal = null;
    tocar(); render();
    brindis("Datos guardados");
    return;
  }

  if (a.valor === "guardar-deal") {
    const requisitos = (datos.requisitos || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    if (ui.modal === "editar") {
      const d = dealActual();
      Object.assign(d, datos, { requisitos: requisitos });
    } else {
      const id = nuevoId(datos.producto, datos.paisOrigen);
      estado.deals.unshift(Object.assign({
        id: id, etapa: "captada", acuerdoFirmado: false, notas: [],
        creado: new Date().toISOString().slice(0, 10),
      }, datos, { requisitos: requisitos }));
      ui.sel = id;
      ui.tab = "riesgo";
    }
    ui.modal = null;
    ui.borrador = null;
    tocar(); render();
    return;
  }

  if (a.valor === "guardar-contacto") {
    const campos = ["productos", "certificaciones", "incoterms", "pagos", "mercados"];
    const limpio = Object.assign({}, datos);
    delete limpio.pegado;
    campos.forEach(function (k) { limpio[k] = lista(datos[k]); });
    if (ui.selContactoEditando) {
      Object.assign(contactoActual(), limpio);
    } else {
      const lado = ui.modalLado;
      const id = nuevoIdContacto(datos.nombre, lado);
      estado.contactos.push(Object.assign(contactoNuevo(lado), limpio, {
        id: id, lado: lado, creado: new Date().toISOString().slice(0, 10),
      }));
      ui.seccion = lado;
      ui.selContacto = id;
      ui.tabContacto = "ficha";
    }
    ui.modal = null; ui.borrador = null; ui.selContactoEditando = null;
    tocar(); render();
    return;
  }

  if (a.valor === "guardar-lote") {
    const lado = ui.modalLado;
    const leido = parsearLote(datos.lote, lado);
    if (!leido.nuevos.length) {
      brindis(leido.repetidos.length
        ? "Todas esas ya estaban en el libro."
        : "No pude sacar ningún nombre de ese texto.");
      return;
    }
    leido.nuevos.forEach(function (x) {
      const id = nuevoIdContacto(x.nombre, lado);
      estado.contactos.push(Object.assign(contactoNuevo(lado), {
        id: id, lado: lado, nombre: x.nombre, pais: x.pais, productos: x.productos,
        creado: new Date().toISOString().slice(0, 10),
      }));
    });
    ui.modal = null; ui.seccion = lado; ui.busqueda = "";
    tocar(); render();
    brindis(leido.nuevos.length + (leido.nuevos.length === 1 ? " ficha creada" : " fichas creadas") +
      (leido.repetidos.length ? " · " + leido.repetidos.length + " ya estaban" : ""));
    return;
  }

  if (a.valor === "nota-contacto") {
    const c = contactoActual();
    if (c && (datos.texto || "").trim()) {
      c.notas = c.notas || [];
      c.notas.push({ fecha: new Date().toISOString().slice(0, 10), texto: datos.texto.trim() });
      tocar(); render();
    }
    return;
  }

  if (a.valor === "nota") {
    const d = dealActual();
    if (d && (datos.texto || "").trim()) {
      d.notas = d.notas || [];
      d.notas.push({ fecha: new Date().toISOString().slice(0, 10), texto: datos.texto.trim() });
      tocar(); render();
    }
  }
});

document.addEventListener("change", function (evento) {
  const a = accionDe(evento.target);
  if (!a) return;
  const [verbo, arg] = a.valor.split(":");

  if (verbo === "verif") {
    const c = contactoActual();
    if (c) { c.verif = c.verif || {}; c.verif[arg] = evento.target.checked; tocar(); render(); }
    return;
  }
  if (verbo === "ncnd") {
    const x = contactoPorId(arg);
    if (x) { x.ncndFirmado = evento.target.checked; tocar(); render(); }
    return;
  }
  if (verbo === "origen") {
    const c = contactoActual();
    if (c) { c.origen = evento.target.value; tocar(); render(); }
    return;
  }
  if (verbo === "recontactar") {
    const duenio = ui.seccion === "deals" ? dealActual() : contactoActual();
    if (duenio) { duenio.recontactar = evento.target.value; tocar(); render(); }
    return;
  }
  if (verbo === "estado-contacto") {
    const c = contactoActual();
    if (c) {
      c.estado = evento.target.value;
      if (RESPONDIO.indexOf(c.estado) >= 0) anotarRespuesta(c);
      tocar(); render();
    }
    return;
  }

  const d = dealActual();
  if (!d) return;
  if (a.valor === "contraparte") { d.contraparteId = evento.target.value; tocar(); render(); }
  if (a.valor === "etapa") { d.etapa = evento.target.value; tocar(); render(); }
  if (a.valor === "recontactar") { d.recontactar = evento.target.value; tocar(); render(); }
  if (a.valor === "firmado") { d.acuerdoFirmado = evento.target.checked; tocar(); render(); }
  if (a.valor === "cobro") {
    d.cobro = evento.target.value;
    const hoy = new Date().toISOString().slice(0, 10);
    // La fecha es la mitad del dato: sin ella no hay vencimiento ni
    // plata contada. Se pone sola y se puede corregir.
    if (d.cobro === "facturada" && !d.fechaFactura) d.fechaFactura = hoy;
    if (d.cobro === "cobrada" && !d.fechaCobro) d.fechaCobro = hoy;
    tocar(); render();
  }
  if (a.valor === "fecha-factura") { d.fechaFactura = evento.target.value; tocar(); render(); }
  if (a.valor === "fecha-cobro") { d.fechaCobro = evento.target.value; tocar(); render(); }
});

// En `input` y sin redibujar: el campo conserva el foco y el clic
// siguiente llega a su destino.
document.addEventListener("input", function (evento) {
  const a = accionDe(evento.target);
  if (!a) return;

  // Sólo se cambia el cuerpo de la lista: redibujar entero te sacaría
  // del campo de búsqueda en la primera letra.
  if (a.valor === "buscar") {
    ui.busqueda = evento.target.value;
    const cuerpo = document.getElementById("lista-cuerpo");
    if (!cuerpo) return;
    const enDeals = ui.seccion === "deals";
    const visibles = enDeals ? filtrarDeals() : filtrarContactos(ui.seccion);
    const total = enDeals ? estado.deals.length : contactosDe(ui.seccion).length;
    cuerpo.innerHTML = enDeals ? cuerpoListaDeals(visibles) : cuerpoListaLibro(visibles);
    const cuenta = document.getElementById("cuenta-busqueda");
    if (cuenta) cuenta.textContent = textoCuenta(visibles.length, total);
    return;
  }

  if (a.valor === "monto-cobrado") {
    const d = dealActual();
    if (d) { d.montoCobrado = evento.target.value; tocar(); }
    return;
  }

  if (a.valor !== "fee-anuncio") return;
  const duenio = duenioActual();
  if (!duenio) return;
  duenio.feeAnuncio = evento.target.value;
  tocar();
  refrescarPublicar(duenio);
});

// El archivo de respaldo: se lee, se valida y recién ahí se reemplaza.
document.addEventListener("change", function (evento) {
  if (evento.target.id !== "archivo-respaldo") return;
  const archivo = evento.target.files && evento.target.files[0];
  if (!archivo) return;
  const lector = new FileReader();
  lector.onload = function () {
    const r = aplicarRespaldo(String(lector.result));
    if (!r.ok) { brindis(r.porque); return; }
    if (!confirm("Esto reemplaza todo lo que tenés cargado por el respaldo (" +
      r.deals + " oportunidades, " + r.contactos + " fichas). ¿Seguís?")) return;
    ui.sel = null; ui.selContacto = null; ui.modal = null; ui.busqueda = "";
    tocar(); render();
    brindis("Respaldo cargado: " + r.deals + " oportunidades y " + r.contactos + " fichas.");
  };
  lector.onerror = function () { brindis("No se pudo leer el archivo."); };
  lector.readAsText(archivo);
});

document.addEventListener("keydown", function (evento) {
  if (evento.key === "Escape" && ui.modal) { ui.modal = null; render(); }
});

// Redibujar en cada resize borraba lo que estabas escribiendo: en el
// teléfono, abrir el teclado dispara resize. Sólo se redibuja cuando de
// verdad se cruza el corte entre móvil y escritorio, y nunca con un
// campo enfocado.
let eraMovil = window.matchMedia("(max-width: 900px)").matches;
window.addEventListener("resize", function () {
  const ahora = window.matchMedia("(max-width: 900px)").matches;
  if (ahora === eraMovil) return;
  eraMovil = ahora;
  const foco = document.activeElement;
  if (foco && /^(INPUT|TEXTAREA|SELECT)$/.test(foco.tagName)) return;
  render();
});

/* ---------------- arranque ---------------- */

cargarEstado();
render();

if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("artifact").then(function (cap) {
    publicar = cap;
    if (!cap) ui.soloLocal = true;
    render();
  });
  window.claude.use("downloads").then(function (cap) { bajar = cap; render(); });
} else {
  ui.soloLocal = true;
  render();
}
</script>
