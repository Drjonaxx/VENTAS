/* ---------- estructura ---------- */
.marco { min-height: 100vh; display: flex; flex-direction: column; }

.barra {

.secciones { display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--linea); background: var(--superficie); overflow-x: auto; }
.seccion {
  background: transparent; border: none; border-bottom: 2px solid transparent;
  padding: 9px 14px; cursor: pointer; color: var(--tinta-suave);

.barra-cruce.amarillo span { background: var(--ambar); }
.barra-cruce.rojo span { background: var(--rojo); }

.match { padding: 12px 0; border-bottom: 1px dashed var(--linea); display: grid; gap: 6px; }
.match:last-child { border-bottom: none; }
.match .cab { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.match .cab .n { font-weight: 600; font-size: 14.5px; }
.match .porque { font-size: 13px; color: var(--tinta-suave); }
.match .hueco { font-size: 13px; color: var(--ambar); }

.btn {
  border: 1px solid var(--linea-fuerte);
  background: var(--superficie);
  color: var(--tinta);
  padding: 7px 13px;
  border-radius: var(--r);

  font-size: 13.5px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 7px;
  transition: background .12s ease, border-color .12s ease;
}
.btn:hover { background: var(--franja); border-color: var(--acento); }
.btn.primario { background: var(--acento); border-color: var(--acento); color: var(--superficie); }

.btn.fantasma { border-color: transparent; background: transparent; color: var(--tinta-suave); }
.btn.fantasma:hover { background: var(--franja); color: var(--tinta); }
.btn.chico { padding: 4px 9px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: default; }

.aviso {
  padding: 8px 20px; font-size: 13px;
  background: var(--ambar-tenue); color: var(--tinta);
  border-bottom: 1px solid var(--linea);
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}

.cuerpo { flex: 1; display: grid; grid-template-columns: minmax(300px, 360px) 1fr; }

.rail { border-right: 1px solid var(--linea); display: flex; flex-direction: column; min-width: 0; }

.resumen { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--linea); }

.lista { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
.fila {

}
.fila:nth-child(even) { background: color-mix(in srgb, var(--franja) 45%, transparent); }

.fila[aria-current="true"] { background: var(--acento-tenue); box-shadow: inset 3px 0 0 var(--acento); }
.fila .titulo { font-family: Faustina, Georgia, serif; font-size: 17px; font-weight: 600; line-height: 1.25; }

.chip {

}
.chip.verde { background: var(--verde-tenue); border-color: transparent; color: var(--verde); }
.chip.amarillo { background: var(--ambar-tenue); border-color: transparent; color: var(--ambar); }
.chip.rojo { background: var(--rojo-tenue); border-color: transparent; color: var(--rojo); }

.vacio { padding: 34px 22px; color: var(--tinta-suave); display: grid; gap: 12px; justify-items: start; }

/* ---------- panel derecho ---------- */

.bandera:last-child { border-bottom: none; }
.bandera p { font-size: 14px; }
.sev {

}
.sev.stop { background: var(--rojo); color: var(--superficie); }
.sev.alta { background: var(--rojo-tenue); color: var(--rojo); }

.pasos { margin: 0; padding-left: 19px; display: grid; gap: 7px; font-size: 14px; }
.pasos li::marker { color: var(--acento); }

.fuente { padding: 11px 0; border-bottom: 1px dashed var(--linea); display: grid; gap: 3px; }
.fuente:last-child { border-bottom: none; }
.fuente .n { font-weight: 600; font-size: 14.5px; }

pre.crudo {
  margin: 0; font-family: "IBM Plex Mono", monospace; font-size: 12px; line-height: 1.6;

.nota { padding: 10px 0; border-bottom: 1px dashed var(--linea); }

label.campo { display: grid; gap: 5px; }

.rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 13px; }
.ancho { grid-column: 1 / -1; }
.check { display: flex; gap: 9px; align-items: center; font-size: 14px; }

.velo {
  position: fixed; inset: 0; background: rgba(12,18,13,.5); z-index: 50;
  display: flex; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto;
}
.modal {
  background: var(--superficie); border: 1px solid var(--linea-fuerte); border-radius: var(--r);
  width: min(720px, 100%); box-shadow: var(--sombra); margin: auto;
}
.modal > header { padding: 15px 20px; border-bottom: 1px solid var(--linea); display: flex; align-items: center; gap: 12px; }
.modal > header h2 { font-size: 20px; }
.modal form { padding: 20px; display: grid; gap: 14px; }
.modal footer { display: flex; gap: 9px; justify-content: flex-end; padding-top: 4px; }

.brindis {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--tinta); color: var(--papel); padding: 9px 17px;
  border-radius: 999px; font-size: 13.5px; z-index: 90; box-shadow: var(--sombra);

.solo-movil { display: none; }
@media (max-width: 900px) {
  .solo-movil { display: inline-flex; }
  .rail.oculta, .hoja.oculta { display: none; }
}

/* ---------------- lógica pura ---------------- */

function norm(s) {
  return (s || "").toString().trim().toLowerCase()
    .replace(/[áàä]/g, "a").replace(/[éèë]/g, "e").replace(/[íìï]/g, "i")
    .replace(/[óòö]/g, "o").replace(/[úùü]/g, "u").replace(/ñ/g, "n");
}
function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }

// Los anuncios llegan en inglés tanto como en español. El texto se guarda
// como lo pegaste; esta tabla sólo se usa para emparejar contra el
// directorio, los precios y las partidas arancelarias.
const SINONIMOS = {
  "dominican republic": "republica dominicana", "dominicana": "republica dominicana",
  "costa rican": "costa rica", "brazil": "brasil", "spain": "espana",
  "germany": "alemania", "united states": "estados unidos", "usa": "estados unidos",
  "netherlands": "paises bajos", "united kingdom": "reino unido",
  "cocoa": "cacao", "cacao beans": "cacao", "coffee": "cafe", "sugar": "azucar",
  "banana": "banano", "bananas": "banano", "avocado": "aguacate", "avocados": "aguacate",
  "tobacco": "tabaco", "rice": "arroz", "corn": "maiz", "maize": "maiz",
  "soybean": "soya", "soybeans": "soya", "copper": "cobre", "shrimp": "camaron",
  "gold": "oro", "flowers": "flores", "grapes": "uva", "pineapple": "pina",
  "sesame": "ajonjoli", "fruit": "fruta",
};

function clave(texto) {
  let s = norm(texto);
  for (const ingles in SINONIMOS) {
    const destino = SINONIMOS[ingles];
    // Si ya está en su forma final no se vuelve a tocar: sin esto
    // "dominican republic" pasaba por dos reglas y quedaba duplicado.
    if (s.includes(destino)) continue;
    s = s.replace(new RegExp("\\b" + ingles + "\\b", "g"), destino);
  }
  return s;
}

function usd(n) { return "USD " + Math.round(n).toLocaleString("es-DO"); }

function toneladas(d) {
  const f = A_TONELADA[norm(d.unidad)];
  return f && num(d.cantidad) ? num(d.cantidad) * f : null;
}

function valorCarga(d) {
  if (num(d.precio) && num(d.cantidad)) return { valor: num(d.cantidad) * num(d.precio), estimado: false };
  const t = toneladas(d);
  if (t === null) return { valor: null, estimado: false };
  const p = clave(d.producto);
  for (const clave in PRECIOS_REF) if (p.includes(clave)) return { valor: t * PRECIOS_REF[clave], estimado: true };
  return { valor: null, estimado: false };
}

function capacidadPais(d) {
  const pais = clave(d.paisOrigen), prod = clave(d.producto);
  for (const [p, k, t] of CAPACIDAD) if (pais.includes(p) && prod.includes(k)) return t;
  return null;
}

const PESOS = { stop: 40, alta: 20, media: 10, info: 0 };

function evaluar(d) {
  const b = [];
  const push = function (sev, texto) { b.push({ sev: sev, texto: texto }); };

  // Comisión contra el valor real de la carga.
  if (!num(d.fee)) {
    push("alta", "No hay comisión definida por escrito. Definila en número y en porcentaje antes de mover nada.");
  } else {
    const { valor, estimado } = valorCarga(d);
    if (valor === null) {
      push("info", "No se puede calcular el valor de la carga. Cargá el precio por unidad para revisar si la comisión es realista.");
    } else {
      const r = num(d.fee) / valor;
      const det = "comisión " + usd(num(d.fee)) + " sobre una carga de ~" + usd(valor) +
        " (" + (r * 100).toFixed(2) + "%, " + (estimado ? "estimado grueso" : "precio que cargaste") + ")";
      if (r > 0.05) push("stop", "La comisión se come más del 5% de la carga: " + det + ". En commodities los márgenes no dan para eso; casi siempre significa que el volumen o el precio del anuncio es inventado.");
      else if (r > 0.02) push("alta", "Comisión por encima del 2% de la carga: " + det + ". Pedí que te expliquen de dónde sale ese dinero.");
      else if (r < 0.0005) push("media", "Comisión muy chica para el trabajo que implica: " + det + ".");
    }
  }

  // Volumen contra lo que el país realmente exporta.
  const t = toneladas(d), cap = capacidadPais(d);
  if (t !== null && cap) {
    const prop = t / cap;
    if (prop >= 0.5) push("stop", Math.round(t).toLocaleString("es-DO") + " t es ~" + Math.round(prop * 100) + "% de lo que " + d.paisOrigen + " exporta al año de " + d.producto + ". Ese volumen no existe disponible en spot.");
    else if (prop >= 0.03) push("media", Math.round(t).toLocaleString("es-DO") + " t es ~" + Math.round(prop * 100) + "% de la exportación anual de " + d.paisOrigen + ". Ningún exportador individual lo cubre solo: apuntá a cooperativas o a entregas parciales durante la cosecha.");
  }

  // Contraparte.
  if (!(d.comprador || "").trim()) push("alta", "No hay comprador final identificado. Sin razón social verificable no hay trato, sólo un anuncio.");
  const fuente = norm(d.fuente);
  if (["instagram", "facebook", "tiktok", "whatsapp", "telegram", "grupo"].some(function (p) { return fuente.includes(p); }))
    push("media", "La oportunidad viene de un anuncio público: asumí que hay una cadena de intermediarios delante tuyo. Pedí que te muestren el mandato o la LOI firmada del comprador final.");

  // Términos de pago.
  const pago = norm(d.pago);
  const jerga = JERGA_FRAUDE.filter(function (j) { return pago.includes(j); });
  if (jerga.length) push("stop", "Los términos de pago usan jerga de cadena de fraude (" + jerga.join(", ").trim() + "). En comercio real se paga con carta de crédito irrevocable a la vista o contra documentos. Salite.");
  const todo = norm(d.pago + " " + (d.requisitos || []).join(" "));
  if (SENALES_ADELANTO.some(function (s) { return todo.includes(s); }))
    push("stop", "Te están pidiendo pagar algo por adelantado. Un intermediario cobra al cierre, nunca paga por entrar.");
  if (!(d.pago || "").trim()) push("media", "Faltan los términos de pago. Preguntalos antes de buscar proveedor: definen si el exportador puede siquiera participar.");
  if (!(d.incoterm || "").trim()) push("media", "Falta el Incoterm (FOB, CIF, EXW…). Sin eso el precio no significa nada y no podés comparar ofertas.");

  // Proceso.
  if (ORDEN_ETAPA.indexOf(d.etapa) >= ORDEN_ETAPA.indexOf("presentada") && !d.acuerdoFirmado)
    push("stop", "Vas a presentar (o ya presentaste) sin acuerdo NCND firmado. Así es como te sacan del trato. Generalo en Documentos y firmá primero.");
  if (d.fechaLimite) {
    const dias = Math.round((new Date(d.fechaLimite + "T12:00:00") - new Date()) / 86400000);
    if (dias < 0) push("media", "El plazo venció hace " + Math.abs(dias) + " días.");
    else if (dias <= 7) push("media", "Quedan " + dias + " días. La urgencia extrema es una táctica clásica para que no verifiques: no apures la revisión.");
  }

  const orden = { stop: 0, alta: 1, media: 2, info: 3 };
  b.sort(function (x, y) { return orden[x.sev] - orden[y.sev]; });
  const score = Math.max(0, 100 - b.reduce(function (s, x) { return s + PESOS[x.sev]; }, 0));
  const nivel = b.some(function (x) { return x.sev === "stop"; }) ? "rojo" : score >= 70 ? "verde" : score >= 40 ? "amarillo" : "rojo";
  return { score: score, nivel: nivel, banderas: b };
}

function exigencias(d) {
  const base = [
    "LOI o ICPO del comprador final, firmada, con razón social y número fiscal.",
    "Especificaciones completas por escrito: calidad, empaque, entrega.",
    "Prueba de capacidad de pago: carta de crédito preavisada o referencia bancaria.",
    "Acuerdo NCND firmado por ambas partes ANTES de dar nombres o poner a nadie en contacto.",
    "Un solo hilo de correo con vos siempre en copia. Nada por teléfono sin resumen escrito.",
  ];
  if ((d.requisitos || []).length) base.push("Documentación técnica que pidió el comprador: " + d.requisitos.join("; ") + ".");
  return base;
}

function fuentesDe(d) {
  const out = [], vistos = new Set();
  const add = function (f) { if (f && !vistos.has(f[0])) { vistos.add(f[0]); out.push(f); } };
  const pais = clave(d.paisOrigen), prod = clave(d.producto);
  const destino = clave(d.paisDestino);
  for (const [p, k, lista] of GREMIOS) if (pais.includes(p) && prod.includes(k)) lista.forEach(add);
  for (const c in AGENCIAS) if (pais.includes(c)) add(AGENCIAS[c]);
  for (const c in VERIFICACION) if (pais.includes(c)) VERIFICACION[c].forEach(add);
  for (const c in AGENCIAS) if (destino && destino.includes(c)) add(AGENCIAS[c]);
  GLOBALES.forEach(add);
  return out;
}

function consultasDe(d) {
  const prod = d.producto || "producto", pais = d.paisOrigen || "";
  const lugar = ((d.ciudadOrigen || "") + " " + pais).trim();
  const q = [
    '"exportador de ' + prod + '" ' + lugar,
    '"' + prod + '" exportador ' + pais + ' "FOB" contacto correo',
    prod + " exporter " + pais + ' wholesale "metric tons"',
    prod + ' "cooperativa" OR "asociación de productores" ' + pais,
    prod + " exporter " + pais + " site:linkedin.com/in",
    '"' + prod + '" ' + pais + ' "gerente de exportaciones" OR "export manager"',
  ];
  const paisClave = clave(pais);
  for (const c in AGENCIAS) if (paisClave.includes(c)) q.push(prod + " exportadores site:" + AGENCIAS[c][1]);
  if ((d.requisitos || []).length) q.push(prod + " " + pais + " " + d.requisitos.slice(0, 2).join(" "));
  return q.map(function (s) { return s.replace(/\s+/g, " ").trim(); });
}

/* ---------------- el libro: compradores y proveedores ----------------
   El activo del negocio no es el deal suelto: es la gente fichada que
   queda cuando el deal termina, cierre o no. Un comprador con mandato
   firmado es lo escaso; proveedores hay miles. Los dos lados viven en
   la misma tabla porque comparten casi todos los campos, y se
   distinguen por `lado`. */

const LADOS = { comprador: "Comprador", proveedor: "Proveedor" };

const ESTADOS_CONTACTO = [
  ["nuevo", "Sin contactar"],
  ["contactado", "Contactado"],
  ["respondio", "Respondió"],
  ["verificado", "Verificado"],
  ["activo", "Activo"],
  ["descartado", "Descartado"],
];
const NOMBRE_ESTADO = Object.fromEntries(ESTADOS_CONTACTO);

// Los checks de verificación pesan distinto: el fiscal y el mercantil
// son los que separan una empresa real de una cuenta de correo.
const CHECKS_VERIFICACION = [
  ["fiscal", "Número fiscal verificado en el registro del país", 30],
  ["mercantil", "Registro mercantil vigente y fecha de constitución", 25],
  ["exportador", "Registrado como exportador ante la aduana", 20],
  ["embarques", "Historial de embarques confirmado por fuente independiente", 15],
  ["referencias", "Dos referencias comerciales contactadas por mí", 10],
];

function lista(texto) {
  if (Array.isArray(texto)) return texto.slice();
  return (texto || "").split(/[\n,;]+/).map(function (s) { return s.trim(); }).filter(Boolean);
}

function contactoNuevo(lado) {
  return {
    lado: lado, nombre: "", pais: "", ciudad: "", persona: "", cargo: "",
    email: "", telefono: "", web: "", fiscal: "", productos: [], volumen: 0,
    unidad: "t", certificaciones: [], incoterms: [], pagos: [], mercados: [],
    mandato: "", mandatoVence: "", verif: {}, estado: "nuevo", notas: [],
  };
}

function puntosVerificacion(contacto) {
  const v = contacto.verif || {};
  return CHECKS_VERIFICACION.reduce(function (s, c) { return s + (v[c[0]] ? c[2] : 0); }, 0);
}

function contactosDe(lado) {
  return (estado.contactos || []).filter(function (c) { return c.lado === lado; });
}

function contactoPorId(id) {
  return (estado.contactos || []).find(function (c) { return c.id === id; }) || null;
}

// "Premium cocoa beans" y "cacao en grano" son el mismo negocio. Se
// compara por la mercancía de fondo, no por como la escribió cada uno.
const VOCABULARIO_PRODUCTO = Array.from(new Set(
  Object.keys(PRECIOS_REF).concat(Object.keys(PARTIDAS_HS)).concat([
    "camaron", "atun", "tilapia", "carne", "pollo", "leche", "queso", "miel",
    "coco", "jengibre", "curcuma", "vainilla", "pimienta", "cardamomo",
    "algodon", "madera", "carbon", "chatarra", "aluminio", "litio", "niquel",
    "urea", "fertilizante", "cemento", "acero",
  ])
));

const RELLENO_PRODUCTO = ["premium", "beans", "bean", "grano", "granos", "seco",
  "seca", "secos", "crudo", "raw", "bulk", "granel", "calidad", "quality",
  "alta", "grade", "natural", "fresco", "frescos", "fresh", "organic",
  "del", "los", "las", "the", "and", "for"];

function nucleoProducto(texto) {
  const s = clave(texto);
  for (const palabra of VOCABULARIO_PRODUCTO) if (s.includes(palabra)) return palabra;
  return null;
}

function tokensProducto(texto) {
  return clave(texto).split(/[^a-z0-9]+/).filter(function (w) {
    return w.length > 2 && RELLENO_PRODUCTO.indexOf(w) < 0;
  });
}

function coincideProducto(unos, otros) {
  for (const x of (unos || [])) {
    for (const y of (otros || [])) {
      if (!x || !y) continue;
      const nx = nucleoProducto(x), ny = nucleoProducto(y);
      if (nx && ny) {
        if (nx === ny) return true;
        continue;   // dos mercancías conocidas y distintas: no es el mismo negocio
      }
      const tx = tokensProducto(x), ty = tokensProducto(y);
      if (tx.some(function (w) { return ty.indexOf(w) >= 0; })) return true;
    }
  }
  return false;
}

function interseccion(unos, otros) {
  const b = (otros || []).map(norm);
  return (unos || []).filter(function (x) { return b.includes(norm(x)); });
}

function faltantes(pedidos, tenidos) {
  const b = (tenidos || []).map(norm);
  return (pedidos || []).filter(function (x) { return !b.includes(norm(x)); });
}

/* Cruce entre un comprador y un proveedor. Devuelve null si ni siquiera
   coinciden en producto: eso no es un mal match, es otro negocio. */
function cruzar(comprador, proveedor) {
  if (!coincideProducto(comprador.productos, proveedor.productos)) return null;

  const razones = [], huecos = [];
  let puntos = 25;   // coincidir en producto ya vale

  const pedido = num(comprador.volumen), ofrece = num(proveedor.volumen);
  if (pedido && ofrece) {
    const cubre = ofrece / pedido;
    if (cubre >= 1) { puntos += 20; razones.push("cubre el volumen completo"); }
    else if (cubre >= 0.3) { puntos += 10; razones.push("cubre ~" + Math.round(cubre * 100) + "% del volumen: habría que consolidar con otro"); }
    else huecos.push("sólo cubre ~" + Math.round(cubre * 100) + "% del volumen que pide");
  }

  const faltanCerts = faltantes(comprador.certificaciones, proveedor.certificaciones);
  if ((comprador.certificaciones || []).length) {
    if (!faltanCerts.length) { puntos += 15; razones.push("tiene todas las certificaciones que pide"); }
    else huecos.push("le faltan: " + faltanCerts.join(", "));
  }

  if (comprador.pais && (proveedor.mercados || []).some(function (m) { return clave(m).includes(clave(comprador.pais)); })) {
    puntos += 15; razones.push("ya exportó a " + comprador.pais);
  }

  const inc = interseccion(comprador.incoterms, proveedor.incoterms);
  if (inc.length) { puntos += 5; razones.push("coinciden en " + inc.join("/")); }
  const pag = interseccion(comprador.pagos, proveedor.pagos);
  if (pag.length) { puntos += 5; razones.push("aceptan el mismo pago"); }

  const verif = Math.round(puntosVerificacion(proveedor) * 0.15);
  puntos += verif;
  if (verif < 8) huecos.push("proveedor sin verificar del todo");

  puntos = Math.max(0, Math.min(100, puntos));
  return {
    puntos: puntos,
    nivel: puntos >= 70 ? "verde" : puntos >= 45 ? "amarillo" : "rojo",
    razones: razones,
    huecos: huecos,
  };
}

/* Contrapartes ordenadas por qué tan bien cruzan con este contacto. */
function contrapartes(contacto) {
  const otroLado = contacto.lado === "comprador" ? "proveedor" : "comprador";
  return contactosDe(otroLado).map(function (otro) {
    const par = contacto.lado === "comprador" ? cruzar(contacto, otro) : cruzar(otro, contacto);
    return par ? { contacto: otro, cruce: par } : null;
  }).filter(Boolean).sort(function (a, b) { return b.cruce.puntos - a.cruce.puntos; });
}

/* Proveedores del libro que sirven para un deal concreto. */
function proveedoresPara(deal) {
  const comoComprador = {
    productos: [deal.producto], volumen: num(deal.cantidad), unidad: deal.unidad,
    certificaciones: deal.requisitos || [], pais: deal.paisDestino,
    incoterms: deal.incoterm ? [deal.incoterm] : [], pagos: deal.pago ? [deal.pago] : [],
  };
  return contactosDe("proveedor").map(function (prov) {
    const par = cruzar(comoComprador, prov);
    return par ? { contacto: prov, cruce: par } : null;
  }).filter(Boolean).sort(function (a, b) { return b.cruce.puntos - a.cruce.puntos; });
}

/* ---------------- lector de anuncios ----------------
   Estos posts casi siempre vienen con la misma estructura de etiquetas,
   en inglés o en español. Leerlas evita teclear el anuncio entero, que
   es donde se pierde la mitad de las ganas de trabajarlo. */

const ETIQUETAS = [
  ["producto", ["producto", "product", "commodity", "mercancia", "mercancía", "goods"]],
  ["cantidad", ["cantidad", "quantity", "volumen", "volume", "qty"]],
  ["paisOrigen", ["proveedor", "supplier", "origen", "origin", "pais de origen", "país de origen", "source", "seller"]],
  ["paisDestino", ["comprador", "buyer", "destino", "destination", "pais destino", "país destino", "delivery"]],
  ["ciudad", ["ciudad", "city", "puerto", "port"]],
  ["requisitos", ["requisitos", "requirements", "specs", "especificaciones", "documentacion", "documentación"]],
  ["incoterm", ["incoterm", "incoterms", "terminos de entrega", "términos de entrega"]],
  ["pago", ["pago", "payment", "terminos de pago", "términos de pago", "payment terms"]],
  ["fee", ["comision", "comisión", "commission", "fee", "finder", "finders fee", "finder's fee"]],
  ["fechaLimite", ["fecha limite", "fecha límite", "deadline", "plazo", "cierre"]],
  ["_purpose", ["proposito", "propósito", "purpose", "uso", "objetivo"]],
];

const UNIDADES_TEXTO = [
  [/\b(toneladas?|tonnes?|tons?|metric tons?|mt|tm)\b/i, "t"],
  [/\b(kilos?|kilogramos?|kg)\b/i, "kg"],
  [/\b(libras?|lbs?|pounds?)\b/i, "lb"],
  [/\b(quintales?|qq)\b/i, "qq"],
  [/\b(contenedores?|containers?|fcl)\b/i, "contenedores"],
];

function limpiarLinea(linea) {
  // Fuera emojis, viñetas y adornos del principio de la línea.
  return linea
    .replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{2BFF}\u{FE0F}\u{20E3}]/gu, " ")
    .replace(/^[\s*\-–—•·>»#]+/, "")
    .replace(/\s+/g, " ")
    .trim();
}

function numeroDe(texto) {
  // "5,000" y "5.000" son ambos cinco mil; "5.5" es cinco y medio.
  const m = (texto || "").match(/[\d][\d.,]*/);
  if (!m) return null;
  let s = m[0].replace(/[.,](?=\d{3}\b)/g, "");
  s = s.replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function parsearAnuncio(texto) {
  const salida = { requisitos: [] };
  const ciudades = [];
  let ultimoLado = null;   // hacia qué lado apunta la próxima "City:"

  limpiarLinea(texto);
  const lineas = (texto || "").split(/\n+/).map(limpiarLinea).filter(Boolean);

  for (const linea of lineas) {
    const corte = linea.match(/^([^:]{2,40}):\s*(.+)$/);
    if (corte) {
      const rotulo = norm(corte[1]).replace(/[^a-z\s']/g, "").trim();
      const valor = corte[2].trim();
      const par = ETIQUETAS.find(function (e) {
        return e[1].some(function (alias) { return rotulo === alias || rotulo.endsWith(" " + alias) || rotulo.startsWith(alias + " "); });
      });
      if (par) {
        const campo = par[0];
        if (campo === "ciudad") { ciudades.push({ lado: ultimoLado, valor: valor }); continue; }
        if (campo === "_purpose") continue;
        if (campo === "paisOrigen") ultimoLado = "origen";
        if (campo === "paisDestino") ultimoLado = "destino";
        if (campo === "requisitos") {
          salida.requisitos = valor.split(/[,;]|\sy\s|\sand\s/).map(function (s) {
            return s.replace(/\.$/, "").trim();
          }).filter(function (s) { return s.length > 2; });
          continue;
        }
        if (campo === "cantidad") {
          const n = numeroDe(valor);
          if (n !== null) salida.cantidad = n;
          for (const [re, u] of UNIDADES_TEXTO) if (re.test(valor)) { salida.unidad = u; break; }
          continue;
        }
        if (campo === "fee") { const n = numeroDe(valor); if (n !== null) salida.fee = n; continue; }
        if (!salida[campo]) salida[campo] = valor;
        continue;
      }
    }

    // Sin etiqueta: la línea del gancho suele traer la comisión.
    if (!salida.fee) {
      const m = linea.match(/(?:earn|gana[rs]?|pago|paga|comisi[oó]n|fee)[^\d$]{0,24}(?:us\$|usd|\$)?\s*([\d][\d.,]*)/i)
        || linea.match(/(?:us\$|usd|\$)\s*([\d][\d.,]*)/i);
      if (m) { const n = numeroDe(m[1]); if (n !== null && n >= 100) salida.fee = n; }
    }
    if (!salida.cantidad) {
      const m = linea.match(/([\d][\d.,]*)\s*(toneladas?|tonnes?|tons?|metric tons?|mt|kg|contenedores?|containers?)/i);
      if (m) {
        const n = numeroDe(m[1]);
        if (n !== null) {
          salida.cantidad = n;
          for (const [re, u] of UNIDADES_TEXTO) if (re.test(m[2])) { salida.unidad = u; break; }
        }
      }
    }
  }

  // Repartir las ciudades: la que sigue al proveedor es origen, la que
  // sigue al comprador es destino. Si vinieron sueltas, en orden.
  const origen = ciudades.filter(function (c) { return c.lado === "origen"; });
  const destino = ciudades.filter(function (c) { return c.lado === "destino"; });
  const sueltas = ciudades.filter(function (c) { return !c.lado; });
  if (origen.length) salida.ciudadOrigen = origen[0].valor;
  if (destino.length) salida.ciudadDestino = destino[0].valor;
  if (!salida.ciudadOrigen && sueltas.length) salida.ciudadOrigen = sueltas.shift().valor;
  if (!salida.ciudadDestino && sueltas.length) salida.ciudadDestino = sueltas.shift().valor;

  if (!salida.unidad && salida.cantidad) salida.unidad = "t";
  return salida;
}

function contarLeidos(campos) {
  return Object.keys(campos).filter(function (k) {
    const v = campos[k];
    return Array.isArray(v) ? v.length > 0 : v !== undefined && v !== "" && v !== null;
  }).length;
}

function partidaHS(producto) {
  const p = clave(producto);
  for (const clave in PARTIDAS_HS) if (p.includes(clave)) return PARTIDAS_HS[clave];
  return null;
}

    return '<script id="' + s.id + '" data-src>' + s.textContent + "<\/script>";
  }).join("\n");
  const json = JSON.stringify(estado).replace(/</g, "\\u003c");
  return [
    "<!doctype html>",
    '<html lang="es"><head><meta charset="utf-8">',
    '<meta name="viewport" content="width=device-width, initial-scale=1">',
    "<title>Mesa de Intermediación</title>",
    '<link rel="preconnect" href="https://fonts.googleapis.com">',
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Faustina:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">',
    '<style id="css">' + css + "</style></head><body>",
    '<div id="raiz"></div>',
    '<script type="application/json" id="estado">' + json + "<\/script>",
    fuentes,
    "</body></html>",
  ].join("\n");
}

async function guardar() {
  if (!publicar) { brindis("Guardado sólo en este dispositivo: la nube no está disponible acá."); return; }
  const boton = document.getElementById("btn-guardar");
  if (boton) { boton.disabled = true; boton.textContent = "Guardando…"; }
  try {
    await publicar.publish(documentoCompleto());
    // La vista se recarga sola a la versión nueva.
  } catch (error) {
    const codigo = (error && error.code) || "upstream_error";
    if (codigo === "conflict") return;           // ya viene la recarga con la versión ganadora
    if (codigo === "not_writer" || codigo === "not_granted" || codigo === "not_declared") {
      ui.soloLocal = true;
      brindis("Esta vista es de sólo lectura. Tus cambios quedan en este dispositivo.");
    } else if (codigo === "too_large") {
      brindis("El expediente ya no cabe en una versión. Archivá deals cerrados.");
    } else if (codigo === "rate_limited") {
      brindis("Demasiados guardados seguidos. Esperá unos segundos y volvé a intentar.");
    } else {
      brindis("No se pudo guardar en la nube. Tus cambios siguen en este dispositivo.");
    }
    render();
  }
}

let temporizadorBrindis = null;
function brindis(texto) {
  let n = document.getElementById("brindis");
  if (!n) {
    n = document.createElement("div");
    n.id = "brindis";
    n.className = "brindis";
    n.setAttribute("role", "status");
    document.body.appendChild(n);
  }
  n.textContent = texto;
  clearTimeout(temporizadorBrindis);
  temporizadorBrindis = setTimeout(function () { n.remove(); }, 3200);
}

async function copiar(texto) {
  try {
    await navigator.clipboard.writeText(texto);
    brindis("Copiado");
  } catch (e) {
    const a = document.createElement("textarea");
    a.value = texto;
    a.style.position = "fixed";
    a.style.opacity = "0";
    document.body.appendChild(a);
    a.select();
    try { document.execCommand("copy"); brindis("Copiado"); }
    catch (e2) { brindis("No se pudo copiar. Seleccioná el texto a mano."); }
    a.remove();
  }
}

async function descargar(nombre, texto) {
  if (!bajar) { copiar(texto); return; }
  try { await bajar.save({ filename: nombre, data: texto }); }
  catch (error) {
    const c = (error && error.code) || "unavailable";
    if (c === "declined") return;
    brindis("No se pudo descargar. Copiá el texto y pegalo en un documento.");
  }
}
</script>

function paisMostrar(pais, idioma) {

function necesidadDeDeal(d) {

/* La comisión que se publica NO es la tuya: es la tajada que le pagás a
   quien te traiga el exportador, y sale de tu bolsillo si cierra. Y el

   El anuncio que copiaste ofrecía 55.000 sobre una carga de 30 millones,

function escalaFinder(valor) {
  if (valor < 250000) return 0.03;
  if (valor < 1000000) return 0.025;
  if (valor < 5000000) return 0.015;
  if (valor < 20000000) return 0.005;
  return 0.0025;
}

function redondear(monto) {
  const paso = monto >= 50000 ? 5000 : monto >= 10000 ? 1000 : 500;
  return Math.max(paso, Math.round(monto / paso) * paso);
}

function comisionSugerida(n, duenio) {
  const puesta = num((duenio || {}).feeAnuncio);
  if (puesta) return { monto: puesta, base: "" };

      base: "un tercio de tu comisión de " + usd(n.fee) + ", así te queda el resto",

  if (!n.valor) return { monto: 0, base: "" };
  const pct = escalaFinder(n.valor);
  return {
    monto: redondear(n.valor * pct),
    base: (pct * 100).toFixed(2).replace(/\.?0+$/, "") + "% de una carga de ~" + usd(n.valor) +
      ", que es lo que se paga en cargas de ese tamaño",
  };
}

/* Redibujar toda la app mientras escribís en un campo te arranca el
   foco y se come el clic siguiente. Cuando cambia la comisión sólo se
   actualiza lo que depende de ella. */
function necesidadDe(duenio) {
  return ui.seccion === "deals" ? necesidadDeDeal(duenio) : necesidadDeComprador(duenio);
}

function refrescarPublicar(duenio) {
  if (!duenio) return;
  const nec = necesidadDe(duenio);
  const c = comisionSugerida(nec, duenio);
  const pista = document.getElementById("pista-comision");
  if (pista) pista.innerHTML = pistaComision(c);
  if (ui.postAbierto) {
    const formato = FORMATOS.find(function (f) { return f[0] === ui.postAbierto; });
    const pre = document.querySelector("pre.doc");
    if (formato && pre) pre.textContent = formato[3](nec, ui.idiomaPost || "es", duenio);
  }
}

  return '<div class="panel">' +
    tarjeta("para qué sirve publicarlo",
      "<p>" + esc(origenTexto) + "</p>" +
      "<p>El anuncio no es sólo para encontrar este exportador. Es una red: te van a escribir exportadores que se identifican solos y gente que quiere la comisión. " +
      "<strong>Fichá a todos en el libro</strong>, cierre o no cierre este trato. Eso es lo que se acumula.</p>" +
      "<p>Contá con que la mitad de los que respondan sean otros intermediarios sin carga real. Pediles el número fiscal del exportador en el primer mensaje: los filtra solos.</p>") +
    aviso +
    tarjeta("formato", selector) +
    cuerpo + "</div>";
}

function vistaHojaContacto(clase) {
  const c = contactoActual();
  const abre = '<main class="hoja' + (clase || "") + '">';
  if (!c) return abre + '<div class="vacio"><p>Elegí una ficha de la lista para verla.</p></div></main>';
  const panel = ui.tabContacto === "verif" ? panelVerifContacto(c)
    : ui.tabContacto === "cruce" ? panelCruceContacto(c)
    : ui.tabContacto === "publicar" && c.lado === "comprador"
      ? panelPublicar(necesidadDeComprador(c),
          "Publicás lo que necesita " + (c.nombre || "este comprador") + " sin decir quién es, para que aparezcan proveedores nuevos.", c)
    : ui.tabContacto === "bitacora" ? panelBitacoraContacto(c)
    : panelFichaContacto(c);
  return abre + vistaCabezaContacto(c) + vistaPestanasContacto() + panel + "</main>";
}

function vistaHoja(clase) {
  const d = dealActual();
  const abre = '<main class="hoja' + (clase || "") + '">';
  if (!d) return abre + vistaVacioHoja() + "</main>";
  const panel = ui.tab === "proveedor" ? panelProveedor(d)
    : ui.tab === "publicar" ? panelPublicar(necesidadDeDeal(d),
        "Publicás la necesidad de este deal para que aparezca el exportador que la cubre.", d)
    : ui.tab === "docs" ? panelDocs(d)
    : ui.tab === "bitacora" ? panelBitacora(d)
    : panelRiesgo(d);
  return abre + vistaCabeza(d) + vistaPestanas() + panel + "</main>";
}

function vistaAviso() {
  if (ui.soloLocal) {
    return '<div class="aviso">Esta vista no puede publicar cambios. Lo que cargues queda guardado en este navegador.</div>';
  }
  if (ui.sucio && publicar) {
    return '<div class="aviso">Tenés cambios que sólo están en este dispositivo.' +
      '<button class="btn chico" data-accion="guardar">Guardar ahora</button></div>';
  }
  return "";
}

function render() {
  const movil = window.matchMedia("(max-width: 900px)").matches;
  const enDeals = ui.seccion === "deals";
  const abierto = enDeals ? ui.sel : ui.selContacto;
  const ocultaRail = movil && abierto ? " oculta" : "";
  const ocultaHoja = movil && !abierto ? " oculta" : "";
  const rail = enDeals
    ? vistaResumen() + vistaLista()
    : vistaResumenLibro(ui.seccion) + vistaListaLibro(ui.seccion);
  const hoja = enDeals ? vistaHoja(ocultaHoja) : vistaHojaContacto(ocultaHoja);
  document.getElementById("raiz").innerHTML =
    '<div class="marco">' + vistaBarra() + vistaSecciones() + vistaAviso() +
    '<div class="cuerpo"><aside class="rail' + ocultaRail + '">' + rail + "</aside>" +
    hoja + "</div></div>" +
    (ui.modal ? vistaModal() : "");
}
</script>
<script id="eventos" data-src>
"use strict";

/* ---------------- modales ---------------- */

function campo(rot, nombre, valor, tipo, ancho, extra) {

}

function vistaModal() {

    const p = estado.perfil || {};
    return '<div class="velo" data-accion="velo"><div class="modal" role="dialog" aria-modal="true">' +

      '<button class="btn fantasma chico" data-accion="cerrar">Cerrar</button></header>' +
      '<form data-accion="guardar-perfil"><p style="color:var(--tinta-suave);font-size:13.5px">' +

      '<div class="rejilla">' +

  if (ui.modal === "contacto") {

    if (!c) return "";
    const esComprador = c.lado === "comprador";
    return '<div class="velo" data-accion="velo"><div class="modal" role="dialog" aria-modal="true">' +
      "<header><h2>" + (editandoC ? "Editar ficha" : "Fichar " + (esComprador ? "comprador" : "proveedor")) + "</h2>" +
      '<span class="crece"></span><button class="btn fantasma chico" data-accion="cerrar">Cerrar</button></header>' +
      '<form data-accion="guardar-contacto"><div class="rejilla">' +
      campo("razón social", "nombre", c.nombre, "text", true, "required") +
      campo("país", "pais", c.pais) +
      campo("ciudad", "ciudad", c.ciudad) +
      campo("número fiscal (RNC / RUC / NIT)", "fiscal", c.fiscal) +
      campo("persona de contacto", "persona", c.persona) +
      campo("cargo", "cargo", c.cargo) +
      campo("correo", "email", c.email) +
      campo("teléfono", "telefono", c.telefono) +
      campo("sitio web", "web", c.web) +
      '<label class="campo ancho"><span class="etiqueta">productos (separados por coma)</span>' +
      '<input type="text" name="productos" value="' + esc((c.productos || []).join(", ")) + '" placeholder="cacao en grano, manteca de cacao"></label>' +
      campo(esComprador ? "volumen que necesita" : "capacidad anual", "volumen", c.volumen, "number", false, 'step="any" min="0"') +
      '<label class="campo"><span class="etiqueta">unidad</span><select name="unidad">' +
      ["t", "kg", "lb", "qq", "unidades", "contenedores"].map(function (u) {
        return '<option value="' + u + '"' + ((c.unidad || "t") === u ? " selected" : "") + ">" + u + "</option>";
      }).join("") + "</select></label>" +
      '<label class="campo ancho"><span class="etiqueta">certificaciones' + (esComprador ? " que exige" : " que tiene") + ' (separadas por coma)</span>' +
      '<input type="text" name="certificaciones" value="' + esc((c.certificaciones || []).join(", ")) + '" placeholder="orgánico, Fairtrade, Rainforest"></label>' +
      '<label class="campo"><span class="etiqueta">incoterms (coma)</span>' +
      '<input type="text" name="incoterms" value="' + esc((c.incoterms || []).join(", ")) + '" placeholder="FOB, CIF"></label>' +
      '<label class="campo"><span class="etiqueta">formas de pago (coma)</span>' +
      '<input type="text" name="pagos" value="' + esc((c.pagos || []).join(", ")) + '" placeholder="carta de crédito a la vista"></label>' +
      '<label class="campo ancho"><span class="etiqueta">' +
      (esComprador ? "orígenes que le interesan" : "destinos a los que ya exportó") + ' (coma)</span>' +
      '<input type="text" name="mercados" value="' + esc((c.mercados || []).join(", ")) + '" placeholder="' +
      (esComprador ? "República Dominicana, Ecuador" : "Canadá, Alemania") + '"></label>' +
      (esComprador
        ? '<label class="campo ancho"><span class="etiqueta">mandato: qué firmó y por cuánto</span>' +
          '<textarea name="mandato" placeholder="LOI firmada 12/03 por 5.000 t de cacao, con prueba de fondos del banco.">' +
          esc(c.mandato || "") + "</textarea></label>" +
          campo("el mandato vence", "mandatoVence", c.mandatoVence, "date")
        : "") +
      "</div><footer>" +
      '<button class="btn fantasma" type="button" data-accion="cerrar">Cancelar</button>' +
      '<button class="btn primario" type="submit">' + (editandoC ? "Guardar cambios" : "Fichar") + "</button>" +
      "</footer></form></div></div>";
  }

  const editando = ui.modal === "editar";
  const d = editando ? dealActual() : (ui.borrador || { unidad: "t", etapa: "captada", requisitos: [] });
  if (!d) return "";
  const pegar = editando ? "" :
    '<div class="pegar"><label class="campo"><span class="etiqueta">pegá el anuncio y lo leo por vos</span>' +
    '<textarea name="anuncio" rows="4" placeholder="EARN $55,000 IF YOU CAN CONNECT US TO…&#10;Product: Premium cocoa beans&#10;Quantity: 5,000 tonnes">' +
    esc(d.anuncio || "") + "</textarea></label>" +
    '<div><button class="btn" type="button" data-accion="leer-anuncio">Leer anuncio</button></div></div>';
  return '<div class="velo" data-accion="velo"><div class="modal" role="dialog" aria-modal="true">' +
    "<header><h2>" + (editando ? "Editar oportunidad" : "Nueva oportunidad") + "</h2>" +
    '<span class="crece"></span><button class="btn fantasma chico" data-accion="cerrar">Cerrar</button></header>' +
    '<form data-accion="guardar-deal">' + pegar + '<div class="rejilla">' +
    campo("producto", "producto", d.producto, "text", true, "required placeholder=\"cacao en grano\"") +
    campo("cantidad", "cantidad", d.cantidad, "number", false, 'step="any" min="0"') +
    '<label class="campo"><span class="etiqueta">unidad</span><select name="unidad">' +
      ["t", "kg", "lb", "qq", "unidades", "contenedores"].map(function (u) {
        return '<option value="' + u + '"' + ((d.unidad || "t") === u ? " selected" : "") + ">" + u + "</option>";
      }).join("") + "</select></label>" +
    campo("precio por unidad (USD)", "precio", d.precio, "number", false, 'step="any" min="0" placeholder="opcional"') +
    campo("comisión para vos (USD)", "fee", d.fee, "number", false, 'step="any" min="0"') +
    campo("país de origen", "paisOrigen", d.paisOrigen, "text", false, 'placeholder="República Dominicana"') +
    campo("ciudad de origen", "ciudadOrigen", d.ciudadOrigen) +
    campo("país de destino", "paisDestino", d.paisDestino) +
    campo("ciudad de destino", "ciudadDestino", d.ciudadDestino) +
    campo("comprador final", "comprador", d.comprador, "text", true, 'placeholder="razón social, si te la dieron"') +
    campo("incoterm", "incoterm", d.incoterm, "text", false, 'placeholder="FOB, CIF, EXW…"') +
    campo("términos de pago", "pago", d.pago, "text", false, 'placeholder="carta de crédito a la vista"') +
    campo("fecha límite", "fechaLimite", d.fechaLimite, "date") +
    campo("dónde lo viste", "fuente", d.fuente, "text", false, 'placeholder="Instagram @cuenta"') +
    '<label class="campo ancho"><span class="etiqueta">requisitos del comprador (uno por línea)</span>' +
    '<textarea name="requisitos" placeholder="Trazabilidad&#10;Especificaciones de fermentación">' +
    esc((d.requisitos || []).join("\n")) + "</textarea></label>" +
    "</div><footer>" +
    '<button class="btn fantasma" type="button" data-accion="cerrar">Cancelar</button>' +
    '<button class="btn primario" type="submit">' + (editando ? "Guardar cambios" : "Crear oportunidad") + "</button>" +
    "</footer></form></div></div>";
}

/* ---------------- eventos ---------------- */

function accionDe(nodo) {
  const el = nodo.closest("[data-accion]");
  return el ? { el: el, valor: el.getAttribute("data-accion") } : null;
}

document.addEventListener("click", function (evento) {
  const a = accionDe(evento.target);
  if (!a) return;
  const [verbo, arg] = a.valor.split(":");

  if (verbo === "velo" && evento.target !== a.el) return; // clic dentro del modal

  switch (verbo) {
    case "nuevo": ui.modal = "nuevo"; ui.borrador = null; render(); break;
    case "seccion": ui.seccion = arg; render(); break;
    case "ir": ui.seccion = arg; ui.selContacto = null; render(); break;
    case "ver-contacto": ui.seccion = contactoPorId(arg).lado; ui.selContacto = arg; ui.tabContacto = "ficha"; render(); break;
    case "sel-contacto": {
      const c = contactoPorId(arg);
      if (c) { ui.seccion = c.lado; ui.selContacto = arg; ui.tabContacto = "ficha"; render(); }
      break;
    }
    case "tab-contacto": ui.tabContacto = arg; render(); break;
    case "nuevo-contacto":
      ui.modal = "contacto"; ui.modalLado = arg; ui.borrador = null;
      ui.selContactoEditando = null; render();
      break;
    case "editar-contacto":
      ui.modal = "contacto"; ui.modalLado = contactoActual().lado;
      ui.selContactoEditando = ui.selContacto; ui.borrador = null; render();
      break;
    case "borrar-contacto": {
      const c = contactoActual();
      if (c && confirm("¿Borrar la ficha de “" + (c.nombre || c.id) + "”?")) {
        estado.contactos = estado.contactos.filter(function (x) { return x.id !== c.id; });
        ui.selContacto = null;
        tocar(); render();
      }
      break;
    }
    case "editar": ui.modal = "editar"; render(); break;
    case "perfil": ui.modal = "perfil"; render(); break;
    case "cerrar": case "velo": ui.modal = null; ui.borrador = null; ui.selContactoEditando = null; render(); break;
    case "leer-anuncio": {
      const form = a.el.closest("form");
      const actuales = Object.fromEntries(new FormData(form).entries());
      const leido = parsearAnuncio(actuales.anuncio || "");
      const cuantos = contarLeidos(leido);
      if (!cuantos) { brindis("No pude sacar campos de ese texto. Cargalos a mano."); break; }
      const base = Object.assign({}, actuales);
      base.requisitos = (actuales.requisitos || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
      for (const campo in leido) {
        const valor = leido[campo];
        const tiene = Array.isArray(valor) ? valor.length > 0 : valor !== "" && valor !== undefined && valor !== null;
        if (tiene) base[campo] = valor;
      }
      ui.borrador = base;
      render();
      brindis(cuantos + (cuantos === 1 ? " campo leído" : " campos leídos") + ". Revisá antes de crear.");
      break;
    }
    case "copiar-expediente": copiar(expediente(dealActual(), estado.perfil)); break;
    case "bajar-expediente": descargar("expediente-" + dealActual().id + ".md", expediente(dealActual(), estado.perfil)); break;
    case "guardar": guardar(); break;
    case "volver": if (ui.seccion === "deals") ui.sel = null; else ui.selContacto = null; render(); break;
    case "sel": ui.sel = arg; ui.tab = "riesgo"; ui.docAbierto = null; render(); break;
    case "tab": ui.tab = arg; render(); break;
    case "doc": ui.docAbierto = ui.docAbierto === arg ? null : arg; render(); break;
    case "post": ui.postAbierto = ui.postAbierto === arg ? null : arg; render(); break;
    case "idioma": ui.idiomaPost = arg; render(); break;
    case "copiar-post": {
      const formato = FORMATOS.find(function (x) { return x[0] === arg; });
      if (!formato) break;
      const duenio = ui.seccion === "deals" ? dealActual() : contactoActual();
      const nec = ui.seccion === "deals" ? necesidadDeDeal(duenio) : necesidadDeComprador(duenio);
      copiar(formato[3](nec, ui.idiomaPost || "es", duenio));
      break;
    }
    case "copiar-texto": copiar(a.el.getAttribute("data-texto")); break;
    case "copiar-doc": {
      const doc = DOCUMENTOS.find(function (x) { return x[0] === arg; });
      if (doc) copiar(doc[3](dealActual(), estado.perfil));
      break;
    }
    case "bajar-doc": {
      const doc = DOCUMENTOS.find(function (x) { return x[0] === arg; });
      if (doc) descargar(arg + "-" + dealActual().id + ".md", doc[3](dealActual(), estado.perfil));
      break;
    }
    case "borrar": {
      const d = dealActual();
      if (d && confirm("¿Borrar “" + (d.producto || d.id) + "” y toda su bitácora?")) {
        estado.deals = estado.deals.filter(function (x) { return x.id !== d.id; });
        ui.sel = null;
        tocar(); render();
      }
      break;
    }
  }
});

document.addEventListener("submit", function (evento) {
  const a = accionDe(evento.target);
  if (!a) return;
  evento.preventDefault();
  const datos = Object.fromEntries(new FormData(evento.target).entries());

  if (a.valor === "guardar-perfil") {
    estado.perfil = datos;
    ui.modal = null;
    tocar(); render();
    brindis("Datos guardados");
    return;
  }

  if (a.valor === "guardar-deal") {
    const requisitos = (datos.requisitos || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    if (ui.modal === "editar") {
      const d = dealActual();
      Object.assign(d, datos, { requisitos: requisitos });
    } else {
      const id = nuevoId(datos.producto, datos.paisOrigen);
      estado.deals.unshift(Object.assign({
        id: id, etapa: "captada", acuerdoFirmado: false, notas: [],
        creado: new Date().toISOString().slice(0, 10),
      }, datos, { requisitos: requisitos }));
      ui.sel = id;
      ui.tab = "riesgo";
    }
    ui.modal = null;
    ui.borrador = null;
    tocar(); render();
    return;
  }

  if (a.valor === "guardar-contacto") {
    const campos = ["productos", "certificaciones", "incoterms", "pagos", "mercados"];
    const limpio = Object.assign({}, datos);
    campos.forEach(function (k) { limpio[k] = lista(datos[k]); });
    if (ui.selContactoEditando) {
      Object.assign(contactoActual(), limpio);
    } else {
      const lado = ui.modalLado;
      const id = nuevoIdContacto(datos.nombre, lado);
      estado.contactos.push(Object.assign(contactoNuevo(lado), limpio, {
        id: id, lado: lado, creado: new Date().toISOString().slice(0, 10),
      }));
      ui.seccion = lado;
      ui.selContacto = id;
      ui.tabContacto = "ficha";
    }
    ui.modal = null; ui.borrador = null; ui.selContactoEditando = null;
    tocar(); render();
    return;
  }

  if (a.valor === "nota-contacto") {
    const c = contactoActual();
    if (c && (datos.texto || "").trim()) {
      c.notas = c.notas || [];
      c.notas.push({ fecha: new Date().toISOString().slice(0, 10), texto: datos.texto.trim() });
      tocar(); render();
    }
    return;
  }

  if (a.valor === "nota") {
    const d = dealActual();
    if (d && (datos.texto || "").trim()) {
      d.notas = d.notas || [];
      d.notas.push({ fecha: new Date().toISOString().slice(0, 10), texto: datos.texto.trim() });
      tocar(); render();
    }
  }
});

document.addEventListener("change", function (evento) {
  const a = accionDe(evento.target);
  if (!a) return;
  const [verbo, arg] = a.valor.split(":");

  if (verbo === "verif") {
    const c = contactoActual();
    if (c) { c.verif = c.verif || {}; c.verif[arg] = evento.target.checked; tocar(); render(); }
    return;
  }
  if (verbo === "estado-contacto") {
    const c = contactoActual();
    if (c) { c.estado = evento.target.value; tocar(); render(); }
    return;
  }

  const d = dealActual();
  if (!d) return;
  if (a.valor === "contraparte") { d.contraparteId = evento.target.value; tocar(); render(); }
  if (a.valor === "etapa") { d.etapa = evento.target.value; tocar(); render(); }
  if (a.valor === "firmado") { d.acuerdoFirmado = evento.target.checked; tocar(); render(); }
});

// En `input` y sin redibujar: el campo conserva el foco y el clic
// siguiente llega a su destino.
document.addEventListener("input", function (evento) {
  const a = accionDe(evento.target);
  if (!a || a.valor !== "fee-anuncio") return;
  const duenio = ui.seccion === "deals" ? dealActual() : contactoActual();
  if (!duenio) return;
  duenio.feeAnuncio = evento.target.value;
  tocar();
  refrescarPublicar(duenio);
});

document.addEventListener("keydown", function (evento) {
  if (evento.key === "Escape" && ui.modal) { ui.modal = null; render(); }
});

window.addEventListener("resize", function () { render(); });

/* ---------------- arranque ---------------- */

cargarEstado();
render();

if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("artifact").then(function (cap) {
    publicar = cap;
    if (!cap) ui.soloLocal = true;
    render();
  });
  window.claude.use("downloads").then(function (cap) { bajar = cap; render(); });
} else {
  ui.soloLocal = true;
  render();
}
</script>
