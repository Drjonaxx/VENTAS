body {

.etiqueta {

/* ---------- estructura ---------- */
.marco { min-height: 100vh; display: flex; flex-direction: column; }

.barra {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px 20px;
  border-bottom: 1px solid var(--linea);
  background: var(--superficie);
  position: sticky; top: 0; z-index: 20;
}
.barra h1 { font-size: 20px; letter-spacing: -.01em; }
.barra .folio { color: var(--tinta-suave); }
.crece { flex: 1; }

.btn {
  border: 1px solid var(--linea-fuerte);
  background: var(--superficie);
  color: var(--tinta);
  padding: 7px 13px;
  border-radius: var(--r);
  cursor: pointer;
  font-size: 13.5px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 7px;
  transition: background .12s ease, border-color .12s ease;
}
.btn:hover { background: var(--franja); border-color: var(--acento); }
.btn.primario { background: var(--acento); border-color: var(--acento); color: var(--superficie); }
.btn.primario:hover { filter: brightness(1.08); }
.btn.fantasma { border-color: transparent; background: transparent; color: var(--tinta-suave); }
.btn.fantasma:hover { background: var(--franja); color: var(--tinta); }
.btn.chico { padding: 4px 9px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: default; }

.aviso {
  padding: 8px 20px; font-size: 13px;
  background: var(--ambar-tenue); color: var(--tinta);
  border-bottom: 1px solid var(--linea);
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}

.cuerpo { flex: 1; display: grid; grid-template-columns: minmax(300px, 360px) 1fr; }
@media (max-width: 900px) { .cuerpo { grid-template-columns: 1fr; } }

/* ---------- panel izquierdo ---------- */
.rail { border-right: 1px solid var(--linea); display: flex; flex-direction: column; min-width: 0; }
@media (max-width: 900px) { .rail { border-right: none; border-bottom: 1px solid var(--linea); } }

.resumen { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--linea); }
.cifra { padding: 12px 14px; border-right: 1px solid var(--linea); }
.cifra:last-child { border-right: none; }
.cifra .valor { font-family: "IBM Plex Mono", monospace; font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; display: block; }

.lista { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
.fila {
  width: 100%; text-align: left; background: transparent; border: none;
  border-bottom: 1px solid var(--linea);
  padding: 13px 16px; cursor: pointer; display: grid; gap: 5px;
}
.fila:nth-child(even) { background: color-mix(in srgb, var(--franja) 45%, transparent); }

.fila[aria-current="true"] { background: var(--acento-tenue); box-shadow: inset 3px 0 0 var(--acento); }
.fila .titulo { font-family: Faustina, Georgia, serif; font-size: 17px; font-weight: 600; line-height: 1.25; }
.fila .meta { font-size: 12.5px; color: var(--tinta-suave); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.chip {
  font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .08em;

}
.chip.verde { background: var(--verde-tenue); border-color: transparent; color: var(--verde); }
.chip.amarillo { background: var(--ambar-tenue); border-color: transparent; color: var(--ambar); }
.chip.rojo { background: var(--rojo-tenue); border-color: transparent; color: var(--rojo); }

.vacio { padding: 34px 22px; color: var(--tinta-suave); display: grid; gap: 12px; justify-items: start; }

/* ---------- panel derecho ---------- */
.hoja { min-width: 0; display: flex; flex-direction: column; }

.hoja-cabeza h2 { font-size: 27px; line-height: 1.15; }
.hoja-cabeza .ruta { color: var(--tinta-suave); font-size: 14px; margin-top: 3px; }

.sello {
  flex-shrink: 0;
  border: 2.5px solid currentColor; border-radius: 5px;
  padding: 6px 12px 5px; transform: rotate(-4deg);
  text-align: center; font-family: "IBM Plex Mono", monospace;
  box-shadow: inset 0 0 0 1.5px currentColor;
  opacity: .92;
}
.sello .puntos { font-size: 25px; font-weight: 600; line-height: 1; display: block; letter-spacing: -.02em; }

.sello.amarillo { color: var(--ambar); }
.sello.rojo { color: var(--rojo); }

.pestanas { display: flex; gap: 2px; padding: 16px 24px 0; border-bottom: 1px solid var(--linea); overflow-x: auto; }

.pasos { margin: 0; padding-left: 19px; display: grid; gap: 7px; font-size: 14px; }
.pasos li::marker { color: var(--acento); }

.fuente { padding: 11px 0; border-bottom: 1px dashed var(--linea); display: grid; gap: 3px; }
.fuente:last-child { border-bottom: none; }

pre.crudo {
  margin: 0; font-family: "IBM Plex Mono", monospace; font-size: 12px; line-height: 1.6;

.pegar { display: grid; gap: 9px; }

.nota { padding: 10px 0; border-bottom: 1px dashed var(--linea); }
.nota:last-child { border-bottom: none; }
.nota .f { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--tinta-suave); }

label.campo { display: grid; gap: 5px; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  border: 1px solid var(--linea-fuerte); background: var(--superficie);
  border-radius: var(--r); padding: 8px 10px; width: 100%; font-size: 14px;

textarea { resize: vertical; min-height: 70px; }
.rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 13px; }
.ancho { grid-column: 1 / -1; }
.check { display: flex; gap: 9px; align-items: center; font-size: 14px; }

.velo {
  position: fixed; inset: 0; background: rgba(12,18,13,.5); z-index: 50;

}
.modal {
  background: var(--superficie); border: 1px solid var(--linea-fuerte); border-radius: var(--r);
  width: min(720px, 100%); box-shadow: var(--sombra); margin: auto;
}
.modal > header { padding: 15px 20px; border-bottom: 1px solid var(--linea); display: flex; align-items: center; gap: 12px; }
.modal > header h2 { font-size: 20px; }
.modal form { padding: 20px; display: grid; gap: 14px; }
.modal footer { display: flex; gap: 9px; justify-content: flex-end; padding-top: 4px; }

.brindis {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--tinta); color: var(--papel); padding: 9px 17px;
  border-radius: 999px; font-size: 13.5px; z-index: 90; box-shadow: var(--sombra);

.solo-movil { display: none; }
@media (max-width: 900px) {
  .solo-movil { display: inline-flex; }

function clave(texto) {
  let s = norm(texto);

  }

function usd(n) { return "USD " + Math.round(n).toLocaleString("es-DO"); }

  const f = A_TONELADA[norm(d.unidad)];

  const t = toneladas(d), cap = capacidadPais(d);

  }

  // Contraparte.
  if (!(d.comprador || "").trim()) push("alta", "No hay comprador final identificado. Sin razón social verificable no hay trato, sólo un anuncio.");
  const fuente = norm(d.fuente);
  if (["instagram", "facebook", "tiktok", "whatsapp", "telegram", "grupo"].some(function (p) { return fuente.includes(p); }))
    push("media", "La oportunidad viene de un anuncio público: asumí que hay una cadena de intermediarios delante tuyo. Pedí que te muestren el mandato o la LOI firmada del comprador final.");

  // Términos de pago.
  const pago = norm(d.pago);
  const jerga = JERGA_FRAUDE.filter(function (j) { return pago.includes(j); });
  if (jerga.length) push("stop", "Los términos de pago usan jerga de cadena de fraude (" + jerga.join(", ").trim() + "). En comercio real se paga con carta de crédito irrevocable a la vista o contra documentos. Salite.");
  const todo = norm(d.pago + " " + (d.requisitos || []).join(" "));
  if (SENALES_ADELANTO.some(function (s) { return todo.includes(s); }))
    push("stop", "Te están pidiendo pagar algo por adelantado. Un intermediario cobra al cierre, nunca paga por entrar.");
  if (!(d.pago || "").trim()) push("media", "Faltan los términos de pago. Preguntalos antes de buscar proveedor: definen si el exportador puede siquiera participar.");
  if (!(d.incoterm || "").trim()) push("media", "Falta el Incoterm (FOB, CIF, EXW…). Sin eso el precio no significa nada y no podés comparar ofertas.");

  if (ORDEN_ETAPA.indexOf(d.etapa) >= ORDEN_ETAPA.indexOf("presentada") && !d.acuerdoFirmado)

/* ---------------- lector de anuncios ----------------
   Estos posts casi siempre vienen con la misma estructura de etiquetas,
   en inglés o en español. Leerlas evita teclear el anuncio entero, que
   es donde se pierde la mitad de las ganas de trabajarlo. */

const ETIQUETAS = [
  ["producto", ["producto", "product", "commodity", "mercancia", "mercancía", "goods"]],
  ["cantidad", ["cantidad", "quantity", "volumen", "volume", "qty"]],
  ["paisOrigen", ["proveedor", "supplier", "origen", "origin", "pais de origen", "país de origen", "source", "seller"]],
  ["paisDestino", ["comprador", "buyer", "destino", "destination", "pais destino", "país destino", "delivery"]],
  ["ciudad", ["ciudad", "city", "puerto", "port"]],
  ["requisitos", ["requisitos", "requirements", "specs", "especificaciones", "documentacion", "documentación"]],
  ["incoterm", ["incoterm", "incoterms", "terminos de entrega", "términos de entrega"]],
  ["pago", ["pago", "payment", "terminos de pago", "términos de pago", "payment terms"]],
  ["fee", ["comision", "comisión", "commission", "fee", "finder", "finders fee", "finder's fee"]],
  ["fechaLimite", ["fecha limite", "fecha límite", "deadline", "plazo", "cierre"]],
  ["_purpose", ["proposito", "propósito", "purpose", "uso", "objetivo"]],
];

const UNIDADES_TEXTO = [
  [/\b(toneladas?|tonnes?|tons?|metric tons?|mt|tm)\b/i, "t"],
  [/\b(kilos?|kilogramos?|kg)\b/i, "kg"],
  [/\b(libras?|lbs?|pounds?)\b/i, "lb"],
  [/\b(quintales?|qq)\b/i, "qq"],
  [/\b(contenedores?|containers?|fcl)\b/i, "contenedores"],
];

function limpiarLinea(linea) {
  // Fuera emojis, viñetas y adornos del principio de la línea.
  return linea
    .replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{2BFF}\u{FE0F}\u{20E3}]/gu, " ")
    .replace(/^[\s*\-–—•·>»#]+/, "")
    .replace(/\s+/g, " ")
    .trim();
}

function numeroDe(texto) {
  // "5,000" y "5.000" son ambos cinco mil; "5.5" es cinco y medio.
  const m = (texto || "").match(/[\d][\d.,]*/);
  if (!m) return null;
  let s = m[0].replace(/[.,](?=\d{3}\b)/g, "");
  s = s.replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function parsearAnuncio(texto) {
  const salida = { requisitos: [] };
  const ciudades = [];
  let ultimoLado = null;   // hacia qué lado apunta la próxima "City:"

  limpiarLinea(texto);
  const lineas = (texto || "").split(/\n+/).map(limpiarLinea).filter(Boolean);

  for (const linea of lineas) {
    const corte = linea.match(/^([^:]{2,40}):\s*(.+)$/);
    if (corte) {
      const rotulo = norm(corte[1]).replace(/[^a-z\s']/g, "").trim();
      const valor = corte[2].trim();
      const par = ETIQUETAS.find(function (e) {
        return e[1].some(function (alias) { return rotulo === alias || rotulo.endsWith(" " + alias) || rotulo.startsWith(alias + " "); });
      });
      if (par) {
        const campo = par[0];
        if (campo === "ciudad") { ciudades.push({ lado: ultimoLado, valor: valor }); continue; }
        if (campo === "_purpose") continue;
        if (campo === "paisOrigen") ultimoLado = "origen";
        if (campo === "paisDestino") ultimoLado = "destino";
        if (campo === "requisitos") {
          salida.requisitos = valor.split(/[,;]|\sy\s|\sand\s/).map(function (s) {
            return s.replace(/\.$/, "").trim();
          }).filter(function (s) { return s.length > 2; });
          continue;
        }
        if (campo === "cantidad") {
          const n = numeroDe(valor);
          if (n !== null) salida.cantidad = n;
          for (const [re, u] of UNIDADES_TEXTO) if (re.test(valor)) { salida.unidad = u; break; }
          continue;
        }
        if (campo === "fee") { const n = numeroDe(valor); if (n !== null) salida.fee = n; continue; }
        if (!salida[campo]) salida[campo] = valor;
        continue;
      }
    }

    // Sin etiqueta: la línea del gancho suele traer la comisión.
    if (!salida.fee) {
      const m = linea.match(/(?:earn|gana[rs]?|pago|paga|comisi[oó]n|fee)[^\d$]{0,24}(?:us\$|usd|\$)?\s*([\d][\d.,]*)/i)
        || linea.match(/(?:us\$|usd|\$)\s*([\d][\d.,]*)/i);
      if (m) { const n = numeroDe(m[1]); if (n !== null && n >= 100) salida.fee = n; }
    }
    if (!salida.cantidad) {
      const m = linea.match(/([\d][\d.,]*)\s*(toneladas?|tonnes?|tons?|metric tons?|mt|kg|contenedores?|containers?)/i);
      if (m) {
        const n = numeroDe(m[1]);
        if (n !== null) {
          salida.cantidad = n;
          for (const [re, u] of UNIDADES_TEXTO) if (re.test(m[2])) { salida.unidad = u; break; }
        }
      }
    }
  }

  // Repartir las ciudades: la que sigue al proveedor es origen, la que
  // sigue al comprador es destino. Si vinieron sueltas, en orden.
  const origen = ciudades.filter(function (c) { return c.lado === "origen"; });
  const destino = ciudades.filter(function (c) { return c.lado === "destino"; });
  const sueltas = ciudades.filter(function (c) { return !c.lado; });
  if (origen.length) salida.ciudadOrigen = origen[0].valor;
  if (destino.length) salida.ciudadDestino = destino[0].valor;
  if (!salida.ciudadOrigen && sueltas.length) salida.ciudadOrigen = sueltas.shift().valor;
  if (!salida.ciudadDestino && sueltas.length) salida.ciudadDestino = sueltas.shift().valor;

  if (!salida.unidad && salida.cantidad) salida.unidad = "t";
  return salida;
}

function contarLeidos(campos) {
  return Object.keys(campos).filter(function (k) {
    const v = campos[k];
    return Array.isArray(v) ? v.length > 0 : v !== undefined && v !== "" && v !== null;
  }).length;
}

function partidaHS(producto) {
  const p = clave(producto);
  for (const clave in PARTIDAS_HS) if (p.includes(clave)) return PARTIDAS_HS[clave];
  return null;
}

  transferencia a la cuenta que EL INTERMEDIARIO indique por escrito.
- En operaciones con entregas parciales, la comisión se devenga y paga a
  prorrata de cada embarque.
- Las partes podrán acordar que la comisión se instrumente mediante un IMFPA
  irrevocable incorporado a la carta de crédito; dicho instrumento no sustituye
  ni limita las obligaciones de este acuerdo.

## 5. Incumplimiento

El incumplimiento de las cláusulas 2 o 3 obliga a LA PARTE CONTRATANTE a pagar a
EL INTERMEDIARIO, como pena convencional y sin perjuicio de los daños
adicionales que se acrediten, una suma equivalente al **doble de la comisión**
pactada en la cláusula 4.

## 6. Naturaleza de la relación

Este acuerdo no crea sociedad, mandato, agencia ni relación laboral. EL
INTERMEDIARIO actúa como facilitador independiente, no asume responsabilidad por
el cumplimiento de las obligaciones comerciales entre comprador y vendedor, ni
garantiza calidad, cantidad o entrega de la mercancía.

## 7. Ley aplicable y controversias

Este acuerdo se rige por las leyes de __________. Toda controversia se resolverá
de forma definitiva mediante arbitraje conforme al Reglamento de Arbitraje de la
Cámara de Comercio Internacional (CCI), por un árbitro único, con sede en
__________ y en idioma español.

## 8. Vigencia

Entra en vigor a la fecha de firma y permanece vigente por **veinticuatro (24)
meses**. Las obligaciones de confidencialidad y no elusión sobreviven a su
terminación por el plazo indicado en cada cláusula.

<script id="ui" data-src>
"use strict";

/* ---------------- estado ---------------- */

const CLAVE_LOCAL = "mesa-intermediacion-v1";
let estado = { perfil: {}, deals: [], actualizado: "" };
let ui = { sel: null, tab: "riesgo", modal: null, sucio: false, soloLocal: false, docAbierto: null, borrador: null };
let publicar = null;   // capacidad artifact
let bajar = null;      // capacidad downloads

function esc(s) {
  return (s === null || s === undefined ? "" : String(s))
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function cargarEstado() {
  try {
    const incrustado = JSON.parse(document.getElementById("estado").textContent || "{}");
    estado = Object.assign({ perfil: {}, deals: [], actualizado: "" }, incrustado);
  } catch (e) { /* página nueva */ }
  try {
    const local = JSON.parse(localStorage.getItem(CLAVE_LOCAL) || "null");
    if (local && (local.actualizado || "") > (estado.actualizado || "")) {
      estado = local;
      ui.sucio = true;
    }
  } catch (e) { /* sin almacenamiento local: seguimos igual */ }
}

function tocar() {
  estado.actualizado = new Date().toISOString();
  ui.sucio = true;
  try { localStorage.setItem(CLAVE_LOCAL, JSON.stringify(estado)); } catch (e) { /* modo privado */ }
}

function nuevoId(producto, pais) {
  const trozo = function (t, n) {
    return norm(t).replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(Boolean).slice(0, n).join("-");
  };
  const base = [trozo(producto, 2), trozo(pais, 2)].filter(Boolean).join("-") || "deal";
  const usados = new Set(estado.deals.map(function (d) { return d.id; }));
  let n = 1;
  while (usados.has(base + "-" + n)) n++;
  return base + "-" + n;
}

function dealActual() {
  return estado.deals.find(function (d) { return d.id === ui.sel; }) || null;
}

/* ---------------- guardado ---------------- */

function documentoCompleto() {
  const css = document.getElementById("css").textContent;
  const fuentes = Array.prototype.map.call(document.querySelectorAll("script[data-src]"), function (s) {
    return '<script id="' + s.id + '" data-src>' + s.textContent + "<\/script>";
  }).join("\n");
  const json = JSON.stringify(estado).replace(/</g, "\\u003c");
  return [
    "<!doctype html>",
    '<html lang="es"><head><meta charset="utf-8">',
    '<meta name="viewport" content="width=device-width, initial-scale=1">',
    "<title>Mesa de Intermediación</title>",
    '<link rel="preconnect" href="https://fonts.googleapis.com">',
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Faustina:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">',
    '<style id="css">' + css + "</style></head><body>",
    '<div id="raiz"></div>',
    '<script type="application/json" id="estado">' + json + "<\/script>",
    fuentes,
    "</body></html>",
  ].join("\n");
}

async function guardar() {
  if (!publicar) { brindis("Guardado sólo en este dispositivo: la nube no está disponible acá."); return; }
  const boton = document.getElementById("btn-guardar");
  if (boton) { boton.disabled = true; boton.textContent = "Guardando…"; }
  try {
    await publicar.publish(documentoCompleto());
    // La vista se recarga sola a la versión nueva.
  } catch (error) {
    const codigo = (error && error.code) || "upstream_error";
    if (codigo === "conflict") return;           // ya viene la recarga con la versión ganadora
    if (codigo === "not_writer" || codigo === "not_granted" || codigo === "not_declared") {
      ui.soloLocal = true;
      brindis("Esta vista es de sólo lectura. Tus cambios quedan en este dispositivo.");
    } else if (codigo === "too_large") {
      brindis("El expediente ya no cabe en una versión. Archivá deals cerrados.");
    } else if (codigo === "rate_limited") {
      brindis("Demasiados guardados seguidos. Esperá unos segundos y volvé a intentar.");
    } else {
      brindis("No se pudo guardar en la nube. Tus cambios siguen en este dispositivo.");
    }
    render();
  }
}

let temporizadorBrindis = null;
function brindis(texto) {
  let n = document.getElementById("brindis");
  if (!n) {
    n = document.createElement("div");
    n.id = "brindis";
    n.className = "brindis";
    n.setAttribute("role", "status");
    document.body.appendChild(n);
  }
  n.textContent = texto;
  clearTimeout(temporizadorBrindis);
  temporizadorBrindis = setTimeout(function () { n.remove(); }, 3200);
}

async function copiar(texto) {
  try {
    await navigator.clipboard.writeText(texto);
    brindis("Copiado");
  } catch (e) {
    const a = document.createElement("textarea");
    a.value = texto;
    a.style.position = "fixed";
    a.style.opacity = "0";
    document.body.appendChild(a);
    a.select();
    try { document.execCommand("copy"); brindis("Copiado"); }
    catch (e2) { brindis("No se pudo copiar. Seleccioná el texto a mano."); }
    a.remove();
  }
}

async function descargar(nombre, texto) {
  if (!bajar) { copiar(texto); return; }
  try { await bajar.save({ filename: nombre, data: texto }); }
  catch (error) {
    const c = (error && error.code) || "unavailable";
    if (c === "declined") return;
    brindis("No se pudo descargar. Copiá el texto y pegalo en un documento.");
  }
}
</script>

  const perfilIncompleto = !((estado.perfil || {}).nombre || "").trim();
  const todo = tarjeta("expediente completo",
    '<p style="color:var(--tinta-suave);font-size:13.5px">Los cinco documentos en un solo archivo, para archivar el deal o mandárselo a tu abogado.</p>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    '<button class="btn" data-accion="copiar-expediente">Copiar todo</button>' +
    (bajar ? '<button class="btn" data-accion="bajar-expediente">Descargar .md</button>' : "") +
    "</div>");
  return '<div class="panel">' + todo +
    (perfilIncompleto ? tarjeta("antes de usar el acuerdo",
      '<p>El NCND sale con tus datos en blanco. Cargalos una vez en <strong>Mis datos</strong> y quedan puestos en todos los acuerdos.</p>' +
      '<div><button class="btn" data-accion="perfil">Cargar mis datos</button></div>') : "") +
    cuerpo + "</div>";
}

function panelBitacora(d) {
  const opciones = ETAPAS.map(function (e) {
    return '<option value="' + e[0] + '"' + (d.etapa === e[0] ? " selected" : "") + ">" + e[1] + "</option>";
  }).join("");
  const notas = (d.notas || []).length
    ? d.notas.slice().reverse().map(function (n) {
        return '<div class="nota"><span class="f">' + esc(n.fecha) + "</span><p>" + esc(n.texto) + "</p></div>";
      }).join("")
    : "<p>Sin anotaciones. Anotá cada llamada y cada correo: esa bitácora es tu prueba si después te quieren brincar.</p>";

  return '<div class="panel">' +
    tarjeta("estado del deal",
      '<label class="campo"><span class="etiqueta">etapa</span><select data-accion="etapa">' + opciones + "</select></label>" +
      '<label class="check"><input type="checkbox" data-accion="firmado"' + (d.acuerdoFirmado ? " checked" : "") +
      "> Acuerdo NCND firmado por ambas partes</label>" +
      '<div><button class="btn fantasma chico" data-accion="borrar">Borrar esta oportunidad</button></div>') +
    tarjeta("anotar",
      '<form data-accion="nota"><label class="campo"><span class="etiqueta">qué pasó</span>' +
      '<textarea name="texto" placeholder="Llamé a CONACADO. Piden la LOI antes de cotizar." required></textarea></label>' +
      '<div style="margin-top:10px"><button class="btn" type="submit">Guardar anotación</button></div></form>') +
    tarjeta("bitácora", notas) +
    "</div>";
}

function vistaHoja(clase) {
  const d = dealActual();
  const abre = '<main class="hoja' + (clase || "") + '">';
  if (!d) return abre + vistaVacioHoja() + "</main>";
  const panel = ui.tab === "proveedor" ? panelProveedor(d)
    : ui.tab === "docs" ? panelDocs(d)
    : ui.tab === "bitacora" ? panelBitacora(d)
    : panelRiesgo(d);
  return abre + vistaCabeza(d) + vistaPestanas() + panel + "</main>";
}

function vistaAviso() {
  if (ui.soloLocal) {
    return '<div class="aviso">Esta vista no puede publicar cambios. Lo que cargues queda guardado en este navegador.</div>';
  }
  if (ui.sucio && publicar) {
    return '<div class="aviso">Tenés cambios que sólo están en este dispositivo.' +
      '<button class="btn chico" data-accion="guardar">Guardar ahora</button></div>';
  }
  return "";
}

function render() {
  const movil = window.matchMedia("(max-width: 900px)").matches;
  const ocultaRail = movil && ui.sel ? " oculta" : "";
  const ocultaHoja = movil && !ui.sel ? " oculta" : "";
  document.getElementById("raiz").innerHTML =
    '<div class="marco">' + vistaBarra() + vistaAviso() +
    '<div class="cuerpo"><aside class="rail' + ocultaRail + '">' + vistaResumen() + vistaLista() + "</aside>" +
    vistaHoja(ocultaHoja) + "</div></div>" +
    (ui.modal ? vistaModal() : "");
}
</script>
<script id="eventos" data-src>
"use strict";

/* ---------------- modales ---------------- */

function campo(rot, nombre, valor, tipo, ancho, extra) {
  return '<label class="campo' + (ancho ? " ancho" : "") + '"><span class="etiqueta">' + rot + "</span>" +
    '<input type="' + (tipo || "text") + '" name="' + nombre + '" value="' + esc(valor || "") + '" ' + (extra || "") + "></label>";
}

function vistaModal() {
  if (ui.modal === "perfil") {
    const p = estado.perfil || {};
    return '<div class="velo" data-accion="velo"><div class="modal" role="dialog" aria-modal="true">' +
      "<header><h2>Mis datos</h2><span class=\"crece\"></span>" +
      '<button class="btn fantasma chico" data-accion="cerrar">Cerrar</button></header>' +
      '<form data-accion="guardar-perfil"><p style="color:var(--tinta-suave);font-size:13.5px">' +
      "Van en el acuerdo NCND cada vez que lo generes. Se cargan una sola vez.</p>" +
      '<div class="rejilla">' +
      campo("nombre completo", "nombre", p.nombre) +
      campo("empresa", "empresa", p.empresa) +
      campo("documento / RNC", "documento", p.documento) +
      campo("teléfono", "telefono", p.telefono) +
      campo("correo", "email", p.email) +
      campo("domicilio", "domicilio", p.domicilio, "text", true) +
      "</div><footer>" +
      '<button class="btn fantasma" type="button" data-accion="cerrar">Cancelar</button>' +
      '<button class="btn primario" type="submit">Guardar datos</button></footer></form></div></div>';
  }

  const editando = ui.modal === "editar";
  const d = editando ? dealActual() : (ui.borrador || { unidad: "t", etapa: "captada", requisitos: [] });
  if (!d) return "";
  const pegar = editando ? "" :
    '<div class="pegar"><label class="campo"><span class="etiqueta">pegá el anuncio y lo leo por vos</span>' +
    '<textarea name="anuncio" rows="4" placeholder="EARN $55,000 IF YOU CAN CONNECT US TO…&#10;Product: Premium cocoa beans&#10;Quantity: 5,000 tonnes">' +
    esc(d.anuncio || "") + "</textarea></label>" +
    '<div><button class="btn" type="button" data-accion="leer-anuncio">Leer anuncio</button></div></div>';
  return '<div class="velo" data-accion="velo"><div class="modal" role="dialog" aria-modal="true">' +
    "<header><h2>" + (editando ? "Editar oportunidad" : "Nueva oportunidad") + "</h2>" +
    '<span class="crece"></span><button class="btn fantasma chico" data-accion="cerrar">Cerrar</button></header>' +
    '<form data-accion="guardar-deal">' + pegar + '<div class="rejilla">' +
    campo("producto", "producto", d.producto, "text", true, "required placeholder=\"cacao en grano\"") +
    campo("cantidad", "cantidad", d.cantidad, "number", false, 'step="any" min="0"') +
    '<label class="campo"><span class="etiqueta">unidad</span><select name="unidad">' +
      ["t", "kg", "lb", "qq", "unidades", "contenedores"].map(function (u) {
        return '<option value="' + u + '"' + ((d.unidad || "t") === u ? " selected" : "") + ">" + u + "</option>";
      }).join("") + "</select></label>" +
    campo("precio por unidad (USD)", "precio", d.precio, "number", false, 'step="any" min="0" placeholder="opcional"') +
    campo("comisión para vos (USD)", "fee", d.fee, "number", false, 'step="any" min="0"') +
    campo("país de origen", "paisOrigen", d.paisOrigen, "text", false, 'placeholder="República Dominicana"') +
    campo("ciudad de origen", "ciudadOrigen", d.ciudadOrigen) +
    campo("país de destino", "paisDestino", d.paisDestino) +
    campo("ciudad de destino", "ciudadDestino", d.ciudadDestino) +
    campo("comprador final", "comprador", d.comprador, "text", true, 'placeholder="razón social, si te la dieron"') +
    campo("incoterm", "incoterm", d.incoterm, "text", false, 'placeholder="FOB, CIF, EXW…"') +
    campo("términos de pago", "pago", d.pago, "text", false, 'placeholder="carta de crédito a la vista"') +
    campo("fecha límite", "fechaLimite", d.fechaLimite, "date") +
    campo("dónde lo viste", "fuente", d.fuente, "text", false, 'placeholder="Instagram @cuenta"') +
    '<label class="campo ancho"><span class="etiqueta">requisitos del comprador (uno por línea)</span>' +
    '<textarea name="requisitos" placeholder="Trazabilidad&#10;Especificaciones de fermentación">' +
    esc((d.requisitos || []).join("\n")) + "</textarea></label>" +
    "</div><footer>" +
    '<button class="btn fantasma" type="button" data-accion="cerrar">Cancelar</button>' +
    '<button class="btn primario" type="submit">' + (editando ? "Guardar cambios" : "Crear oportunidad") + "</button>" +
    "</footer></form></div></div>";
}

/* ---------------- eventos ---------------- */

function accionDe(nodo) {
  const el = nodo.closest("[data-accion]");
  return el ? { el: el, valor: el.getAttribute("data-accion") } : null;
}

document.addEventListener("click", function (evento) {
  const a = accionDe(evento.target);
  if (!a) return;
  const [verbo, arg] = a.valor.split(":");

  if (verbo === "velo" && evento.target !== a.el) return; // clic dentro del modal

  switch (verbo) {
    case "nuevo": ui.modal = "nuevo"; ui.borrador = null; render(); break;
    case "editar": ui.modal = "editar"; render(); break;
    case "perfil": ui.modal = "perfil"; render(); break;
    case "cerrar": case "velo": ui.modal = null; ui.borrador = null; render(); break;
    case "leer-anuncio": {
      const form = a.el.closest("form");
      const actuales = Object.fromEntries(new FormData(form).entries());
      const leido = parsearAnuncio(actuales.anuncio || "");
      const cuantos = contarLeidos(leido);
      if (!cuantos) { brindis("No pude sacar campos de ese texto. Cargalos a mano."); break; }
      const base = Object.assign({}, actuales);
      base.requisitos = (actuales.requisitos || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
      for (const campo in leido) {
        const valor = leido[campo];
        const tiene = Array.isArray(valor) ? valor.length > 0 : valor !== "" && valor !== undefined && valor !== null;
        if (tiene) base[campo] = valor;
      }
      ui.borrador = base;
      render();
      brindis(cuantos + (cuantos === 1 ? " campo leído" : " campos leídos") + ". Revisá antes de crear.");
      break;
    }
    case "copiar-expediente": copiar(expediente(dealActual(), estado.perfil)); break;
    case "bajar-expediente": descargar("expediente-" + dealActual().id + ".md", expediente(dealActual(), estado.perfil)); break;
    case "guardar": guardar(); break;
    case "volver": ui.sel = null; render(); break;
    case "sel": ui.sel = arg; ui.tab = "riesgo"; ui.docAbierto = null; render(); break;
    case "tab": ui.tab = arg; render(); break;
    case "doc": ui.docAbierto = ui.docAbierto === arg ? null : arg; render(); break;
    case "copiar-texto": copiar(a.el.getAttribute("data-texto")); break;
    case "copiar-doc": {
      const doc = DOCUMENTOS.find(function (x) { return x[0] === arg; });
      if (doc) copiar(doc[3](dealActual(), estado.perfil));
      break;
    }
    case "bajar-doc": {
      const doc = DOCUMENTOS.find(function (x) { return x[0] === arg; });
      if (doc) descargar(arg + "-" + dealActual().id + ".md", doc[3](dealActual(), estado.perfil));
      break;
    }
    case "borrar": {
      const d = dealActual();
      if (d && confirm("¿Borrar “" + (d.producto || d.id) + "” y toda su bitácora?")) {
        estado.deals = estado.deals.filter(function (x) { return x.id !== d.id; });
        ui.sel = null;
        tocar(); render();
      }
      break;
    }
  }
});

document.addEventListener("submit", function (evento) {
  const a = accionDe(evento.target);
  if (!a) return;
  evento.preventDefault();
  const datos = Object.fromEntries(new FormData(evento.target).entries());

  if (a.valor === "guardar-perfil") {
    estado.perfil = datos;
    ui.modal = null;
    tocar(); render();
    brindis("Datos guardados");
    return;
  }

  if (a.valor === "guardar-deal") {
    const requisitos = (datos.requisitos || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    if (ui.modal === "editar") {
      const d = dealActual();
      Object.assign(d, datos, { requisitos: requisitos });
    } else {
      const id = nuevoId(datos.producto, datos.paisOrigen);
      estado.deals.unshift(Object.assign({
        id: id, etapa: "captada", acuerdoFirmado: false, notas: [],
        creado: new Date().toISOString().slice(0, 10),
      }, datos, { requisitos: requisitos }));
      ui.sel = id;
      ui.tab = "riesgo";
    }
    ui.modal = null;
    ui.borrador = null;
    tocar(); render();
    return;
  }

  if (a.valor === "nota") {
    const d = dealActual();
    if (d && (datos.texto || "").trim()) {
      d.notas = d.notas || [];
      d.notas.push({ fecha: new Date().toISOString().slice(0, 10), texto: datos.texto.trim() });
      tocar(); render();
    }
  }
});

document.addEventListener("change", function (evento) {
  const a = accionDe(evento.target);
  if (!a) return;
  const d = dealActual();
  if (!d) return;
  if (a.valor === "etapa") { d.etapa = evento.target.value; tocar(); render(); }
  if (a.valor === "firmado") { d.acuerdoFirmado = evento.target.checked; tocar(); render(); }
});

document.addEventListener("keydown", function (evento) {
  if (evento.key === "Escape" && ui.modal) { ui.modal = null; render(); }
});

window.addEventListener("resize", function () { render(); });

/* ---------------- arranque ---------------- */

cargarEstado();
render();

if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("artifact").then(function (cap) {
    publicar = cap;
    if (!cap) ui.soloLocal = true;
    render();
  });
  window.claude.use("downloads").then(function (cap) { bajar = cap; render(); });
} else {
  ui.soloLocal = true;
  render();
}
</script>
