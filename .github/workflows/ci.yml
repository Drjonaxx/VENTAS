name: Pruebas

# Cada push y cada PR abre la app y los planes en Chromium: sin errores
# de JavaScript, el lector de anuncios saca los campos de un post real y
# el filtro de riesgo frena la jerga de fraude.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navegador:
    # Fijo, no 'latest'. El 21 de noviembre de 2026 'ubuntu-latest' pasó a
    # Ubuntu 26.04 y Playwright 1.56.1 dejó de instalar Chromium ahí
    # ("Playwright does not support chromium on ubuntu26.04-x64"): dos
    # commits en rojo sin que una sola prueba llegara a correr. Al subir
    # Playwright se sube también esta imagen, juntas y a propósito.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Playwright
        working-directory: pruebas
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Abrir la app en Chromium
        run: node pruebas/navegador.mjs
